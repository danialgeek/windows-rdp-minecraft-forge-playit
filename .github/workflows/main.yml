
name: Windows RDP + Minecraft Forge + Playit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      SERVER_DIR: C:\Users\Public\Desktop\Minecraft
      DESKTOP_DIR: C:\Users\Public\Desktop
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Latest Full Desktop Backup
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          Write-Host "Searching for latest desktop backup..."

          $release = gh release list --repo $env:GITHUB_REPOSITORY --limit 1 --json tagName | ConvertFrom-Json

          if (-not $release -or -not $release[0].tagName) {
            Write-Host "No previous backup found."
            exit 0
          }

          $tag = $release[0].tagName
          $downloadDir = Join-Path $env:RUNNER_TEMP "DesktopRestore"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          gh release download $tag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "Minecraft-EmergencyBackup.zip" `
            --dir $downloadDir

          $zip = Join-Path $downloadDir "Minecraft-EmergencyBackup.zip"

          if (-not (Test-Path $zip)) {
            Write-Host "Backup asset not found."
            exit 0
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "DesktopExtract"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          tar.exe -xf $zip -C $extractDir

          if ($LASTEXITCODE -ne 0) {
            throw "Backup extraction failed."
          }

          robocopy $extractDir $env:DESKTOP_DIR /E /COPY:DAT /DCOPY:DAT /R:2 /W:2
          $rc = $LASTEXITCODE

          if ($rc -ge 8) {
            throw "Desktop restore failed. Robocopy code: $rc"
          }

          Write-Host "Full desktop restored successfully."

      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $DesktopDir = $env:DESKTOP_DIR

          New-Item -ItemType Directory -Force -Path $ServerDir | Out-Null

          if (-not (Test-Path "$ServerDir\run.bat")) {
            throw "run.bat not found in $ServerDir. Check the restored Minecraft folder."
          }

          $rconPassword = [Convert]::ToBase64String(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          ).Replace("=","").Replace("+","A").Replace("/","B")

          "RCON_PASSWORD=$rconPassword" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $properties = Join-Path $ServerDir "server.properties"

          if (Test-Path $properties) {
            $content = Get-Content $properties -Raw
          } else {
            $content = ""
          }

          $settings = @{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $rconPassword
          }

          foreach ($key in $settings.Keys) {
            $line = "$key=$($settings[$key])"

            if ($content -match "(?m)^$([regex]::Escape($key))=.*$") {
              $content = [regex]::Replace(
                $content,
                "(?m)^$([regex]::Escape($key))=.*$",
                [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $line }
              )
            } else {
              $content += "`r`n$line"
            }
          }

          Set-Content -Path $properties -Value $content -Encoding ascii

          @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0Minecraft"
          call run.bat nogui
          pause
          '@ | Set-Content "$DesktopDir\START MINECRAFT SERVER.bat" -Encoding ascii

          @'
          @echo off
          title Stop Minecraft and Backup
          if not exist "%~dp0Minecraft" (
            echo Minecraft folder not found.
            pause
            exit /b
          )
          echo STOP>"%~dp0Minecraft\STOP_SERVER.txt"
          echo Stop request sent.
          echo Wait for GitHub Actions to finish the backup.
          pause
          '@ | Set-Content "$DesktopDir\STOP SERVER + BACKUP.bat" -Encoding ascii

          Remove-Item "$ServerDir\STOP_SERVER.txt" -Force -ErrorAction SilentlyContinue

          Write-Host "Minecraft server prepared."
          Write-Host "Desktop: $DesktopDir"
          Write-Host "Server: $ServerDir"

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $username = "NvDAdmin"
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $username -Password $securePassword
          } else {
            New-LocalUser -Name $username -Password $securePassword -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured."
          Write-Host "Username: NvDAdmin"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $tailscale up "--authkey=$env:TAILSCALE_AUTHKEY" --hostname=danialgeek-minecraft --accept-routes

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $ip = & $tailscale ip -4
          Write-Host "=================================="
          Write-Host "RDP IP: $ip"
          Write-Host "RDP Port: 3389"
          Write-Host "RDP Username: NvDAdmin"
          Write-Host "=================================="

      - name: Start Playit
        shell: pwsh
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET_KEY)) {
            throw "PLAYIT_SECRET_KEY secret is missing."
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/playit-cloud/playit-agent/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -eq "playit-windows-x86_64.exe" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Playit Windows executable not found in latest release."
          }

          $playitDir = "$env:RUNNER_TEMP\Playit"
          New-Item -ItemType Directory -Force -Path $playitDir | Out-Null

          $playitExe = Join-Path $playitDir "playit.exe"

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $playitExe

          $playitLog = Join-Path $playitDir "playit.log"

          $playitProcess = Start-Process `
            -FilePath $playitExe `
            -ArgumentList @("--secret", $env:PLAYIT_SECRET_KEY) `
            -WorkingDirectory $playitDir `
            -RedirectStandardOutput $playitLog `
            -RedirectStandardError "$playitDir\playit-error.log" `
            -PassThru

          Start-Sleep -Seconds 10

          if ($playitProcess.HasExited) {
            Get-Content $playitLog -ErrorAction SilentlyContinue
            Get-Content "$playitDir\playit-error.log" -ErrorAction SilentlyContinue
            throw "Playit exited unexpectedly."
          }

          Write-Host "Playit process started."

      - name: Start Minecraft Forge Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR

          $java = (Get-Command java.exe).Source

          Write-Host "Java:"
          & $java -version

          $stdout = Join-Path $ServerDir "server-output.log"
          $stderr = Join-Path $ServerDir "server-error.log"

          $proc = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList @("/c", "run.bat nogui") `
            -WorkingDirectory $ServerDir `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          $proc.Id | Set-Content "$env:RUNNER_TEMP\minecraft-launcher.pid"

          Start-Sleep -Seconds 20

          if ($proc.HasExited) {
            Get-Content $stdout -Tail 80 -ErrorAction SilentlyContinue
            Get-Content $stderr -Tail 80 -ErrorAction SilentlyContinue
            throw "Minecraft server launcher exited."
          }

          Write-Host "Minecraft Forge server launched."
          Write-Host "Memory settings are controlled by the Forge user_jvm_args.txt file."

      - name: Wait for Stop Request
        shell: pwsh
        timeout-minutes: 310
        run: |
          $ErrorActionPreference = "Stop"

          $marker = Join-Path $env:SERVER_DIR "STOP_SERVER.txt"

          Write-Host "Server is running."
          Write-Host "Create STOP_SERVER.txt or use STOP SERVER + BACKUP.bat to stop it."

          $deadline = (Get-Date).AddMinutes(309)

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $marker) {
              Write-Host "Stop request detected."
              break
            }

            $procFile = "$env:RUNNER_TEMP\minecraft-launcher.pid"

            if (Test-Path $procFile) {
              $pidValue = [int](Get-Content $procFile -Raw)
              $proc = Get-Process -Id $pidValue -ErrorAction SilentlyContinue

              if (-not $proc) {
                Write-Host "Minecraft launcher has exited."
                break
              }
            }

            Start-Sleep -Seconds 5
          }

          Write-Host "Wait step finished."

      - name: Stop Minecraft Safely
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Continue"

          $password = $env:RCON_PASSWORD
          $client = $null

          function Read-RconPacket($stream) {
            $lengthBytes = New-Object byte[] 4
            $read = 0

            while ($read -lt 4) {
              $count = $stream.Read($lengthBytes, $read, 4 - $read)
              if ($count -le 0) { throw "RCON connection closed." }
              $read += $count
            }

            $length = [BitConverter]::ToInt32($lengthBytes, 0)
            $buffer = New-Object byte[] $length
            $read = 0

            while ($read -lt $length) {
              $count = $stream.Read($buffer, $read, $length - $read)
              if ($count -le 0) { throw "RCON packet incomplete." }
              $read += $count
            }

            return $buffer
          }

          function Send-RconPacket($stream, [int]$id, [int]$type, [string]$body) {
            $payload = [Text.Encoding]::UTF8.GetBytes($body)
            $length = 4 + 4 + $payload.Length + 2
            $packet = New-Object byte[] ($length + 4)

            [BitConverter]::GetBytes([int]$length).CopyTo($packet, 0)
            [BitConverter]::GetBytes([int]$id).CopyTo($packet, 4)
            [BitConverter]::GetBytes([int]$type).CopyTo($packet, 8)
            $payload.CopyTo($packet, 12)

            $stream.Write($packet, 0, $packet.Length)
            $stream.Flush()
          }

          try {
            $client = [Net.Sockets.TcpClient]::new()
            $client.ReceiveTimeout = 5000
            $client.SendTimeout = 5000
            $client.Connect("127.0.0.1", 25575)
            $stream = $client.GetStream()

            Send-RconPacket $stream 100 3 $password
            $auth = Read-RconPacket $stream
            $authId = [BitConverter]::ToInt32($auth, 0)

            if ($authId -ne 100) {
              throw "RCON authentication failed."
            }

            Send-RconPacket $stream 101 2 "stop"
            Write-Host "RCON stop command sent."
          }
          catch {
            Write-Host "RCON stop failed: $_"
          }
          finally {
            if ($client) { $client.Close() }
          }

          Write-Host "Waiting for Minecraft to shut down..."

          $end = (Get-Date).AddSeconds(120)

          while ((Get-Date) -lt $end) {
            $javaProcesses = Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
              Where-Object { $_.CommandLine -match "forge|win_args\.txt" }

            if (-not $javaProcesses) {
              Write-Host "Minecraft Java process has stopped."
              break
            }

            Start-Sleep -Seconds 5
          }

          $remaining = Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
            Where-Object { $_.CommandLine -match "forge|win_args\.txt" }

          if ($remaining) {
            Write-Warning "Minecraft is still running. Attempting final shutdown."

            foreach ($p in $remaining) {
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Minecraft shutdown stage finished."

      - name: Create Full Desktop Emergency Backup
        if: always()
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $BackupDir = Join-Path $env:RUNNER_TEMP "DesktopBackup"
          $Zip = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashFile = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (-not (Test-Path $DesktopDir)) {
            throw "Desktop directory does not exist."
          }

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "Copying full Public Desktop..."

          robocopy $DesktopDir $BackupDir /E /COPY:DAT /DCOPY:DAT /R:1 /W:1
          $rc = $LASTEXITCODE

          if ($rc -ge 8) {
            throw "Desktop copy failed. Robocopy code: $rc"
          }

          if (Test-Path $Zip) {
            Remove-Item $Zip -Force
          }

          Write-Host "Creating ZIP archive..."

          tar.exe -a -c -f $Zip -C $BackupDir .

          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $Zip)) {
            throw "ZIP creation failed."
          }

          $hash = (Get-FileHash $Zip -Algorithm SHA256).Hash
          "$hash  Minecraft-EmergencyBackup.zip" |
            Set-Content $HashFile -Encoding ascii

          Write-Host "Backup created."
          Write-Host "ZIP size: $((Get-Item $Zip).Length / 1MB) MB"
          Write-Host "SHA256: $hash"

      - name: Upload Full Desktop Backup to GitHub Release
        if: always()
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"

          $Zip = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashFile = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (-not (Test-Path $Zip)) {
            throw "Backup ZIP not found. Upload skipped."
          }

          if (-not (Test-Path $HashFile)) {
            throw "Backup SHA256 file not found."
          }

          $tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          gh release create $tag `
            $Zip `
            $HashFile `
            --repo $env:GITHUB_REPOSITORY `
            --title "Minecraft Full Desktop Backup $env:GITHUB_RUN_ID" `
            --notes "Automatic full Public Desktop backup."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup uploaded successfully."
          Write-Host "Release tag: $tag"

      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "Workflow finished."
          Write-Host "Desktop backup and cleanup were attempted."
          Write-Host "=================================="
