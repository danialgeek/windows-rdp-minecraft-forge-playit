name: Windows RDP + Minecraft Forge + Tailscale + Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: 'C:\Users\NvDAdmin\Desktop'
      SERVER_DIR: 'C:\Users\NvDAdmin\Desktop\Minecraft'
      BACKUP_PREFIX: 'minecraft-backup-'
      RCON_PORT: '25575'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------
      # 1. Create RDP user and enable Remote Desktop
      # -----------------------------------------------
      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'RDP_PASSWORD secret is missing.'
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'NvDAdmin' -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name 'NvDAdmin' `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires | Out-Null
          }
          else {
            Set-LocalUser -Name 'NvDAdmin' -Password $securePassword -PasswordNeverExpires $true
          }

          Add-LocalGroupMember -Group 'Administrators' -Member 'NvDAdmin' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'NvDAdmin' -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          $credential = [PSCredential]::new('NvDAdmin', $securePassword)

          Start-Process `
            -FilePath "$env:SystemRoot\System32\cmd.exe" `
            -ArgumentList '/c exit' `
            -Credential $credential `
            -LoadUserProfile `
            -Wait `
            -WindowStyle Hidden

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:SERVER_DIR | Out-Null

          Write-Host 'RDP account configured.'
          Write-Host "Desktop: $env:DESKTOP_DIR"

      # -----------------------------------------------
      # 2. Install and connect Tailscale
      # -----------------------------------------------
      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw 'TAILSCALE_AUTHKEY secret is missing.'
          }

          $msi = Join-Path $env:RUNNER_TEMP 'tailscale-setup.msi'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $msi

          $install = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($install.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($install.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw 'Tailscale executable was not found.'
          }

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            '--hostname=danialgeek-minecraft' `
            '--accept-dns=false' `
            '--accept-routes=false'

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed: $LASTEXITCODE"
          }

          Start-Sleep -Seconds 5

          Write-Host 'Tailscale IPv4:'
          & $tailscale ip -4

      # -----------------------------------------------
      # 3. Restore latest valid backup from Releases
      # -----------------------------------------------
      - name: Restore latest Minecraft backup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $repo = $env:GITHUB_REPOSITORY
          $desktop = $env:DESKTOP_DIR
          $work = Join-Path $env:RUNNER_TEMP 'MinecraftRestore'

          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $releaseJson = gh release list `
            --repo $repo `
            --limit 100 `
            --json tagName,createdAt,isDraft,isPrerelease

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not list GitHub Releases.'
          }

          $releases = @($releaseJson | ConvertFrom-Json)

          $targets = @(
            $releases |
              Where-Object {
                $_.tagName.StartsWith($env:BACKUP_PREFIX) -and
                -not $_.isDraft -and
                -not $_.isPrerelease
              } |
              Sort-Object { [datetime]$_.createdAt } -Descending
          )

          if ($targets.Count -eq 0) {
            Write-Host 'No previous Minecraft backup found. Starting with an empty Desktop.'
          }
          else {
            $restored = $false

            foreach ($release in $targets) {
              $tag = $release.tagName
              $candidate = Join-Path $work ([guid]::NewGuid().ToString())
              $extract = Join-Path $candidate 'Extracted'

              New-Item -ItemType Directory -Force -Path $candidate | Out-Null
              New-Item -ItemType Directory -Force -Path $extract | Out-Null

              Write-Host "Checking backup: $tag"

              $metadataJson = gh release view $tag `
                --repo $repo `
                --json assets

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not read release metadata: $tag"
                continue
              }

              $metadata = $metadataJson | ConvertFrom-Json
              $assetNames = @($metadata.assets | ForEach-Object { $_.name })

              if ($assetNames -notcontains 'Minecraft-EmergencyBackup.zip') {
                Write-Warning "ZIP asset missing in $tag"
                continue
              }

              gh release download $tag `
                --repo $repo `
                --pattern 'Minecraft-EmergencyBackup.zip' `
                --dir $candidate

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not download ZIP from $tag"
                continue
              }

              $zip = Join-Path $candidate 'Minecraft-EmergencyBackup.zip'

              if (-not (Test-Path $zip)) {
                Write-Warning "ZIP file missing after download: $tag"
                continue
              }

              if ($assetNames -contains 'Minecraft-EmergencyBackup.sha256') {
                gh release download $tag `
                  --repo $repo `
                  --pattern 'Minecraft-EmergencyBackup.sha256' `
                  --dir $candidate

                if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Could not download SHA256 from $tag"
                  continue
                }

                $shaFile = Join-Path $candidate 'Minecraft-EmergencyBackup.sha256'

                if (-not (Test-Path $shaFile)) {
                  Write-Warning "SHA256 file missing in $tag"
                  continue
                }

                $expected = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0]
                $actual = (Get-FileHash $zip -Algorithm SHA256).Hash

                if ($actual -ne $expected) {
                  Write-Warning "SHA256 mismatch. Skipping $tag"
                  continue
                }

                Write-Host 'SHA256 verified.'
              }
              else {
                Write-Warning "This older release has no SHA256 asset. Continuing without hash verification."
              }

              & tar.exe -xf $zip -C $extract

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not extract $tag"
                continue
              }

              & robocopy $extract $desktop /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ

              $copyCode = $LASTEXITCODE

              if ($copyCode -ge 8) {
                throw "Restore copy failed. Robocopy exit code: $copyCode"
              }

              Write-Host "Restore successful: $tag"
              $restored = $true
              break
            }

            if (-not $restored) {
              throw 'No valid backup could be restored. Check the Releases and ZIP files.'
            }
          }

      # -----------------------------------------------
      # 4. Configure Minecraft RCON and create launcher
      # -----------------------------------------------
      - name: Configure Minecraft and prepare manual launcher
        id: prepare
        shell: pwsh
        env:
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RCON_PASSWORD)) {
            throw 'RCON_PASSWORD secret is missing.'
          }

          $server = $env:SERVER_DIR
          $properties = Join-Path $server 'server.properties'

          New-Item -ItemType Directory -Force -Path $server | Out-Null

          if (Test-Path $properties) {
            $lines = @(Get-Content $properties)
          }
          else {
            $lines = @()
          }

          $settings = [ordered]@{
            'enable-rcon' = 'true'
            'rcon.port' = $env:RCON_PORT
            'rcon.password' = $env:RCON_PASSWORD
          }

          foreach ($key in $settings.Keys) {
            $pattern = '^' + [regex]::Escape($key) + '='
            $lines = @($lines | Where-Object { $_ -notmatch $pattern })
            $lines += "$key=$($settings[$key])"
          }

          Set-Content -LiteralPath $properties -Value $lines -Encoding utf8

          $desktop = $env:DESKTOP_DIR
          $startScript = Join-Path $desktop 'START MINECRAFT SERVER.ps1'
          $startBat = Join-Path $desktop 'START MINECRAFT SERVER.bat'

          $ps1 = @'
          $ErrorActionPreference = 'Stop'

          $serverDir = Join-Path $env:USERPROFILE 'Desktop\Minecraft'
          $runFile = Join-Path $serverDir 'run.bat'

          if (-not (Test-Path $runFile)) {
              Write-Host 'run.bat was not found in the Minecraft folder.'
              Read-Host 'Press Enter to close'
              exit 1
          }

          $pidFile = Join-Path $serverDir 'server.pid'

          $process = Start-Process `
              -FilePath $env:ComSpec `
              -ArgumentList '/c run.bat' `
              -WorkingDirectory $serverDir `
              -PassThru

          Set-Content -LiteralPath $pidFile -Value $process.Id

          Write-Host "Minecraft launcher started. PID: $($process.Id)"
          '@

          Set-Content -LiteralPath $startScript -Value $ps1 -Encoding utf8

          $bat = @'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0START MINECRAFT SERVER.ps1"
          pause
          '@

          Set-Content -LiteralPath $startBat -Value $bat -Encoding ascii

          Write-Host 'RCON configured.'
          Write-Host "Server folder: $server"
          Write-Host "Manual launcher: $startBat"

          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # -----------------------------------------------
      # 5. Keep the runner alive until Cancel is clicked
      # -----------------------------------------------
      - name: Keep runner alive
        shell: pwsh
        timeout-minutes: 350
        run: |
          Write-Host 'RDP is ready.'
          Write-Host 'Start Minecraft manually using START MINECRAFT SERVER.bat on the Desktop.'
          Write-Host 'When finished, click Cancel workflow to stop, back up and shut down.'

          while ($true) {
            Start-Sleep -Seconds 15
          }

      # -----------------------------------------------
      # 6. Stop Minecraft, back up Desktop, upload Release
      # -----------------------------------------------
      - name: Stop Minecraft, create backup and shut down
        if: ${{ always() && steps.prepare.outputs.ready == 'true' }}
        shell: pwsh
        env:
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $server = $env:SERVER_DIR
          $desktop = $env:DESKTOP_DIR
          $pidFile = Join-Path $server 'server.pid'

          function Get-RconListener {
            Get-NetTCPConnection `
              -LocalPort ([int]$env:RCON_PORT) `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          function Read-ExactBytes {
            param(
              [System.IO.Stream]$Stream,
              [int]$Count
            )

            $buffer = New-Object byte[] $Count
            $offset = 0

            while ($offset -lt $Count) {
              $read = $Stream.Read($buffer, $offset, $Count - $offset)

              if ($read -le 0) {
                throw 'RCON connection closed unexpectedly.'
              }

              $offset += $read
            }

            return ,$buffer
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $payload = [System.Text.Encoding]::UTF8.GetBytes($Body)
            $length = 4 + 4 + $payload.Length + 2
            $packet = New-Object byte[] ($length + 4)

            [BitConverter]::GetBytes([int]$length).CopyTo($packet, 0)
            [BitConverter]::GetBytes([int]$Id).CopyTo($packet, 4)
            [BitConverter]::GetBytes([int]$Type).CopyTo($packet, 8)

            if ($payload.Length -gt 0) {
              [Array]::Copy($payload, 0, $packet, 12, $payload.Length)
            }

            $packet[$packet.Length - 2] = 0
            $packet[$packet.Length - 1] = 0

            $Stream.Write($packet, 0, $packet.Length)
            $Stream.Flush()
          }

          function Read-RconPacket {
            param([System.IO.Stream]$Stream)

            $lengthBytes = Read-ExactBytes -Stream $Stream -Count 4
            $length = [BitConverter]::ToInt32($lengthBytes, 0)

            if ($length -lt 10 -or $length -gt 65536) {
              throw "Invalid RCON packet length: $length"
            }

            $data = Read-ExactBytes -Stream $Stream -Count $length

            [pscustomobject]@{
              Id = [BitConverter]::ToInt32($data, 0)
              Type = [BitConverter]::ToInt32($data, 4)
              Body = [System.Text.Encoding]::UTF8.GetString($data, 8, $length - 10)
            }
          }

          function Invoke-MinecraftRconStop {
            $client = [System.Net.Sockets.TcpClient]::new()

            try {
              $connect = $client.ConnectAsync('127.0.0.1', [int]$env:RCON_PORT)

              if (-not $connect.Wait(5000)) {
                throw 'RCON connection timed out.'
              }

              $stream = $client.GetStream()
              $stream.ReadTimeout = 5000
              $stream.WriteTimeout = 5000

              Send-RconPacket -Stream $stream -Id 1 -Type 3 -Body $env:RCON_PASSWORD
              $auth = Read-RconPacket -Stream $stream

              if ($auth.Id -eq -1) {
                throw 'RCON authentication failed. Check RCON_PASSWORD.'
              }

              if ($auth.Id -ne 1) {
                throw 'Unexpected RCON authentication response.'
              }

              Send-RconPacket -Stream $stream -Id 2 -Type 2 -Body 'stop'
              $null = Read-RconPacket -Stream $stream

              Write-Host 'RCON stop command sent.'
            }
            finally {
              $client.Dispose()
            }
          }

          Write-Host 'Checking Minecraft server status...'

          $listener = Get-RconListener
          $wrapperPid = $null

          if (Test-Path $pidFile) {
            $rawPid = (Get-Content $pidFile -Raw).Trim()

            if ($rawPid -match '^\d+$') {
              $wrapperPid = [int]$rawPid
            }
          }

          $wrapperAlive = $false

          if ($wrapperPid) {
            $wrapperAlive = $null -ne (Get-Process -Id $wrapperPid -ErrorAction SilentlyContinue)
          }

          $forgeProcesses = @(
            Get-CimInstance Win32_Process |
              Where-Object {
                $_.Name -match '^javaw?\.exe$' -and
                $_.CommandLine -match 'win_args\.txt|forge.*1\.20\.1|minecraft_server'
              }
          )

          if ($null -eq $listener -and ($wrapperAlive -or $forgeProcesses.Count -gt 0)) {
            Write-Host 'Minecraft appears to be starting. Waiting for RCON...'

            $deadline = (Get-Date).AddMinutes(3)

            while ($null -eq $listener -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 3
              $listener = Get-RconListener
            }

            if ($null -eq $listener) {
              throw 'Minecraft process exists, but RCON did not become available. Backup stopped to protect world data.'
            }
          }

          if ($null -ne $listener) {
            $serverPid = [int]$listener.OwningProcess

            Write-Host "Minecraft process PID: $serverPid"

            Invoke-MinecraftRconStop

            $deadline = (Get-Date).AddMinutes(3)

            while ($null -ne (Get-Process -Id $serverPid -ErrorAction SilentlyContinue)) {
              if ((Get-Date) -gt $deadline) {
                throw 'Minecraft did not exit within 3 minutes. Backup cancelled to protect world data.'
              }

              Start-Sleep -Seconds 2
            }

            if ($wrapperPid) {
              $deadline = (Get-Date).AddSeconds(30)

              while (
                $null -ne (Get-Process -Id $wrapperPid -ErrorAction SilentlyContinue) -and
                (Get-Date) -lt $deadline
              ) {
                Start-Sleep -Seconds 2
              }
            }

            Write-Host 'Minecraft has fully stopped.'
          }
          else {
            Write-Host 'No running Minecraft server detected. Proceeding with backup.'
          }

          # Create the backup outside Desktop to prevent recursion.
          $backupDir = Join-Path $env:RUNNER_TEMP 'MinecraftFinalBackup'
          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null

          $zip = Join-Path $backupDir 'Minecraft-EmergencyBackup.zip'
          $shaFile = Join-Path $backupDir 'Minecraft-EmergencyBackup.sha256'

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Write-Host 'Creating ZIP from the entire Desktop...'

          & tar.exe -a -c -f $zip -C $desktop .

          $tarCode = $LASTEXITCODE

          if ($tarCode -ne 0 -or -not (Test-Path $zip)) {
            throw "ZIP creation failed. tar exit code: $tarCode"
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          Set-Content `
            -LiteralPath $shaFile `
            -Value "$hash  Minecraft-EmergencyBackup.zip" `
            -Encoding ascii

          Write-Host "ZIP size: $([math]::Round((Get-Item $zip).Length / 1GB, 3)) GB"
          Write-Host "SHA256: $hash"

          # Publish a new unique GitHub Release.
          $tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host "Uploading backup to Release: $tag"

          gh release create $tag $zip $shaFile `
            --repo $env:GITHUB_REPOSITORY `
            --title "Minecraft Emergency Backup $env:GITHUB_RUN_ID" `
            --notes "Full Desktop backup. SHA256 included."

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release upload failed. Windows will not shut down.'
          }

          # Confirm both assets exist on the Release.
          $releaseInfo = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json assets

          if ($LASTEXITCODE -ne 0) {
            throw 'Could not verify the uploaded Release.'
          }

          $uploaded = @(
            ($releaseInfo | ConvertFrom-Json).assets |
              ForEach-Object { $_.name }
          )

          if (
            $uploaded -notcontains 'Minecraft-EmergencyBackup.zip' -or
            $uploaded -notcontains 'Minecraft-EmergencyBackup.sha256'
          ) {
            throw 'Release verification failed. Windows will not shut down.'
          }

          Write-Host 'Backup uploaded and verified successfully.'
          Write-Host 'Windows Runner will shut down in 30 seconds.'

          & shutdown.exe /s /t 30 /f

          if ($LASTEXITCODE -ne 0) {
            throw "Windows shutdown command failed: $LASTEXITCODE"
          }
