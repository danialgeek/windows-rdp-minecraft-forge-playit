
name: Windows RDP + Minecraft Forge + Tailscale + Full Desktop Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: C:\Users\Public\Desktop
      RDP_USER: NvDAdmin
      JAVA_VERSION: '17'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Restore Full Desktop Backup
      # --------------------------------------------------

      - name: Restore Latest Full Desktop Backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $RestoreDir = Join-Path $env:RUNNER_TEMP "MinecraftRestore"

          New-Item -ItemType Directory -Force -Path $DesktopDir | Out-Null
          New-Item -ItemType Directory -Force -Path $RestoreDir | Out-Null

          Write-Host "Searching for latest desktop backup..."

          $Releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json

          $Latest = $Releases |
            Where-Object {
              $_.tagName -like "minecraft-backup-*" -and
              -not $_.isDraft
            } |
            Select-Object -First 1

          if ($null -eq $Latest) {
            Write-Host "No previous backup found. Starting with an empty desktop."
          }
          else {
            Write-Host "Found backup: $($Latest.tagName)"

            gh release download $Latest.tagName `
              --pattern "Minecraft-EmergencyBackup.zip" `
              --dir $RestoreDir `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download backup."
            }

            $ZipPath = Join-Path $RestoreDir "Minecraft-EmergencyBackup.zip"

            if (!(Test-Path $ZipPath)) {
              throw "Backup ZIP was not downloaded."
            }

            Write-Host "Restoring the complete desktop structure..."

            tar.exe -xf $ZipPath -C $DesktopDir

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract desktop backup."
            }

            Write-Host "Desktop restoration completed."
          }

      # --------------------------------------------------
      # 4. Detect Minecraft Directory + Permissions
      # --------------------------------------------------

      - name: Prepare Desktop and Minecraft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR

          $MinecraftDir = Join-Path $DesktopDir "Minecraft"
          $RootRunBat = Join-Path $DesktopDir "run.bat"
          $MinecraftRunBat = Join-Path $MinecraftDir "run.bat"

          if (Test-Path $MinecraftRunBat) {
            $ServerDir = $MinecraftDir
          }
          elseif (Test-Path $RootRunBat) {
            $ServerDir = $DesktopDir
          }
          else {
            throw "run.bat was not found in Desktop\Minecraft or Desktop root."
          }

          "SERVER_DIR=$ServerDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Minecraft directory: $ServerDir"

          # Give runner user access to the entire desktop.
          $RunnerUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name

          Write-Host "Repairing permissions for: $RunnerUser"

          & takeown.exe /F $DesktopDir /R /D Y
          & icacls.exe $DesktopDir /grant "${RunnerUser}:(OI)(CI)F" /T /C

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to repair desktop permissions."
          }

          & attrib.exe -R "$DesktopDir\*" /S /D

          # Check server files.
          if (!(Test-Path (Join-Path $ServerDir "run.bat"))) {
            throw "Minecraft run.bat is missing."
          }

          # Set Java memory.
          $JvmArgs = Join-Path $ServerDir "user_jvm_args.txt"

          if (Test-Path $JvmArgs) {
            $Lines = Get-Content $JvmArgs |
              Where-Object {
                $_ -notmatch '^\s*-Xms' -and
                $_ -notmatch '^\s*-Xmx'
              }
          }
          else {
            $Lines = @()
          }

          $Lines += "-Xms2G"
          $Lines += "-Xmx12G"

          Set-Content -Path $JvmArgs -Value $Lines -Encoding utf8

          # Create start script.
          $StartBat = Join-Path $ServerDir "START MINECRAFT SERVER.bat"

          @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0"
          call run.bat nogui
          exit /b %errorlevel%
          '@ | Set-Content -Path $StartBat -Encoding ascii

          # Create stop marker path.
          $StopMarker = Join-Path $DesktopDir "STOP_SERVER.txt"

          if (Test-Path $StopMarker) {
            Remove-Item $StopMarker -Force
          }

          # Configure RCON.
          $Properties = Join-Path $ServerDir "server.properties"

          if (!(Test-Path $Properties)) {
            New-Item -ItemType File -Path $Properties | Out-Null
          }

          $RconPassword = [guid]::NewGuid().ToString("N") + "A9"

          $PropertyLines = @(Get-Content $Properties -ErrorAction SilentlyContinue)

          function Set-ServerProperty {
            param(
              [string]$Key,
              [string]$Value
            )

            $Pattern = "^" + [regex]::Escape($Key) + "="
            $Found = $false

            for ($i = 0; $i -lt $PropertyLines.Count; $i++) {
              if ($PropertyLines[$i] -match $Pattern) {
                $PropertyLines[$i] = "$Key=$Value"
                $Found = $true
              }
            }

            if (!$Found) {
              $PropertyLines += "$Key=$Value"
            }
          }

          Set-ServerProperty "enable-rcon" "true"
          Set-ServerProperty "rcon.port" "25575"
          Set-ServerProperty "rcon.password" $RconPassword

          Set-Content -Path $Properties -Value $PropertyLines -Encoding utf8

          "RCON_PASSWORD=$RconPassword" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Preparation completed."

      # --------------------------------------------------
      # 5. Configure RDP
      # --------------------------------------------------

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $SecurePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $ExistingUser = Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {
            New-LocalUser `
              -Name $env:RDP_USER `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser -Name $env:RDP_USER -Password $SecurePassword
          }

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured."

      # --------------------------------------------------
      # 6. Install and Connect Tailscale
      # --------------------------------------------------

      - name: Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $TailscaleExe)) {
            $Installer = Join-Path $env:RUNNER_TEMP "tailscale.msi"

            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $Installer

            Start-Process msiexec.exe `
              -ArgumentList "/i `"$Installer`" /qn" `
              -Wait

            if (!(Test-Path $TailscaleExe)) {
              throw "Tailscale installation failed."
            }
          }

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $TailscaleExe up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname="minecraft-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $TailscaleIP = & $TailscaleExe ip -4

          if ([string]::IsNullOrWhiteSpace($TailscaleIP)) {
            throw "Could not obtain Tailscale IP."
          }

          "TAILSCALE_IP=$TailscaleIP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $TailscaleIP"

      # --------------------------------------------------
      # 7. Show RDP Details
      # --------------------------------------------------

      - name: Show RDP Connection
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "RDP SERVER READY"
          Write-Host "=================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Port: 3389"
          Write-Host "=================================="

      # --------------------------------------------------
      # 8. Start Minecraft
      # --------------------------------------------------

      - name: Start Minecraft Forge Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $StartBat = Join-Path $ServerDir "START MINECRAFT SERVER.bat"

          Write-Host "Starting Minecraft..."
          Write-Host "Directory: $ServerDir"

          $Process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "`"$StartBat`"" `
            -WorkingDirectory $ServerDir `
            -PassThru `
            -WindowStyle Hidden

          "SERVER_WRAPPER_PID=$($Process.Id)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Server wrapper PID: $($Process.Id)"

      # --------------------------------------------------
      # 9. Keep Runner Alive
      # --------------------------------------------------

      - name: Keep Server Running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $StopMarker = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"
          $ServerPID = [int]$env:SERVER_WRAPPER_PID

          $StartTime = Get-Date
          $MaxRuntime = [TimeSpan]::FromMinutes(345)
          $StartupGrace = [TimeSpan]::FromMinutes(5)

          Write-Host "Runner will stay active while Minecraft is running."
          Write-Host "Create STOP_SERVER.txt on the desktop to request shutdown."

          while ((Get-Date) - $StartTime -lt $MaxRuntime) {

            if (Test-Path $StopMarker) {
              Write-Host "Stop marker detected."
              break
            }

            $ServerProcess = Get-Process -Id $ServerPID -ErrorAction SilentlyContinue

            if ($null -eq $ServerProcess) {
              $Elapsed = (Get-Date) - $StartTime

              if ($Elapsed -lt $StartupGrace) {
                Write-Host "Waiting for Minecraft startup..."
              }
              else {
                throw "Minecraft server process exited unexpectedly."
              }
            }

            Start-Sleep -Seconds 10
          }

          Write-Host "Keep-alive step finished."

      # --------------------------------------------------
      # 10. Stop Server Gracefully
      # Runs even when the workflow is cancelled.
      # --------------------------------------------------

      - name: Stop Minecraft Safely
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $ServerPID = 0

          if ($env:SERVER_WRAPPER_PID) {
            $ServerPID = [int]$env:SERVER_WRAPPER_PID
          }

          function Read-RconPacket {
            param($Stream)

            $LengthBytes = New-Object byte[] 4
            $Read = 0

            while ($Read -lt 4) {
              $Count = $Stream.Read($LengthBytes, $Read, 4 - $Read)
              if ($Count -le 0) {
                throw "RCON connection closed."
              }
              $Read += $Count
            }

            $Length = [BitConverter]::ToInt32($LengthBytes, 0)
            $Data = New-Object byte[] $Length
            $Read = 0

            while ($Read -lt $Length) {
              $Count = $Stream.Read($Data, $Read, $Length - $Read)
              if ($Count -le 0) {
                throw "RCON response incomplete."
              }
              $Read += $Count
            }

            return @{
              Id = [BitConverter]::ToInt32($Data, 0)
              Type = [BitConverter]::ToInt32($Data, 4)
              Body = [Text.Encoding]::UTF8.GetString($Data, 8, $Length - 10)
            }
          }

          function Send-RconPacket {
            param(
              $Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $Payload = [Text.Encoding]::UTF8.GetBytes($Body + [char]0 + [char]0)
            $Packet = New-Object byte[] (4 + 4 + 4 + $Payload.Length)

            [BitConverter]::GetBytes(8 + $Payload.Length) |
              ForEach-Object -Begin { $i = 0 } -Process {
                $Packet[$i] = $_
                $i++
              }

            [Array]::Copy([BitConverter]::GetBytes($Id), 0, $Packet, 4, 4)
            [Array]::Copy([BitConverter]::GetBytes($Type), 0, $Packet, 8, 4)
            [Array]::Copy($Payload, 0, $Packet, 12, $Payload.Length)

            $Stream.Write($Packet, 0, $Packet.Length)
          }

          try {
            if ($env:RCON_PASSWORD) {
              $Client = New-Object System.Net.Sockets.TcpClient
              $Client.ReceiveTimeout = 5000
              $Client.SendTimeout = 5000
              $Client.Connect("127.0.0.1", 25575)

              $Stream = $Client.GetStream()

              Send-RconPacket $Stream 100 3 $env:RCON_PASSWORD
              $Auth = Read-RconPacket $Stream

              if ($Auth.Id -eq -1) {
                throw "RCON authentication failed."
              }

              Send-RconPacket $Stream 101 2 "stop"
              $null = Read-RconPacket $Stream

              Write-Host "Graceful stop command sent."

              $Stream.Dispose()
              $Client.Dispose()
            }
          }
          catch {
            Write-Warning "RCON shutdown attempt failed: $_"
          }

          if ($ServerPID -gt 0) {
            Write-Host "Waiting for Minecraft to stop..."

            $Deadline = (Get-Date).AddSeconds(150)

            do {
              $Process = Get-Process -Id $ServerPID -ErrorAction SilentlyContinue

              if ($null -eq $Process) {
                break
              }

              Start-Sleep -Seconds 5
            }
            while ((Get-Date) -lt $Deadline)

            $Process = Get-Process -Id $ServerPID -ErrorAction SilentlyContinue

            if ($null -ne $Process) {
              Write-Warning "Server wrapper is still running. It was not force-killed to avoid world corruption."
            }
            else {
              Write-Host "Server stopped."
            }
          }

          $StopMarker = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"

          if (Test-Path $StopMarker) {
            Remove-Item $StopMarker -Force
          }

      # --------------------------------------------------
      # 11. Create Full Desktop Backup
      # Runs even after cancellation or failure.
      # --------------------------------------------------

      - name: Create Full Desktop Backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $BackupDir = Join-Path $env:RUNNER_TEMP "FullDesktopBackup"

          $ZipPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (!(Test-Path $DesktopDir)) {
            throw "Desktop directory does not exist."
          }

          if (Test-Path $BackupDir) {
            Remove-Item $BackupDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "Backing up the entire Public Desktop..."
          Write-Host "Source: $DesktopDir"
          Write-Host "Destination: $BackupDir"

          & robocopy.exe `
            $DesktopDir `
            $BackupDir `
            /E `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:2 `
            /XJ `
            /SL

          $CopyCode = $LASTEXITCODE

          if ($CopyCode -ge 8) {
            throw "Robocopy failed with exit code $CopyCode"
          }

          $global:LASTEXITCODE = 0

          Write-Host "Creating ZIP archive..."

          if (Test-Path $ZipPath) {
            Remove-Item $ZipPath -Force
          }

          tar.exe -a -c -f $ZipPath -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP creation failed."
          }

          $Hash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash.ToLower()

          Set-Content -Path $HashPath -Value "$Hash  Minecraft-EmergencyBackup.zip" -Encoding ascii

          Write-Host "Backup ZIP created."
          Write-Host "SHA256: $Hash"

          "BACKUP_ZIP=$ZipPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BACKUP_HASH=$HashPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # --------------------------------------------------
      # 12. Upload Backup to GitHub Releases
      # --------------------------------------------------

      - name: Upload Full Desktop Backup to GitHub Release
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ZipPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (!(Test-Path $ZipPath) -or !(Test-Path $HashPath)) {
            throw "Backup files are missing. Release upload cancelled."
          }

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host "Creating GitHub Release: $Tag"

          gh release create $Tag `
            $ZipPath `
            $HashPath `
            --title "Minecraft Full Desktop Backup $env:GITHUB_RUN_ID" `
            --notes "Automatic full Public Desktop backup. Original folder structure preserved."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup uploaded successfully."

      # --------------------------------------------------
      # 13. Final Status
      # --------------------------------------------------

      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "MINECRAFT WORKFLOW FINISHED"
          Write-Host "=================================="
          Write-Host "Backup includes the complete Public Desktop."
          Write-Host "Original relative paths are preserved."
          Write-Host "=================================="
