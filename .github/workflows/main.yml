
name: Windows RDP + Minecraft Forge + Tailscale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      SERVER_DIR: 'C:\Users\NvDAdmin.runnervmbpeip\Desktop\Minecraft'
      DESKTOP_DIR: 'C:\Users\NvDAdmin.runnervmbpeip\Desktop'
      BACKUP_PREFIX: minecraft-backup-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # 1. دریافت مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. نصب Java 17
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. آماده‌سازی مسیرها
      - name: Prepare Windows Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          Write-Host "Desktop path: $env:DESKTOP_DIR"
          Write-Host "Server path: $env:SERVER_DIR"

          New-Item -ItemType Directory -Force `
            -Path $env:DESKTOP_DIR | Out-Null

          java -version

      # 4. ساخت حساب RDP
      - name: Configure RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name "NvDAdmin" `
            -ErrorAction SilentlyContinue

          if (!$User) {
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $Password `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name "NvDAdmin" `
              -Password $Password
          }

          Enable-LocalUser -Name "NvDAdmin"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP user configured."

      # 5. نصب Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          $Install = Start-Process msiexec.exe `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait -PassThru

          if ($Install.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($Install.ExitCode)"
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
            throw "Tailscale executable not found."
          }

          Set-Service -Name Tailscale -StartupType Automatic
          Start-Service -Name Tailscale

      # 6. اتصال Tailscale
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $Tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="danialgeek-minecraft"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $IP = & $Tailscale ip -4

          if ($LASTEXITCODE -ne 0 -or !$IP) {
            throw "Could not obtain Tailscale IP."
          }

          "TAILSCALE_IP=$IP" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

          Write-Host "Tailscale IP: $IP"

      # 7. بازیابی بکاپ
      - name: Restore Minecraft Backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $TempDir = Join-Path $env:RUNNER_TEMP "MinecraftRestore"
          $ExtractDir = Join-Path $TempDir "Extracted"

          Remove-Item $TempDir -Recurse -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force `
            -Path $ExtractDir | Out-Null

          New-Item -ItemType Directory -Force `
            -Path $env:DESKTOP_DIR | Out-Null

          $ReleaseJson = gh release list `
            --limit 100 `
            --json tagName,isDraft,isPrerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve GitHub releases."
          }

          $Releases = @(
            $ReleaseJson | ConvertFrom-Json |
            Where-Object {
              $_.tagName -like "$env:BACKUP_PREFIX*" -and
              !$_.isDraft -and !$_.isPrerelease
            }
          )

          if ($Releases.Count -eq 0) {
            throw "No backup release found."
          }

          $Restored = $false

          foreach ($Release in $Releases) {

            $Tag = $Release.tagName
            Write-Host "Checking release: $Tag"

            Remove-Item $TempDir -Recurse -Force `
              -ErrorAction SilentlyContinue

            New-Item -ItemType Directory -Force `
              -Path $ExtractDir | Out-Null

            $InfoJson = gh release view $Tag --json assets

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not inspect release."
              continue
            }

            $Info = $InfoJson | ConvertFrom-Json

            $ZipAsset = $Info.assets | Where-Object {
              $_.name -eq "Minecraft-EmergencyBackup.zip"
            } | Select-Object -First 1

            if (!$ZipAsset) {
              Write-Warning "Backup ZIP not found."
              continue
            }

            $HashAsset = $Info.assets | Where-Object {
              $_.name -eq "Minecraft-EmergencyBackup.sha256"
            } | Select-Object -First 1

            gh release download $Tag `
              --pattern "Minecraft-EmergencyBackup.zip" `
              --dir $TempDir

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "ZIP download failed."
              continue
            }

            $Zip = Join-Path $TempDir "Minecraft-EmergencyBackup.zip"

            if (!(Test-Path $Zip)) {
              continue
            }

            if ((Get-Item $Zip).Length -lt 1MB) {
              Write-Warning "ZIP is too small."
              continue
            }

            # بررسی SHA256 در صورت وجود
            if ($HashAsset) {

              gh release download $Tag `
                --pattern "Minecraft-EmergencyBackup.sha256" `
                --dir $TempDir

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "SHA256 download failed."
                continue
              }

              $HashFile = Join-Path $TempDir `
                "Minecraft-EmergencyBackup.sha256"

              $ExpectedHash = (
                (Get-Content $HashFile -Raw).Trim() -split '\s+'
              )[0]

              $ActualHash = (
                Get-FileHash $Zip -Algorithm SHA256
              ).Hash

              if (
                $ExpectedHash -notmatch '^[A-Fa-f0-9]{64}$' -or
                $ActualHash -ine $ExpectedHash
              ) {
                Write-Warning "SHA256 verification failed."
                continue
              }

              Write-Host "SHA256 verified."
            }
            else {
              Write-Warning "SHA256 asset missing. Continuing without hash verification."
            }

            # بررسی ZIP
            tar -tf $Zip | Out-Null

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Invalid ZIP archive."
              continue
            }

            # استخراج
            tar -xf $Zip -C $ExtractDir

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "ZIP extraction failed."
              continue
            }

            $Items = @(Get-ChildItem -LiteralPath $ExtractDir -Force)

            if ($Items.Count -eq 0) {
              Write-Warning "Archive is empty."
              continue
            }

            $MinecraftFolder = Join-Path $ExtractDir "Minecraft"

            if (Test-Path $MinecraftFolder -PathType Container) {

              Write-Host "Full desktop backup detected."
              Write-Host "Restoring to: $env:DESKTOP_DIR"

              robocopy $ExtractDir $env:DESKTOP_DIR `
                /MIR /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ /SL

              $CopyCode = $LASTEXITCODE

              Write-Host "Robocopy exit code: $CopyCode"

              if ($CopyCode -ge 8) {
                Write-Warning "Desktop restore failed."
                continue
              }

              $global:LASTEXITCODE = 0
            }
            else {

              Write-Host "Legacy Minecraft-only backup detected."

              if (Test-Path $env:SERVER_DIR) {
                Remove-Item $env:SERVER_DIR -Recurse -Force
              }

              New-Item -ItemType Directory -Force `
                -Path $env:SERVER_DIR | Out-Null

              Get-ChildItem -LiteralPath $ExtractDir -Force |
                Move-Item -Destination $env:SERVER_DIR
            }

            Write-Host "Restore successful: $Tag"
            $Restored = $true
            break
          }

          if (!$Restored) {
            throw "No valid backup could be restored."
          }

          Remove-Item "$env:DESKTOP_DIR\STOP_SERVER.txt" `
            -Force -ErrorAction SilentlyContinue

          Write-Host "RESTORE COMPLETED SUCCESSFULLY"

          $global:LASTEXITCODE = 0
          exit 0

      # 8. بررسی فایل‌های Minecraft
      - name: Prepare Minecraft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking server directory: $env:SERVER_DIR"

          if (!(Test-Path $env:SERVER_DIR -PathType Container)) {
            throw "Minecraft directory not found."
          }

          $RunBat = Join-Path $env:SERVER_DIR "run.bat"

          if (!(Test-Path $RunBat)) {
            throw "run.bat not found."
          }

          Remove-Item "$env:DESKTOP_DIR\STOP_SERVER.txt" `
            -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:RUNNER_TEMP\minecraft-safe-stop.txt" `
            -Force -ErrorAction SilentlyContinue

          Write-Host "Minecraft is ready."

      # 9. اطلاعات اتصال RDP
      - name: Show RDP Information
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "RDP CONNECTION"
          Write-Host "=================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "Username: NvDAdmin"
          Write-Host "Password: GitHub Secret RDP_PASSWORD"
          Write-Host "=================================="

      # 10. اجرای سرور و انتظار برای فرمان توقف
      - name: Start Minecraft and Keep Runner Alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $RunBat = Join-Path $env:SERVER_DIR "run.bat"
          $StopFile = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"

          Remove-Item $StopFile -Force `
            -ErrorAction SilentlyContinue

          $StartInfo = New-Object System.Diagnostics.ProcessStartInfo

          $StartInfo.FileName = "$env:SystemRoot\System32\cmd.exe"
          $StartInfo.Arguments = "/c `"$RunBat`""
          $StartInfo.WorkingDirectory = $env:SERVER_DIR
          $StartInfo.UseShellExecute = $false
          $StartInfo.CreateNoWindow = $true
          $StartInfo.RedirectStandardInput = $true
          $StartInfo.RedirectStandardOutput = $true
          $StartInfo.RedirectStandardError = $true

          $Server = New-Object System.Diagnostics.Process
          $Server.StartInfo = $StartInfo

          $OutputHandler = {
            if ($null -ne $EventArgs.Data) {
              Write-Host $EventArgs.Data
            }
          }

          $ErrorHandler = {
            if ($null -ne $EventArgs.Data) {
              Write-Host $EventArgs.Data
            }
          }

          Register-ObjectEvent `
            -InputObject $Server `
            -EventName OutputDataReceived `
            -Action $OutputHandler | Out-Null

          Register-ObjectEvent `
            -InputObject $Server `
            -EventName ErrorDataReceived `
            -Action $ErrorHandler | Out-Null

          if (!$Server.Start()) {
            throw "Minecraft failed to start."
          }

          $Server.BeginOutputReadLine()
          $Server.BeginErrorReadLine()

          Write-Host "Minecraft started."
          Write-Host "Waiting for STOP_SERVER.txt"

          $Deadline = (Get-Date).AddMinutes(345)
          $StopRequested = $false

          while ((Get-Date) -lt $Deadline) {

            if ($Server.HasExited) {
              Write-Warning "Minecraft process exited unexpectedly."
              break
            }

            if (Test-Path $StopFile) {
              $StopRequested = $true
              Write-Host "Stop request detected."
              break
            }

            Start-Sleep -Seconds 3
          }

          if (!$Server.HasExited) {

            if (!$StopRequested) {
              Write-Warning "Workflow time limit reached."
            }

            Write-Host "Sending stop command."

            try {
              $Server.StandardInput.WriteLine("stop")
              $Server.StandardInput.Flush()
            }
            catch {
              Write-Warning "Could not send stop command: $_"
            }

            if (!$Server.WaitForExit(120000)) {
              throw "Minecraft did not stop safely. Backup refused."
            }
          }

          $Server.WaitForExit()

          Write-Host "Minecraft process stopped."

          New-Item -ItemType File -Force `
            -Path "$env:RUNNER_TEMP\minecraft-safe-stop.txt" | Out-Null

          Write-Host "Safe shutdown confirmed."

      # 11. بکاپ کامل دسکتاپ
      - name: Create Full Desktop Backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $SafeStop = Join-Path $env:RUNNER_TEMP "minecraft-safe-stop.txt"

          if (!(Test-Path $SafeStop)) {
            throw "Safe shutdown not confirmed. Backup refused."
          }

          $BackupDir = Join-Path $env:RUNNER_TEMP "MinecraftDesktopBackup"
          $Zip = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashFile = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          Remove-Item $BackupDir -Recurse -Force `
            -ErrorAction SilentlyContinue

          Remove-Item $Zip,$HashFile -Force `
            -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force `
            -Path $BackupDir | Out-Null

          Write-Host "Backing up entire desktop:"
          Write-Host $env:DESKTOP_DIR

          robocopy $env:DESKTOP_DIR $BackupDir `
            /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ /SL

          $CopyCode = $LASTEXITCODE

          Write-Host "Robocopy exit code: $CopyCode"

          if ($CopyCode -ge 8) {
            throw "Desktop backup failed. Robocopy code: $CopyCode"
          }

          Write-Host "Creating ZIP."

          tar -a -c -f $Zip -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP creation failed."
          }

          if (!(Test-Path $Zip)) {
            throw "ZIP file was not created."
          }

          $ZipSize = (Get-Item $Zip).Length

          if ($ZipSize -lt 1MB) {
            throw "ZIP file is too small."
          }

          $Hash = (
            Get-FileHash $Zip -Algorithm SHA256
          ).Hash.ToLower()

          "$Hash  Minecraft-EmergencyBackup.zip" |
            Set-Content -Path $HashFile -Encoding ASCII

          "BACKUP_ZIP=$Zip" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

          "BACKUP_HASH=$HashFile" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

          Write-Host "Backup size: $([math]::Round($ZipSize / 1GB, 2)) GB"
          Write-Host "SHA256: $Hash"

      # 12. انتشار بکاپ در Release
      - name: Upload Backup to GitHub Release
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $SafeStop = Join-Path $env:RUNNER_TEMP "minecraft-safe-stop.txt"

          if (!(Test-Path $SafeStop)) {
            throw "Safe shutdown not confirmed. Upload refused."
          }

          if (
            !(Test-Path $env:BACKUP_ZIP) -or
            !(Test-Path $env:BACKUP_HASH)
          ) {
            throw "Backup files are missing."
          }

          $Tag = "$env:BACKUP_PREFIX$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          gh release create $Tag `
            "$env:BACKUP_ZIP" `
            "$env:BACKUP_HASH" `
            --title "Minecraft Emergency Backup $env:GITHUB_RUN_ID" `
            --notes "Full desktop backup. Minecraft Forge 1.20.1. SHA256 included."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup published successfully."
          Write-Host "Release tag: $Tag"

      # 13. وضعیت نهایی
      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "WORKFLOW FINISHED"
          Write-Host "=================================="
          Write-Host "Desktop: $env:DESKTOP_DIR"
          Write-Host "Minecraft: $env:SERVER_DIR"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "=================================="
