
name: Windows RDP + Minecraft Forge + Tailscale + Emergency Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: 'C:\Users\NvDAdmin\Desktop'
      SERVER_DIR: 'C:\Users\NvDAdmin\Desktop\Minecraft'
      BACKUP_PREFIX: minecraft-backup-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # ================================================
      # 1. INSTALL JAVA 17
      # ================================================

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ================================================
      # 2. CONFIGURE RDP USER
      # ================================================

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $Password `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser -Name "NvDAdmin" -Password $Password
          }

          Enable-LocalUser -Name "NvDAdmin"

          foreach ($Group in @("Administrators", "Remote Desktop Users")) {
            Add-LocalGroupMember `
              -Group $Group `
              -Member "NvDAdmin" `
              -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $Credential = [PSCredential]::new(".\NvDAdmin", $Password)

          $ProfileProcess = Start-Process `
            -FilePath "$PSHOME\pwsh.exe" `
            -Credential $Credential `
            -LoadUserProfile `
            -ArgumentList '-NoProfile -Command "exit"' `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          if ($ProfileProcess.ExitCode -ne 0) {
            throw "Could not initialize NvDAdmin user profile."
          }

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          Write-Host "RDP user configured."
          Write-Host "Desktop: $env:DESKTOP_DIR"

      # ================================================
      # 3. INSTALL TAILSCALE
      # ================================================

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          $Install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$Msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($Install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($Install.ExitCode)"
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Start-Service -Name "Tailscale"

          & $Tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=minecraft-$env:GITHUB_RUN_ID" `
            "--accept-routes"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $IP = & $Tailscale ip -4

          Write-Host ""
          Write-Host "===================================="
          Write-Host "RDP IP: $IP"
          Write-Host "USERNAME: NvDAdmin"
          Write-Host "===================================="

      # ================================================
      # 4. RESTORE LATEST BACKUP
      # ================================================

      - name: Restore latest Minecraft backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $Repository = $env:GITHUB_REPOSITORY

          if ([string]::IsNullOrWhiteSpace($Repository)) {
            throw "GITHUB_REPOSITORY is missing."
          }

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          $DownloadDir = "$env:RUNNER_TEMP\MinecraftRestore"
          $ExtractDir = "$env:RUNNER_TEMP\MinecraftExtract"

          New-Item -ItemType Directory -Force -Path $DownloadDir | Out-Null

          Write-Host "Repository: $Repository"
          Write-Host "Searching for Minecraft backups..."

          $Releases = gh release list `
            --repo $Repository `
            --limit 100 `
            --json tagName,isDraft,isPrerelease,createdAt

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve GitHub Releases."
          }

          $Candidates = @(
            $Releases |
              ConvertFrom-Json |
              Where-Object {
                $_.tagName.StartsWith($env:BACKUP_PREFIX) `
                -and -not $_.isDraft `
                -and -not $_.isPrerelease
              } |
              Sort-Object createdAt -Descending
          )

          if ($Candidates.Count -eq 0) {
            Write-Warning "No previous backup found."
            Write-Host "Existing desktop will be preserved."
          }
          else {
            $Restored = $false

            foreach ($Release in $Candidates) {
              $Tag = $Release.tagName

              Write-Host ""
              Write-Host "Checking backup: $Tag"

              Remove-Item $DownloadDir -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $DownloadDir | Out-Null

              gh release download $Tag `
                --repo $Repository `
                --pattern "Minecraft-EmergencyBackup.zip" `
                --dir $DownloadDir

              $DownloadCode = $LASTEXITCODE

              if ($DownloadCode -ne 0) {
                Write-Warning "ZIP download failed. Trying another release."
                continue
              }

              $Zip = Join-Path $DownloadDir "Minecraft-EmergencyBackup.zip"

              if (!(Test-Path $Zip)) {
                Write-Warning "ZIP asset is missing."
                continue
              }

              gh release download $Tag `
                --repo $Repository `
                --pattern "Minecraft-EmergencyBackup.sha256" `
                --dir $DownloadDir

              $ShaCode = $LASTEXITCODE

              if ($ShaCode -eq 0) {
                $ShaFile = Join-Path $DownloadDir "Minecraft-EmergencyBackup.sha256"

                $ExpectedHash = (
                  Get-Content $ShaFile -Raw
                ).Trim() -split '\s+' | Select-Object -First 1

                $ActualHash = (
                  Get-FileHash $Zip -Algorithm SHA256
                ).Hash

                if ($ExpectedHash -ne $ActualHash) {
                  Write-Warning "SHA256 mismatch. Trying another release."
                  continue
                }

                Write-Host "SHA256 verification successful."
              }
              else {
                Write-Warning "SHA256 asset is missing. Continuing without hash verification."
              }

              Remove-Item $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

              tar.exe -xf $Zip -C $ExtractDir

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Extraction failed. Trying another release."
                continue
              }

              robocopy $ExtractDir $env:DESKTOP_DIR `
                /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ /SL

              $CopyCode = $LASTEXITCODE

              Write-Host "Robocopy exit code: $CopyCode"

              if ($CopyCode -ge 8) {
                Write-Warning "Restore failed. Trying another release."
                continue
              }

              Write-Host "Restore successful: $Tag"

              $Restored = $true
              break
            }

            if (!$Restored) {
              throw "No valid backup could be restored."
            }
          }

      # ================================================
      # 5. CONFIGURE RCON AND SERVER LAUNCHER
      # ================================================

      - name: Configure Minecraft RCON
        shell: pwsh
        env:
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RCON_PASSWORD)) {
            throw "RCON_PASSWORD secret is missing."
          }

          if ($env:RCON_PASSWORD -match '[\r\n\s]') {
            throw "RCON_PASSWORD must not contain whitespace."
          }

          New-Item -ItemType Directory -Force -Path $env:SERVER_DIR | Out-Null

          $Properties = Join-Path $env:SERVER_DIR "server.properties"

          if (Test-Path $Properties) {
            $Lines = @(Get-Content $Properties)
          }
          else {
            $Lines = @()
          }

          $Settings = [ordered]@{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $env:RCON_PASSWORD
            "broadcast-rcon-to-ops" = "false"
          }

          foreach ($Key in $Settings.Keys) {
            $Found = $false

            for ($i = 0; $i -lt $Lines.Count; $i++) {
              if ($Lines[$i] -match "^$([regex]::Escape($Key))=") {
                $Lines[$i] = "$Key=$($Settings[$Key])"
                $Found = $true
              }
            }

            if (!$Found) {
              $Lines += "$Key=$($Settings[$Key])"
            }
          }

          $Encoding = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllLines(
            $Properties,
            [string[]]$Lines,
            $Encoding
          )

          $Launcher = @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0Minecraft"

          if exist run.bat (
              call run.bat
          ) else if exist run-server.bat (
              call run-server.bat
          ) else (
              echo Minecraft Forge run.bat was not found.
              pause
          )

          pause
          '@

          $LauncherPath = Join-Path $env:DESKTOP_DIR "START MINECRAFT SERVER.bat"

          Set-Content -Path $LauncherPath -Value $Launcher -Encoding ASCII

          Write-Host "RCON configured."
          Write-Host "Server launcher created."

      # ================================================
      # 6. KEEP RUNNER ALIVE
      # ================================================

      - name: Keep RDP runner alive
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "RDP is ready."
          Write-Host "Start Minecraft manually from the desktop."
          Write-Host "Press Cancel workflow to stop and backup."
          Write-Host "======================================"

          while ($true) {
            Start-Sleep -Seconds 15
          }

      # ================================================
      # 7. STOP SERVER + BACKUP + RELEASE + SHUTDOWN
      # ================================================

      - name: Stop Minecraft and create emergency backup
        if: always()
        shell: pwsh
        env:
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          # --------------------------------------------
          # RCON FUNCTIONS
          # --------------------------------------------

          function Read-ExactBytes {
            param(
              [System.IO.Stream]$Stream,
              [int]$Count
            )

            $Buffer = New-Object byte[] $Count
            $Offset = 0

            while ($Offset -lt $Count) {
              $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

              if ($Read -le 0) {
                throw "RCON connection closed unexpectedly."
              }

              $Offset += $Read
            }

            return ,$Buffer
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $BodyBytes = [Text.Encoding]::UTF8.GetBytes($Body)
            $Length = 4 + 4 + $BodyBytes.Length + 2

            $Packet = New-Object byte[] ($Length + 4)

            [BitConverter]::GetBytes([int]$Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes([int]$Id).CopyTo($Packet, 4)
            [BitConverter]::GetBytes([int]$Type).CopyTo($Packet, 8)

            $BodyBytes.CopyTo($Packet, 12)

            $Packet[$Packet.Length - 2] = 0
            $Packet[$Packet.Length - 1] = 0

            $Stream.Write($Packet, 0, $Packet.Length)
          }

          function Read-RconPacket {
            param([System.IO.Stream]$Stream)

            $LengthBytes = Read-ExactBytes $Stream 4
            $Length = [BitConverter]::ToInt32($LengthBytes, 0)

            if ($Length -lt 10 -or $Length -gt 65536) {
              throw "Invalid RCON packet length."
            }

            $Data = Read-ExactBytes $Stream $Length

            $Id = [BitConverter]::ToInt32($Data, 0)
            $Type = [BitConverter]::ToInt32($Data, 4)

            $Body = [Text.Encoding]::UTF8.GetString(
              $Data,
              8,
              $Length - 10
            )

            return [PSCustomObject]@{
              Id = $Id
              Type = $Type
              Body = $Body
            }
          }

          function Test-RconPort {
            $Client = [System.Net.Sockets.TcpClient]::new()

            try {
              $Async = $Client.BeginConnect("127.0.0.1", 25575, $null, $null)

              if (!$Async.AsyncWaitHandle.WaitOne(1000)) {
                return $false
              }

              $Client.EndConnect($Async)
              return $true
            }
            catch {
              return $false
            }
            finally {
              $Client.Close()
            }
          }

          # --------------------------------------------
          # STOP MINECRAFT
          # --------------------------------------------

          Write-Host "Checking Minecraft server..."

          $PortOpen = Test-RconPort

          if (!$PortOpen) {
            $JavaProcesses = @(
              Get-Process -Name java,javaw -ErrorAction SilentlyContinue
            )

            if ($JavaProcesses.Count -gt 0) {
              $Deadline = (Get-Date).AddSeconds(60)

              while (!(Test-RconPort) -and (Get-Date) -lt $Deadline) {
                Start-Sleep -Seconds 2
              }

              $PortOpen = Test-RconPort
            }
          }

          if ($PortOpen) {
            Write-Host "RCON detected. Sending stop command..."

            $Client = [System.Net.Sockets.TcpClient]::new()
            $Client.ReceiveTimeout = 10000
            $Client.SendTimeout = 10000
            $Stream = $null

            try {
              $Client.Connect("127.0.0.1", 25575)

              $Stream = $Client.GetStream()
              $Stream.ReadTimeout = 10000
              $Stream.WriteTimeout = 10000

              Send-RconPacket $Stream 1 3 $env:RCON_PASSWORD

              $Auth = Read-RconPacket $Stream

              if ($Auth.Id -eq -1) {
                throw "RCON authentication failed."
              }

              if ($Auth.Id -ne 1) {
                throw "Unexpected RCON authentication response."
              }

              Send-RconPacket $Stream 2 2 "stop"

              $Response = Read-RconPacket $Stream

              Write-Host "RCON stop command sent."
              Write-Host "Response: $($Response.Body)"
            }
            finally {
              if ($Stream) {
                $Stream.Dispose()
              }

              $Client.Close()
            }

            Write-Host "Waiting for Minecraft shutdown..."

            $Deadline = (Get-Date).AddSeconds(120)

            while ((Test-RconPort) -and (Get-Date) -lt $Deadline) {
              Start-Sleep -Seconds 2
            }

            if (Test-RconPort) {
              throw "Minecraft did not stop. Backup aborted."
            }

            Write-Host "Minecraft stopped."
          }
          else {
            $JavaProcesses = @(
              Get-Process -Name java,javaw -ErrorAction SilentlyContinue
            )

            if ($JavaProcesses.Count -gt 0) {
              throw "Java is running but RCON is unavailable. Backup aborted."
            }

            Write-Host "No Java process detected."
          }

          # --------------------------------------------
          # BACKUP ENTIRE DESKTOP
          # --------------------------------------------

          $BackupRoot = "$env:RUNNER_TEMP\MinecraftEmergencyBackup"
          $ZipPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.zip"
          $ShaPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"

          Remove-Item $BackupRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $ZipPath -Force -ErrorAction SilentlyContinue
          Remove-Item $ShaPath -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupRoot | Out-Null

          Write-Host "Backing up entire desktop..."
          Write-Host "Source: $env:DESKTOP_DIR"

          robocopy $env:DESKTOP_DIR $BackupRoot `
            /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ /SL

          $CopyCode = $LASTEXITCODE

          Write-Host "Backup Robocopy exit code: $CopyCode"

          if ($CopyCode -ge 8) {
            throw "Desktop backup failed. Robocopy code: $CopyCode"
          }

          # --------------------------------------------
          # CREATE ZIP
          # --------------------------------------------

          Write-Host "Creating ZIP archive..."

          tar.exe -a -c -f $ZipPath -C $BackupRoot .

          $TarCode = $LASTEXITCODE

          if ($TarCode -ne 0 -or !(Test-Path $ZipPath)) {
            throw "ZIP creation failed. Tar exit code: $TarCode"
          }

          # --------------------------------------------
          # CALCULATE SHA256
          # --------------------------------------------

          Write-Host "Calculating SHA256..."

          $Hash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash

          "$Hash  Minecraft-EmergencyBackup.zip" |
            Set-Content -Path $ShaPath -Encoding ASCII

          Write-Host "SHA256: $Hash"

          # --------------------------------------------
          # UPLOAD RELEASE
          # --------------------------------------------

          $Repository = $env:GITHUB_REPOSITORY
          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host "Creating Release: $Tag"

          gh release create $Tag `
            $ZipPath `
            $ShaPath `
            --repo $Repository `
            --title "Minecraft Emergency Backup" `
            --notes "Emergency backup of the complete NvDAdmin Desktop."

          $ReleaseCode = $LASTEXITCODE

          if ($ReleaseCode -ne 0) {
            throw "GitHub Release upload failed. Runner will not shut down."
          }

          Write-Host "======================================"
          Write-Host "BACKUP UPLOADED SUCCESSFULLY"
          Write-Host "Release: $Tag"
          Write-Host "======================================"

          # --------------------------------------------
          # SHUTDOWN WINDOWS RUNNER
          # --------------------------------------------

          Write-Host "Windows runner will shut down in 30 seconds."

          shutdown.exe /s /t 30 /f

          if ($LASTEXITCODE -ne 0) {
            throw "Windows shutdown command failed."
          }
