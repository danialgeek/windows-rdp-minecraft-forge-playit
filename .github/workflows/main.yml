
name: Windows RDP + Minecraft Forge + Tailscale + Full Desktop Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: 'C:\Users\NvDAdmin\Desktop'
      SERVER_DIR: 'C:\Users\NvDAdmin\Desktop\Minecraft'
      RDP_USER: NvDAdmin
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Java
      # --------------------------------------------------

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Create RDP User and Windows Profile
      # --------------------------------------------------

      - name: Configure RDP User and Profile
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Username = $env:RDP_USER
          $ExpectedProfile = "C:\Users\$Username"
          $ExpectedDesktop = Join-Path $ExpectedProfile "Desktop"

          $SecurePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            $User = New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser -Name $Username -Password $SecurePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          $Sid = $User.SID.Value

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object { $_.SID -eq $Sid }

          if ($null -eq $Profile) {
            Write-Host "Creating Windows user profile..."

            $Result = Invoke-CimMethod `
              -ClassName Win32_UserProfile `
              -MethodName CreateProfile `
              -Arguments @{
                Sid = $Sid
                UserName = $Username
              }

            if ($Result.ReturnValue -ne 0) {
              throw "Windows profile creation failed. Return code: $($Result.ReturnValue)"
            }

            Start-Sleep -Seconds 3

            $Profile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.SID -eq $Sid }
          }

          if ($null -eq $Profile) {
            throw "Windows user profile was not created."
          }

          if ($Profile.LocalPath -ne $ExpectedProfile) {
            throw "Unexpected Windows profile path: $($Profile.LocalPath)"
          }

          New-Item -ItemType Directory -Force -Path $ExpectedDesktop | Out-Null

          "DESKTOP_DIR=$ExpectedDesktop" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Windows user: $Username"
          Write-Host "Profile: $($Profile.LocalPath)"
          Write-Host "Desktop: $ExpectedDesktop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      # --------------------------------------------------
      # 4. Restore Latest Valid Full Desktop Backup
      # --------------------------------------------------

      - name: Restore Latest Valid Desktop Backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $RestoreDir = Join-Path $env:RUNNER_TEMP "MinecraftRestore"

          New-Item -ItemType Directory -Force -Path $RestoreDir | Out-Null
          New-Item -ItemType Directory -Force -Path $DesktopDir | Out-Null

          Write-Host "Searching for a valid backup..."

          $Releases = gh release list --limit 100 --json tagName,isDraft |
            ConvertFrom-Json

          $Candidates = @(
            $Releases | Where-Object {
              $_.tagName -like "minecraft-backup-*" -and
              -not $_.isDraft
            }
          )

          if ($Candidates.Count -eq 0) {
            throw "No previous backup release exists. Initial Minecraft backup is required."
          }

          $Restored = $false

          foreach ($Release in $Candidates) {

            $Tag = $Release.tagName

            Write-Host "Checking release: $Tag"

            Get-ChildItem $RestoreDir -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force

            gh release download $Tag `
              --pattern "Minecraft-EmergencyBackup.zip" `
              --pattern "Minecraft-EmergencyBackup.sha256" `
              --dir $RestoreDir `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not download assets from $Tag"
              continue
            }

            $ZipPath = Join-Path $RestoreDir "Minecraft-EmergencyBackup.zip"
            $HashPath = Join-Path $RestoreDir "Minecraft-EmergencyBackup.sha256"

            if (!(Test-Path $ZipPath)) {
              continue
            }

            $ZipSize = (Get-Item $ZipPath).Length

            if ($ZipSize -lt 1048576) {
              Write-Warning "Backup is too small: $ZipSize bytes"
              continue
            }

            if (Test-Path $HashPath) {
              $ExpectedHash = ((Get-Content $HashPath -Raw).Trim() -split '\s+')[0]
              $ActualHash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash

              if ($ExpectedHash -ne $ActualHash) {
                Write-Warning "Backup checksum mismatch."
                continue
              }
            }

            $ArchiveFiles = @(tar.exe -tf $ZipPath)

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "ZIP archive is damaged."
              continue
            }

            $ModFiles = @(
              $ArchiveFiles | Where-Object {
                $_ -match '(^|/)(Minecraft)/mods/.*\.jar$'
              }
            )

            if ($ModFiles.Count -lt 10) {
              Write-Warning "Backup does not contain enough Minecraft mods."
              continue
            }

            Write-Host "Valid backup found."
            Write-Host "Release: $Tag"
            Write-Host "ZIP size: $ZipSize bytes"
            Write-Host "Mod files: $($ModFiles.Count)"

            # Clear the destination to restore the saved desktop tree.
            Get-ChildItem -LiteralPath $DesktopDir -Force |
              Remove-Item -Recurse -Force

            tar.exe -xf $ZipPath -C $DesktopDir

            if ($LASTEXITCODE -ne 0) {
              throw "Desktop restoration failed."
            }

            if (!(Test-Path "$DesktopDir\Minecraft\run.bat")) {
              throw "Minecraft run.bat was not restored."
            }

            if (!(Test-Path "$DesktopDir\Minecraft\mods")) {
              throw "Minecraft mods folder was not restored."
            }

            $RestoredModCount = @(
              Get-ChildItem "$DesktopDir\Minecraft\mods" -Filter "*.jar" -File -Recurse
            ).Count

            if ($RestoredModCount -lt 10) {
              throw "Restored Minecraft mods are incomplete."
            }

            $Restored = $true
            break
          }

          if (!$Restored) {
            throw "No valid Minecraft desktop backup could be restored."
          }

          Write-Host "Full desktop restoration completed."

      # --------------------------------------------------
      # 5. Prepare Minecraft and Permissions
      # --------------------------------------------------

      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $ServerDir = $env:SERVER_DIR

          if (!(Test-Path $ServerDir)) {
            throw "Minecraft directory not found: $ServerDir"
          }

          if (!(Test-Path "$ServerDir\run.bat")) {
            throw "Minecraft run.bat is missing."
          }

          if (!(Test-Path "$ServerDir\mods")) {
            throw "Minecraft mods directory is missing."
          }

          $Mods = @(
            Get-ChildItem "$ServerDir\mods" -Filter "*.jar" -File -Recurse
          )

          if ($Mods.Count -lt 10) {
            throw "Minecraft mod count is suspiciously low: $($Mods.Count)"
          }

          Write-Host "Minecraft mods: $($Mods.Count)"

          # Grant permissions to runner and RDP user.

          $RunnerUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $RdpAccount = "$env:COMPUTERNAME\$($env:RDP_USER)"

          & icacls.exe $DesktopDir /grant "$($RunnerUser):(OI)(CI)F" /T /C

          if ($LASTEXITCODE -ne 0) {
            throw "Could not grant runner permissions."
          }

          & icacls.exe $DesktopDir /grant "$($RdpAccount):(OI)(CI)F" /T /C

          if ($LASTEXITCODE -ne 0) {
            throw "Could not grant RDP user permissions."
          }

          & attrib.exe -R "$DesktopDir\*" /S /D

          # Configure Java memory.

          $JvmArgs = Join-Path $ServerDir "user_jvm_args.txt"

          if (Test-Path $JvmArgs) {
            $Lines = @(
              Get-Content $JvmArgs |
                Where-Object {
                  $_ -notmatch '^\s*-Xms' -and
                  $_ -notmatch '^\s*-Xmx'
                }
            )
          }
          else {
            $Lines = @()
          }

          $Lines += "-Xms2G"
          $Lines += "-Xmx12G"

          Set-Content -Path $JvmArgs -Value $Lines -Encoding utf8

          # Configure RCON.

          $Properties = Join-Path $ServerDir "server.properties"

          if (!(Test-Path $Properties)) {
            New-Item -ItemType File -Path $Properties | Out-Null
          }

          $PropertyLines = @(Get-Content $Properties -ErrorAction SilentlyContinue)

          function Set-ServerProperty {
            param(
              [string]$Key,
              [string]$Value
            )

            $Pattern = "^" + [regex]::Escape($Key) + "="
            $Found = $false

            for ($i = 0; $i -lt $PropertyLines.Count; $i++) {
              if ($PropertyLines[$i] -match $Pattern) {
                $PropertyLines[$i] = "$Key=$Value"
                $Found = $true
              }
            }

            if (!$Found) {
              $PropertyLines += "$Key=$Value"
            }
          }

          $RconPassword = [guid]::NewGuid().ToString("N") + "A9"

          Set-ServerProperty "enable-rcon" "true"
          Set-ServerProperty "rcon.port" "25575"
          Set-ServerProperty "rcon.password" $RconPassword

          Set-Content -Path $Properties -Value $PropertyLines -Encoding utf8

          "RCON_PASSWORD=$RconPassword" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # Create start script.

          @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0"
          call run.bat nogui
          '@ | Set-Content "$ServerDir\START MINECRAFT SERVER.bat" -Encoding ascii

          # Create stop instructions.

          @'
          @echo off
          title Stop Minecraft Server
          echo STOP>"C:\Users\NvDAdmin\Desktop\STOP_SERVER.txt"
          echo Stop request sent.
          echo Wait for GitHub Actions to finish the backup.
          pause
          '@ | Set-Content "$ServerDir\STOP SERVER + BACKUP.bat" -Encoding ascii

          $StopMarker = Join-Path $DesktopDir "STOP_SERVER.txt"

          if (Test-Path $StopMarker) {
            Remove-Item $StopMarker -Force
          }

          Write-Host "Minecraft preparation completed."

      # --------------------------------------------------
      # 6. Install and Connect Tailscale
      # --------------------------------------------------

      - name: Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $TailscaleExe)) {
            $Installer = Join-Path $env:RUNNER_TEMP "tailscale.msi"

            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $Installer

            Start-Process msiexec.exe `
              -ArgumentList "/i `"$Installer`" /qn" `
              -Wait

            if (!(Test-Path $TailscaleExe)) {
              throw "Tailscale installation failed."
            }
          }

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $TailscaleExe up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname="minecraft-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $IP = & $TailscaleExe ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {
            throw "Tailscale IP not found."
          }

          "TAILSCALE_IP=$IP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $IP"

      # --------------------------------------------------
      # 7. Show RDP Connection
      # --------------------------------------------------

      - name: Show RDP Details
        shell: pwsh
        run: |
          Write-Host "===================================="
          Write-Host "RDP READY"
          Write-Host "===================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Port: 3389"
          Write-Host "Minecraft: $env:SERVER_DIR"
          Write-Host "===================================="

      # --------------------------------------------------
      # 8. Start Minecraft
      # --------------------------------------------------

      - name: Start Minecraft Forge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $StartBat = Join-Path $env:SERVER_DIR "START MINECRAFT SERVER.bat"

          $Process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "`"$StartBat`"" `
            -WorkingDirectory $env:SERVER_DIR `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "Minecraft launcher PID: $($Process.Id)"

      # --------------------------------------------------
      # 9. Keep Workflow Alive
      # --------------------------------------------------

      - name: Keep Server Running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $StartTime = Get-Date
          $StartupLimit = (Get-Date).AddMinutes(8)
          $StopMarker = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"

          $FoundJava = $false
          $LastJavaSeen = Get-Date

          Write-Host "Waiting for Minecraft..."

          while (((Get-Date) - $StartTime).TotalMinutes -lt 345) {

            if (Test-Path $StopMarker) {
              Write-Host "Stop marker detected."
              break
            }

            $JavaProcesses = @(
              Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -in @("java.exe", "javaw.exe") -and
                  $_.CommandLine -and
                  $_.CommandLine.IndexOf(
                    $env:SERVER_DIR,
                    [StringComparison]::OrdinalIgnoreCase
                  ) -ge 0
                }
            )

            if ($JavaProcesses.Count -gt 0) {
              $FoundJava = $true
              $LastJavaSeen = Get-Date

              Write-Host "Minecraft Java is running."
            }
            elseif (!$FoundJava) {
              if ((Get-Date) -gt $StartupLimit) {
                throw "Minecraft did not start within 8 minutes."
              }

              Write-Host "Waiting for Forge startup..."
            }
            else {
              if (((Get-Date) - $LastJavaSeen).TotalSeconds -gt 60) {
                throw "Minecraft Java process exited."
              }
            }

            Start-Sleep -Seconds 10
          }

          Write-Host "Keep-alive step finished."

      # --------------------------------------------------
      # 10. Stop Minecraft Safely
      # --------------------------------------------------

      - name: Stop Minecraft Safely
        id: stop
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          "safe_to_backup=false" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $ServerDir = $env:SERVER_DIR

          function Get-MinecraftJava {
            @(
              Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -in @("java.exe", "javaw.exe") -and
                  $_.CommandLine -and
                  $_.CommandLine.IndexOf(
                    $ServerDir,
                    [StringComparison]::OrdinalIgnoreCase
                  ) -ge 0
                }
            )
          }

          function Read-RconPacket {
            param($Stream)

            $LengthBytes = New-Object byte[] 4
            $Read = 0

            while ($Read -lt 4) {
              $Count = $Stream.Read($LengthBytes, $Read, 4 - $Read)

              if ($Count -le 0) {
                throw "RCON connection closed."
              }

              $Read += $Count
            }

            $Length = [BitConverter]::ToInt32($LengthBytes, 0)

            if ($Length -lt 10 -or $Length -gt 1048576) {
              throw "Invalid RCON packet length."
            }

            $Data = New-Object byte[] $Length
            $Read = 0

            while ($Read -lt $Length) {
              $Count = $Stream.Read($Data, $Read, $Length - $Read)

              if ($Count -le 0) {
                throw "RCON response incomplete."
              }

              $Read += $Count
            }

            return @{
              Id = [BitConverter]::ToInt32($Data, 0)
              Type = [BitConverter]::ToInt32($Data, 4)
            }
          }

          function Send-RconPacket {
            param(
              $Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $BodyBytes = [Text.Encoding]::UTF8.GetBytes($Body)

            $Payload = New-Object byte[] ($BodyBytes.Length + 2)

            [Array]::Copy(
              $BodyBytes,
              0,
              $Payload,
              0,
              $BodyBytes.Length
            )

            $Length = 10 + $BodyBytes.Length

            $Packet = New-Object byte[] (4 + $Length)

            [BitConverter]::GetBytes($Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes($Id).CopyTo($Packet, 4)
            [BitConverter]::GetBytes($Type).CopyTo($Packet, 8)

            [Array]::Copy(
              $Payload,
              0,
              $Packet,
              12,
              $Payload.Length
            )

            $Stream.Write($Packet, 0, $Packet.Length)
            $Stream.Flush()
          }

          try {
            $JavaProcesses = Get-MinecraftJava

            if ($JavaProcesses.Count -eq 0) {
              Write-Host "Minecraft is already stopped."
              "safe_to_backup=true" |
                Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
            else {
              Write-Host "Minecraft is running. Sending RCON stop..."

              try {
                $Client = New-Object System.Net.Sockets.TcpClient
                $Client.ReceiveTimeout = 10000
                $Client.SendTimeout = 10000

                $Client.Connect("127.0.0.1", 25575)

                $Stream = $Client.GetStream()

                Send-RconPacket $Stream 100 3 $env:RCON_PASSWORD

                $Auth = Read-RconPacket $Stream

                if ($Auth.Id -ne 100) {
                  throw "RCON authentication failed."
                }

                Send-RconPacket $Stream 101 2 "stop"

                $null = Read-RconPacket $Stream

                Write-Host "RCON stop command sent."

                $Stream.Dispose()
                $Client.Dispose()
              }
              catch {
                Write-Warning "RCON shutdown attempt failed: $_"
              }

              $Deadline = (Get-Date).AddSeconds(150)

              do {
                Start-Sleep -Seconds 5
                $JavaProcesses = Get-MinecraftJava
              }
              while ($JavaProcesses.Count -gt 0 -and (Get-Date) -lt $Deadline)

              if ($JavaProcesses.Count -eq 0) {
                Write-Host "Minecraft stopped safely."

                "safe_to_backup=true" |
                  Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
              }
              else {
                Write-Warning "Minecraft is still running. Backup will be skipped to protect the world."
              }
            }
          }
          catch {
            Write-Warning "Shutdown check failed: $_"
          }

          $StopMarker = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"

          if (Test-Path $StopMarker) {
            Remove-Item $StopMarker -Force
          }

      # --------------------------------------------------
      # 11. Backup Complete User Desktop
      # --------------------------------------------------

      - name: Create Full Desktop Backup
        id: backup
        if: always() && steps.stop.outputs.safe_to_backup == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $ServerDir = $env:SERVER_DIR

          $BackupDir = Join-Path $env:RUNNER_TEMP "FullDesktopBackup"

          $ZipPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (!(Test-Path $DesktopDir)) {
            throw "User desktop does not exist."
          }

          if (!(Test-Path $ServerDir)) {
            throw "Minecraft directory does not exist."
          }

          $SourceMods = @(
            Get-ChildItem "$ServerDir\mods" -Filter "*.jar" -File -Recurse
          )

          if ($SourceMods.Count -lt 10) {
            throw "Source Minecraft mod count is too low."
          }

          if (Test-Path $BackupDir) {
            Remove-Item $BackupDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "===================================="
          Write-Host "FULL DESKTOP BACKUP"
          Write-Host "Source: $DesktopDir"
          Write-Host "===================================="

          & robocopy.exe `
            $DesktopDir `
            $BackupDir `
            /E `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:2 `
            /XJ `
            /SL

          $CopyCode = $LASTEXITCODE

          if ($CopyCode -ge 8) {
            throw "Robocopy failed with code $CopyCode"
          }

          $global:LASTEXITCODE = 0

          $Files = @(
            Get-ChildItem -LiteralPath $BackupDir -File -Recurse -Force
          )

          $TotalBytes = [long](
            ($Files | Measure-Object Length -Sum).Sum
          )

          $BackupMods = @(
            Get-ChildItem "$BackupDir\Minecraft\mods" -Filter "*.jar" -File -Recurse
          )

          Write-Host "Total files: $($Files.Count)"
          Write-Host "Total bytes: $TotalBytes"
          Write-Host "Minecraft mods: $($BackupMods.Count)"

          if ($Files.Count -lt 10) {
            throw "Backup contains too few files."
          }

          if ($TotalBytes -lt 1048576) {
            throw "Backup is smaller than 1 MB."
          }

          if ($BackupMods.Count -lt 10) {
            throw "Backup does not contain enough Minecraft mods."
          }

          if (Test-Path $ZipPath) {
            Remove-Item $ZipPath -Force
          }

          Write-Host "Creating ZIP archive..."

          tar.exe -a -c -f $ZipPath -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP creation failed."
          }

          $ZipSize = (Get-Item $ZipPath).Length

          if ($ZipSize -lt 1048576) {
            throw "ZIP archive is suspiciously small."
          }

          $ArchiveList = @(tar.exe -tf $ZipPath)

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP verification failed."
          }

          $ArchiveMods = @(
            $ArchiveList | Where-Object {
              $_ -match '(^|/)Minecraft/mods/.*\.jar$'
            }
          )

          if ($ArchiveMods.Count -lt 10) {
            throw "ZIP archive does not contain the Minecraft mods."
          }

          $Hash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash.ToLower()

          Set-Content `
            -Path $HashPath `
            -Value "$Hash  Minecraft-EmergencyBackup.zip" `
            -Encoding ascii

          Write-Host "===================================="
          Write-Host "BACKUP VERIFIED"
          Write-Host "ZIP size: $ZipSize bytes"
          Write-Host "Files: $($Files.Count)"
          Write-Host "Mods: $($ArchiveMods.Count)"
          Write-Host "SHA256: $Hash"
          Write-Host "===================================="

      # --------------------------------------------------
      # 12. Upload Verified Backup
      # --------------------------------------------------

      - name: Upload Backup to GitHub Release
        if: always() && steps.backup.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ZipPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (!(Test-Path $ZipPath) -or !(Test-Path $HashPath)) {
            throw "Verified backup files are missing."
          }

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host "Uploading verified desktop backup..."

          gh release create $Tag `
            $ZipPath `
            $HashPath `
            --title "Minecraft Full Desktop Backup $env:GITHUB_RUN_ID" `
            --notes "Complete NvDAdmin Desktop backup. Original relative paths preserved. ZIP and SHA256 verified."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup successfully uploaded."

      # --------------------------------------------------
      # 13. Final Status
      # --------------------------------------------------

      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "===================================="
          Write-Host "WORKFLOW FINISHED"
          Write-Host "===================================="
          Write-Host "Desktop: $env:DESKTOP_DIR"
          Write-Host "Minecraft: $env:SERVER_DIR"
          Write-Host "Backup: Full Desktop"
          Write-Host "===================================="
