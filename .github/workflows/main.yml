name: Windows RDP + Minecraft Forge + Playiton:  workflow_dispatch:  permissions:  contents: write  jobs:  build:      runs-on: windows-latest        timeout-minutes: 360        steps:          - name: Checkout Repository              uses: actions/checkout@v4              - name: Restore Minecraft Files              shell: pwsh                run: |                  $b="$env:GITHUB_WORKSPACE\persistent-data\Minecraft"; $s="C:\RDP-Persistent\Minecraft"                    New-Item -ItemType Directory -Force $s|Out-Null                    if(Test-Path $b){try{Copy-Item "$b\*" $s -Recurse -Force -ErrorAction Stop}catch{Write-Warning $_}}                    exit 0                - name: Install Java 17              uses: actions/setup-java@v4                with:                  distribution: temurin                    java-version: '17'                - name: Install Minecraft Forge              shell: pwsh                run: |                  $s='C:\RDP-Persistent\Minecraft'; New-Item -ItemType Directory -Force $s|Out-Null; Set-Location $s                    if(!(Test-Path run.bat)){Invoke-WebRequest 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar' -OutFile forge.jar;java -jar forge.jar --installServer}                    Set-Content eula.txt 'eula=true'                - name: Create Admin Account              shell: pwsh                env:                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}                  run: |                  $p=ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force                    if(!(Get-LocalUser NvDAdmin -ErrorAction SilentlyContinue)){New-LocalUser NvDAdmin -Password $p -PasswordNeverExpires}                    Add-LocalGroupMember Administrators NvDAdmin -ErrorAction SilentlyContinue                - name: Install Tailscale              shell: pwsh                env:                  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}                  run: |                  Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile C:\ts.msi                    Start-Process msiexec -ArgumentList '/i C:\ts.msi /quiet /norestart' -Wait;Start-Sleep 5                    & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=github-rdp-server;Start-Sleep 8                    Write-Host "Tailscale IP: $(& 'C:\Program Files\Tailscale\tailscale.exe' ip -4)";Write-Host 'Username: NvDAdmin'                - name: Start Playit Agent              shell: pwsh                env:                  PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}                  run: |                  Invoke-WebRequest 'https://github.com/playit-cloud/playit-agent/releases/download/v2.0.2/playitd-windows-x86_64.exe' -OutFile C:\playitd.exe                    $p=Start-Process C:\playitd.exe -ArgumentList @('--secret',$env:PLAYIT_SECRET_KEY) -PassThru -WindowStyle Hidden;Start-Sleep 12                    if($p.HasExited){throw 'Playit failed'};Write-Host 'Playit Agent started!'                - name: Start Minecraft and Auto Backup              shell: pwsh                run: |                  $s='C:\RDP-Persistent\Minecraft';$b="$env:GITHUB_WORKSPACE\persistent-data\Minecraft";Set-Location $s                    $p=Start-Process cmd.exe -ArgumentList '/c run.bat nogui' -WorkingDirectory $s -PassThru;Write-Host 'Minecraft Forge Started!'                    for($i=1;$i-le 330;$i++){Start-Sleep 60;if($p.HasExited){break};if($i%5-eq 0){Write-Host "[$i/330] Server running...";Copy-Item "$s\*" $b -Recurse -Force -Exclude logs,crash-reports -ErrorAction SilentlyContinue}}                - name: Keep Runner Alive              if: always()                shell: pwsh                run: Start-Sleep -Seconds 172800
