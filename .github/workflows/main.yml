
name: Windows RDP + Minecraft Forge + Playit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: C:\Users\Public\Desktop
      SERVER_DIR: C:\Users\Public\Desktop

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # RESTORE LATEST BACKUP
      # --------------------------------------------------

      - name: Restore Latest Desktop Backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $DesktopDir = $env:DESKTOP_DIR
          $RestoreDir = Join-Path $env:RUNNER_TEMP "MinecraftRestore"

          New-Item -ItemType Directory -Force -Path $DesktopDir | Out-Null
          New-Item -ItemType Directory -Force -Path $RestoreDir | Out-Null

          Write-Host "Searching for the latest Minecraft backup..."

          $Releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json

          $Latest = $Releases |
            Where-Object {
              $_.tagName -like "minecraft-backup-*" -and
              $_.isDraft -eq $false -and
              $_.isPrerelease -eq $false
            } |
            Select-Object -First 1

          if ($null -eq $Latest) {
            Write-Host "No previous Minecraft backup found."
            Write-Host "Starting with the current runner desktop."
            exit 0
          }

          Write-Host "Latest backup: $($Latest.tagName)"

          gh release download $Latest.tagName `
            --pattern "Minecraft-EmergencyBackup.zip" `
            --dir $RestoreDir

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the backup ZIP."
          }

          $ZipPath = Join-Path $RestoreDir "Minecraft-EmergencyBackup.zip"

          if (!(Test-Path $ZipPath)) {
            throw "Backup ZIP was not found."
          }

          if ((Get-Item $ZipPath).Length -lt 1024) {
            throw "Backup ZIP is suspiciously small."
          }

          Write-Host "Extracting backup to Public Desktop..."

          tar.exe -xf $ZipPath -C $DesktopDir

          if ($LASTEXITCODE -ne 0) {
            throw "Backup extraction failed."
          }

          Write-Host "Backup restored successfully."

      # --------------------------------------------------
      # PREPARE SERVER
      # --------------------------------------------------

      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $DesktopDir = $env:DESKTOP_DIR
          $ServerDir = $env:SERVER_DIR

          New-Item -ItemType Directory -Force -Path $ServerDir | Out-Null

          Write-Host "Checking server location..."

          $RootRunBat = Join-Path $ServerDir "run.bat"

          if (!(Test-Path $RootRunBat)) {

            Write-Host "run.bat not found in desktop root."
            Write-Host "Searching inside desktop folders..."

            $Found = Get-ChildItem -Path $DesktopDir `
              -Filter "run.bat" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DirectoryName -ne $ServerDir
              } |
              Select-Object -First 1

            if ($null -eq $Found) {
              throw "run.bat was not found anywhere on Public Desktop."
            }

            $SourceDir = $Found.DirectoryName

            Write-Host "Found server files in: $SourceDir"
            Write-Host "Copying server files to desktop root..."

            robocopy $SourceDir $ServerDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ

            $CopyCode = $LASTEXITCODE

            if ($CopyCode -ge 8) {
              throw "Robocopy failed with exit code $CopyCode"
            }

            $global:LASTEXITCODE = 0
          }
          else {
            Write-Host "run.bat already exists in desktop root."
            Write-Host "No server folder copy is needed."
          }

          if (!(Test-Path $RootRunBat)) {
            throw "Server run.bat is still missing."
          }

          # Remove an old stop marker
          Remove-Item (Join-Path $ServerDir "STOP_SERVER.txt") `
            -Force -ErrorAction SilentlyContinue

          # Create start shortcut
          @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0"
          call run.bat nogui
          pause
          '@ | Set-Content `
            (Join-Path $DesktopDir "START MINECRAFT SERVER.bat") `
            -Encoding ascii

          # Create safe stop shortcut
          @'
          @echo off
          title Stop Minecraft and Backup
          echo STOP>"%~dp0STOP_SERVER.txt"
          echo Stop request sent.
          echo Wait for GitHub Actions to finish the backup.
          pause
          '@ | Set-Content `
            (Join-Path $DesktopDir "STOP SERVER + BACKUP.bat") `
            -Encoding ascii

          Write-Host "Minecraft server prepared."
          Write-Host "Server directory: $ServerDir"
          Write-Host "Desktop backup directory: $DesktopDir"

          $global:LASTEXITCODE = 0
          exit 0

      # --------------------------------------------------
      # CONFIGURE RDP
      # --------------------------------------------------

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is empty."
          }

          $Username = "NvDAdmin"

          Write-Host "Creating or updating RDP account..."

          $ExistingUser = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {
            net.exe user $Username $env:RDP_PASSWORD /add
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create RDP user."
            }
          }
          else {
            net.exe user $Username $env:RDP_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw "Could not update RDP password."
            }
          }

          net.exe localgroup Administrators $Username /add

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured."
          Write-Host "Username: $Username"

      # --------------------------------------------------
      # INSTALL AND CONNECT TAILSCALE
      # --------------------------------------------------

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is empty."
          }

          $TailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $TailscaleExe)) {
            Write-Host "Installing Tailscale..."

            $Installer = Join-Path $env:RUNNER_TEMP "tailscale-setup.exe"

            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
              -OutFile $Installer

            Start-Process -FilePath $Installer `
              -ArgumentList "/quiet" `
              -Wait

          }

          if (!(Test-Path $TailscaleExe)) {
            throw "Tailscale executable not found after installation."
          }

          Set-Service -Name Tailscale -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service -Name Tailscale `
            -ErrorAction SilentlyContinue

          & $TailscaleExe up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="minecraft-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $TailscaleIP = & $TailscaleExe ip -4

          if ([string]::IsNullOrWhiteSpace($TailscaleIP)) {
            throw "Could not get Tailscale IP."
          }

          "TAILSCALE_IP=$TailscaleIP" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $TailscaleIP"

      - name: Show RDP Address
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "RDP CONNECTION"
          Write-Host "======================================"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "Username: NvDAdmin"
          Write-Host "Password: The RDP_PASSWORD secret"
          Write-Host "======================================"

      # --------------------------------------------------
      # START PLAYIT
      # --------------------------------------------------

      - name: Start Playit
        shell: pwsh
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET_KEY)) {
            Write-Host "Playit secret is empty. Skipping Playit."
            exit 0
          }

          $PlayitExe = Join-Path $env:RUNNER_TEMP "playit.exe"

          Write-Host "Downloading Playit agent..."

          Invoke-WebRequest `
            -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" `
            -OutFile $PlayitExe

          if (!(Test-Path $PlayitExe)) {
            throw "Playit executable was not downloaded."
          }

          $PlayitLog = Join-Path $env:RUNNER_TEMP "playit.log"

          $PlayitProcess = Start-Process `
            -FilePath $PlayitExe `
            -ArgumentList @("--secret", $env:PLAYIT_SECRET_KEY) `
            -WorkingDirectory $env:RUNNER_TEMP `
            -RedirectStandardOutput $PlayitLog `
            -RedirectStandardError $PlayitLog `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          if ($PlayitProcess.HasExited) {
            Get-Content $PlayitLog -ErrorAction SilentlyContinue
            throw "Playit process exited unexpectedly."
          }

          Write-Host "Playit agent started."

      # --------------------------------------------------
      # CONFIGURE RCON
      # --------------------------------------------------

      - name: Configure Minecraft RCON
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Properties = Join-Path $env:SERVER_DIR "server.properties"

          if (!(Test-Path $Properties)) {
            New-Item -ItemType File -Path $Properties -Force | Out-Null
          }

          $Lines = @()
          if (Test-Path $Properties) {
            $Lines = @(Get-Content $Properties)
          }

          $RconPassword = [guid]::NewGuid().ToString("N")

          function Set-Property {
            param(
              [string]$Key,
              [string]$Value
            )

            $script:Lines = @(
              $script:Lines | Where-Object {
                $_ -notmatch "^$([regex]::Escape($Key))="
              }
            )

            $script:Lines += "$Key=$Value"
          }

          Set-Property "enable-rcon" "true"
          Set-Property "rcon.port" "25575"
          Set-Property "rcon.password" $RconPassword

          $Lines | Set-Content $Properties -Encoding ascii

          "RCON_PASSWORD=$RconPassword" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "RCON configured."

      # --------------------------------------------------
      # START MINECRAFT SERVER
      # --------------------------------------------------

      - name: Start Minecraft Forge Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $RunBat = Join-Path $ServerDir "run.bat"

          if (!(Test-Path $RunBat)) {
            throw "run.bat does not exist."
          }

          Write-Host "Starting Minecraft Forge server..."
          Write-Host "Working directory: $ServerDir"

          $Process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "run.bat", "nogui" `
            -WorkingDirectory $ServerDir `
            -PassThru `
            -WindowStyle Hidden

          "SERVER_LAUNCH_PID=$($Process.Id)" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Server launch process started."
          Write-Host "Waiting for server startup..."

      # --------------------------------------------------
      # KEEP RUNNER ALIVE
      # --------------------------------------------------

      - name: Keep Server Running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $StopFile = Join-Path $ServerDir "STOP_SERVER.txt"

          $StartedAt = Get-Date
          $MaxMinutes = 320
          $MissingJavaCount = 0
          $StartupGraceSeconds = 120

          Write-Host "Server is running."
          Write-Host "Create STOP_SERVER.txt to stop and backup."

          while (((Get-Date) - $StartedAt).TotalMinutes -lt $MaxMinutes) {

            if (Test-Path $StopFile) {
              Write-Host "Stop marker detected."
              break
            }

            $JavaProcesses = @(
              Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" |
              Where-Object {
                $_.CommandLine -match "forge|forgeserver|user_jvm_args"
              }
            )

            if ($JavaProcesses.Count -eq 0) {
              if (((Get-Date) - $StartedAt).TotalSeconds -gt $StartupGraceSeconds) {
                $MissingJavaCount++
              }
            }
            else {
              $MissingJavaCount = 0
            }

            if ($MissingJavaCount -ge 6) {
              Write-Host "Minecraft Java process is no longer detected."
              break
            }

            Start-Sleep -Seconds 10
          }

          Write-Host "Server wait stage finished."

      # --------------------------------------------------
      # STOP SERVER SAFELY
      # --------------------------------------------------

      - name: Stop Minecraft Safely
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $ServerDir = $env:SERVER_DIR
          $RconPassword = $env:RCON_PASSWORD

          function Read-RconPacket {
            param([System.IO.Stream]$Stream)

            $LengthBytes = New-Object byte[] 4
            $Read = 0

            while ($Read -lt 4) {
              $Count = $Stream.Read($LengthBytes, $Read, 4 - $Read)
              if ($Count -le 0) {
                throw "RCON connection closed."
              }
              $Read += $Count
            }

            $Length = [BitConverter]::ToInt32($LengthBytes, 0)

            if ($Length -lt 10 -or $Length -gt 4096) {
              throw "Invalid RCON packet length."
            }

            $Data = New-Object byte[] $Length
            $Read = 0

            while ($Read -lt $Length) {
              $Count = $Stream.Read($Data, $Read, $Length - $Read)
              if ($Count -le 0) {
                throw "Incomplete RCON packet."
              }
              $Read += $Count
            }

            return @{
              Id = [BitConverter]::ToInt32($Data, 0)
              Type = [BitConverter]::ToInt32($Data, 4)
              Body = [Text.Encoding]::UTF8.GetString($Data, 8, $Length - 10)
            }
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $Payload = [Text.Encoding]::UTF8.GetBytes($Body + [char]0 + [char]0)
            $Length = 8 + $Payload.Length

            $Packet = New-Object byte[] (4 + $Length)

            [BitConverter]::GetBytes($Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes($Id).CopyTo($Packet, 4)
            [BitConverter]::GetBytes($Type).CopyTo($Packet, 8)
            $Payload.CopyTo($Packet, 12)

            $Stream.Write($Packet, 0, $Packet.Length)
            $Stream.Flush()
          }

          $JavaProcesses = @(
            Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" |
            Where-Object {
              $_.CommandLine -match "forge|forgeserver|user_jvm_args"
            }
          )

          if ($JavaProcesses.Count -eq 0) {
            Write-Host "No Minecraft Java process detected."
          }
          else {
            Write-Host "Attempting graceful RCON shutdown..."

            $Client = $null

            try {
              if ([string]::IsNullOrWhiteSpace($RconPassword)) {
                throw "RCON password is unavailable."
              }

              $Client = [System.Net.Sockets.TcpClient]::new()
              $Client.ReceiveTimeout = 5000
              $Client.SendTimeout = 5000
              $Client.Connect("127.0.0.1", 25575)

              $Stream = $Client.GetStream()

              Send-RconPacket $Stream 100 3 $RconPassword
              $AuthResponse = Read-RconPacket $Stream

              if ($AuthResponse.Id -eq -1) {
                throw "RCON authentication failed."
              }

              if ($AuthResponse.Id -ne 100) {
                throw "Unexpected RCON authentication response."
              }

              Send-RconPacket $Stream 101 2 "stop"
              $null = Read-RconPacket $Stream

              Write-Host "RCON stop command sent."
            }
            catch {
              Write-Warning "RCON shutdown failed: $_"
            }
            finally {
              if ($null -ne $Client) {
                $Client.Close()
              }
            }

            Write-Host "Waiting up to 120 seconds for Java to exit..."

            $Deadline = (Get-Date).AddSeconds(120)

            do {
              Start-Sleep -Seconds 5

              $Remaining = @(
                Get-CimInstance Win32_Process -Filter "Name = 'java.exe'" |
                Where-Object {
                  $_.CommandLine -match "forge|forgeserver|user_jvm_args"
                }
              )

            } while ($Remaining.Count -gt 0 -and (Get-Date) -lt $Deadline)

            if ($Remaining.Count -gt 0) {
              Write-Warning "Minecraft did not stop gracefully."
              Write-Warning "Force stopping matching Minecraft Java processes."

              foreach ($Process in $Remaining) {
                try {
                  Stop-Process -Id $Process.ProcessId -Force -ErrorAction Stop
                }
                catch {
                  Write-Warning "Could not stop PID $($Process.ProcessId): $_"
                }
              }
            }
            else {
              Write-Host "Minecraft stopped gracefully."
            }
          }

      # --------------------------------------------------
      # FULL DESKTOP BACKUP
      # --------------------------------------------------

      - name: Create Full Desktop Backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $DesktopDir = $env:DESKTOP_DIR
          $BackupDir = Join-Path $env:RUNNER_TEMP "MinecraftFullDesktopBackup"
          $ZipPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashPath = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          Remove-Item $BackupDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $ZipPath -Force -ErrorAction SilentlyContinue
          Remove-Item $HashPath -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "Backing up the entire Public Desktop..."
          Write-Host "Source: $DesktopDir"
          Write-Host "Destination: $BackupDir"

          robocopy $DesktopDir $BackupDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ

          $CopyCode = $LASTEXITCODE

          if ($CopyCode -ge 8) {
            throw "Desktop backup failed. Robocopy exit code: $CopyCode"
          }

          $global:LASTEXITCODE = 0

          Write-Host "Creating ZIP archive..."

          tar.exe -a -c -f $ZipPath -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP creation failed."
          }

          if (!(Test-Path $ZipPath)) {
            throw "Backup ZIP was not created."
          }

          if ((Get-Item $ZipPath).Length -lt 1024) {
            throw "Backup ZIP is suspiciously small."
          }

          $Hash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash

          "$Hash  Minecraft-EmergencyBackup.zip" |
            Set-Content $HashPath -Encoding ascii

          "BACKUP_ZIP=$ZipPath" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "BACKUP_HASH=$HashPath" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Full desktop backup created."
          Write-Host "ZIP size: $((Get-Item $ZipPath).Length) bytes"

      # --------------------------------------------------
      # UPLOAD BACKUP TO GITHUB RELEASE
      # --------------------------------------------------

      - name: Upload Backup to GitHub Release
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $ZipPath = $env:BACKUP_ZIP
          $HashPath = $env:BACKUP_HASH

          if ([string]::IsNullOrWhiteSpace($ZipPath) -or
              [string]::IsNullOrWhiteSpace($HashPath)) {
            throw "Backup files were not created. Cannot upload."
          }

          if (!(Test-Path $ZipPath) -or !(Test-Path $HashPath)) {
            throw "Backup ZIP or SHA256 file is missing."
          }

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host "Creating GitHub Release: $Tag"

          gh release create $Tag `
            $ZipPath `
            $HashPath `
            --title "Minecraft Desktop Backup $env:GITHUB_RUN_ID" `
            --notes "Automatic full Public Desktop backup."

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload backup to GitHub Release."
          }

          Write-Host "Backup uploaded successfully."

      # --------------------------------------------------
      # FINAL STATUS
      # --------------------------------------------------

      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "MINECRAFT WORKFLOW FINISHED"
          Write-Host "======================================"
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Run ID: $env:GITHUB_RUN_ID"
          Write-Host "Server directory: $env:SERVER_DIR"
          Write-Host "Desktop directory: $env:DESKTOP_DIR"
          Write-Host "======================================"
