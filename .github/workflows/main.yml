name: Windows RDP + Minecraft Forge + Playit



on:

  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  build:
  
    runs-on: windows-latest
    
    timeout-minutes: 360
    
    steps:
    
      - name: Checkout Repository
      
        uses: actions/checkout@v4
        
        with:
        
          persist-credentials: true
          


      - name: Restore Minecraft Files
      
        shell: pwsh
        
        run: |
        
          $Backup = "$env:GITHUB_WORKSPACE\persistent-data\Minecraft"
          
          $Server = 'C:\RDP-Persistent\Minecraft'
          
          New-Item -ItemType Directory -Force -Path $Server | Out-Null
          
          if (Test-Path $Backup) {
          
            robocopy $Backup $Server /E /R:2 /W:2
            
            if ($LASTEXITCODE -ge 8) { Write-Warning "Restore robocopy code $LASTEXITCODE; continuing with available files." }
            
          }
          


      - name: Install Java 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          


      - name: Install Minecraft Forge
      
        shell: pwsh
        
        run: |
        
          $Server = 'C:\RDP-Persistent\Minecraft'
          
          New-Item -ItemType Directory -Force -Path $Server | Out-Null
          
          Set-Location $Server
          
          if (!(Test-Path "$Server\run.bat")) {
          
            $Installer = "$Server\forge-installer.jar"
            
            Invoke-WebRequest 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar' -OutFile $Installer
            
            java -jar $Installer --installServer
            
          }
          
          if (!(Test-Path "$Server\run.bat")) { throw 'Forge installation failed!' }
          
          Set-Content "$Server\eula.txt" 'eula=true'
          


      - name: Enable Remote Desktop
      
        shell: pwsh
        
        run: |
        
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0
          
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' UserAuthentication 1
          
          New-NetFirewallRule -DisplayName 'RDP Tailscale' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow -ErrorAction SilentlyContinue
          


      - name: Create Admin Account
      
        shell: pwsh
        
        env:
        
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          
        run: |
        
          $p = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          
          if (!(Get-LocalUser NvDAdmin -ErrorAction SilentlyContinue) -and $env:RDP_PASSWORD) { New-LocalUser NvDAdmin -Password $p -PasswordNeverExpires }
          
          Add-LocalGroupMember Administrators NvDAdmin -ErrorAction SilentlyContinue
          


      - name: Install Tailscale
      
        shell: pwsh
        
        env:
        
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          
        run: |
        
          Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile C:\tailscale.msi
          
          Start-Process msiexec -ArgumentList '/i C:\tailscale.msi /quiet /norestart' -Wait
          
          Start-Sleep 5
          
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=github-rdp-server
          
          Start-Sleep 8
          
          Write-Host "Tailscale IP: $(& 'C:\Program Files\Tailscale\tailscale.exe' ip -4)"
          
          Write-Host 'Username: NvDAdmin'
          


      - name: Start Playit Agent
      
        shell: pwsh
        
        env:
        
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
          
        run: |
        
          Invoke-WebRequest 'https://github.com/playit-cloud/playit-agent/releases/download/v2.0.2/playitd-windows-x86_64.exe' -OutFile C:\playitd.exe
          
          $p = Start-Process C:\playitd.exe -ArgumentList @('--secre





































































