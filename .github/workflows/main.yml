
name: Windows RDP + Minecraft Forge + Playit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      SERVER_DIR: C:\RDP-Persistent\Minecraft
      BACKUP_DIR: ${{ github.workspace }}\persistent-data\Minecraft

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore Minecraft Backup
        shell: pwsh
        run: |
          $Server = $env:SERVER_DIR
          $Backup = $env:BACKUP_DIR

          New-Item -ItemType Directory -Force -Path $Server | Out-Null

          if (Test-Path $Backup) {
              robocopy $Backup $Server /E /R:2 /W:2
              $rc = $LASTEXITCODE

              if ($rc -ge 8) {
                  throw "Backup restore failed. Robocopy code: $rc"
              }

              Write-Host "Minecraft backup restored."
          }
          else {
              Write-Host "No previous backup found."
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Minecraft Forge
        shell: pwsh
        run: |
          $Server = $env:SERVER_DIR
          New-Item -ItemType Directory -Force -Path $Server | Out-Null
          Set-Location $Server

          if (!(Test-Path "$Server\run.bat")) {
              $Installer = "$env:RUNNER_TEMP\forge-installer.jar"

              Invoke-WebRequest `
                -Uri "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar" `
                -OutFile $Installer

              java -jar $Installer --installServer

              if ($LASTEXITCODE -ne 0) {
                  throw "Forge installation failed."
              }
          }

          Set-Content -Path "$Server\eula.txt" -Value "eula=true"
          Write-Host "Forge is ready."

      - name: Enable RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $User = "NvDAdmin"

          $Existing = Get-LocalUser -Name $User -ErrorAction SilentlyContinue

          if ($Existing) {
              net user $User "$env:RDP_PASSWORD"
          }
          else {
              net user $User "$env:RDP_PASSWORD" /add
          }

          net localgroup administrators $User /add

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP via Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Action Allow `
            -ErrorAction SilentlyContinue

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP enabled."

      - name: Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$Msi`" /qn" `
            -Wait

          Start-Service Tailscale -ErrorAction SilentlyContinue

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --unattended

          Start-Sleep -Seconds 10

          & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

      - name: Start Playit
        shell: pwsh
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET_KEY)) {
              throw "PLAYIT_SECRET_KEY secret is missing."
          }

          $Playit = "$env:RUNNER_TEMP\playit.exe"
          $PlayitLog = "$env:RUNNER_TEMP\playit.log"
          $PlayitError = "$env:RUNNER_TEMP\playit-error.log"

          Invoke-WebRequest `
            -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v2.0.2/playit-windows-x86_64.exe" `
            -OutFile $Playit

          $PlayitProcess = Start-Process `
            -FilePath $Playit `
            -ArgumentList @("--secret", $env:PLAYIT_SECRET_KEY) `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $PlayitLog `
            -RedirectStandardError $PlayitError

          Write-Host "Playit started. PID: $($PlayitProcess.Id)"

      - name: Run Minecraft and Keep Runner Alive
        shell: pwsh
        timeout-minutes: 345
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $Server = $env:SERVER_DIR
          $Backup = $env:BACKUP_DIR

          New-Item -ItemType Directory -Force -Path $Backup | Out-Null
          Set-Location $Server

          function Save-MinecraftBackup {
              Write-Host "Starting Minecraft backup..."

              if ($script:MinecraftProcess -and !$script:MinecraftProcess.HasExited) {
                  try {
                      $script:MinecraftProcess.StandardInput.WriteLine("save-all flush")
                      Start-Sleep -Seconds 5
                  }
                  catch {
                      Write-Warning "Could not send save-all."
                  }
              }

              robocopy $Server $Backup /MIR /R:2 /W:2 /XD "$Server\logs" "$Server\crash-reports"

              $rc = $LASTEXITCODE

              if ($rc -ge 8) {
                  throw "Robocopy backup failed. Code: $rc"
              }

              $global:LASTEXITCODE = 0

              git -C $env:GITHUB_WORKSPACE add -- persistent-data/Minecraft

              if ($LASTEXITCODE -ne 0) {
                  throw "Git add failed."
              }

              git -C $env:GITHUB_WORKSPACE diff --cached --quiet
              $Changes = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($Changes -eq 1) {
                  git -C $env:GITHUB_WORKSPACE commit -m "Minecraft automatic backup"

                  if ($LASTEXITCODE -ne 0) {
                      throw "Git commit failed."
                  }

                  git -C $env:GITHUB_WORKSPACE push origin "HEAD:$env:BRANCH_NAME"

                  if ($LASTEXITCODE -ne 0) {
                      throw "Git push failed."
                  }

                  Write-Host "Backup pushed to GitHub."
              }
              elseif ($Changes -eq 0) {
                  Write-Host "No backup changes."
              }
              else {
                  throw "Git diff failed."
              }

              $global:LASTEXITCODE = 0
          }

          $script:MinecraftProcess = $null

          try {
              $StartInfo = New-Object System.Diagnostics.ProcessStartInfo
              $StartInfo.FileName = "cmd.exe"
              $StartInfo.Arguments = "/c run.bat nogui"
              $StartInfo.WorkingDirectory = $Server
              $StartInfo.UseShellExecute = $false
              $StartInfo.CreateNoWindow = $true
              $StartInfo.RedirectStandardInput = $true
              $StartInfo.RedirectStandardOutput = $true
              $StartInfo.RedirectStandardError = $true

              $script:MinecraftProcess = New-Object System.Diagnostics.Process
              $script:MinecraftProcess.StartInfo = $StartInfo

              if (!$script:MinecraftProcess.Start()) {
                  throw "Minecraft process could not start."
              }

              # Drain output asynchronously to prevent pipe blocking.
              $StdOutTask = $script:MinecraftProcess.StandardOutput.ReadToEndAsync()
              $StdErrTask = $script:MinecraftProcess.StandardError.ReadToEndAsync()

              Write-Host "Minecraft started. PID: $($script:MinecraftProcess.Id)"

              $StartedAt = Get-Date
              $NextBackup = (Get-Date).AddMinutes(5)
              $MaximumRuntime = [TimeSpan]::FromMinutes(330)

              while (!$script:MinecraftProcess.HasExited) {
                  Start-Sleep -Seconds 10

                  if ((Get-Date) -ge $NextBackup) {
                      try {
                          Save-MinecraftBackup
                      }
                      catch {
                          Write-Warning "Backup failed: $_"
                      }

                      $NextBackup = (Get-Date).AddMinutes(5)
                  }

                  if (((Get-Date) - $StartedAt) -ge $MaximumRuntime) {
                      Write-Host "Maximum runtime reached. Stopping Minecraft."
                      break
                  }
              }

              if ($script:MinecraftProcess.HasExited) {
                  Write-Warning "Minecraft server has stopped."
              }
          }
          finally {
              if ($script:MinecraftProcess -and !$script:MinecraftProcess.HasExited) {
                  try {
                      Write-Host "Sending graceful stop command..."
                      $script:MinecraftProcess.StandardInput.WriteLine("stop")

                      if (!$script:MinecraftProcess.WaitForExit(90000)) {
                          Write-Warning "Minecraft did not stop in time. Terminating process."
                          $script:MinecraftProcess.Kill($true)
                          $script:MinecraftProcess.WaitForExit()
                      }
                  }
                  catch {
                      Write-Warning "Could not stop Minecraft gracefully: $_"
                  }
              }

              try {
                  Save-MinecraftBackup
              }
              catch {
                  Write-Warning "Final backup failed: $_"
              }

              if ($script:MinecraftProcess) {
                  $script:MinecraftProcess.Dispose()
              }

              Write-Host "Minecraft job finished."
          }
