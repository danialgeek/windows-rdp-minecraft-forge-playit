name: Windows RDP + Minecraft Forge + Playit



on:

  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  build:
  
    runs-on: windows-latest
    
    timeout-minutes: 360
    
    steps:
    
      - name: Checkout Repository
      
        uses: actions/checkout@v4
        
        with:
        
          persist-credentials: true
          


      - name: Restore Minecraft Files
      
        shell: pwsh
        
        run: |
        
          $Backup = "$env:GITHUB_WORKSPACE\persistent-data\Minecraft"
          
          $Server = "C:\RDP-Persistent\Minecraft"
          
          New-Item -ItemType Directory -Force -Path $Server | Out-Null
          
          if (Test-Path $Backup) {
          
            robocopy $Backup $Server /E /R:2 /W:2
            
            if ($LASTEXITCODE -ge 8) { throw "Minecraft restore failed!" }
            
          }
          


      - name: Install Java 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          


      - name: Install Minecraft Forge
      
        shell: pwsh
        
        run: |
        
          $Server = "C:\RDP-Persistent\Minecraft"
          
          New-Item -ItemType Directory -Force -Path $Server | Out-Null
          
          Set-Location $Server
          
          if (!(Test-Path "$Server\run.bat")) {
          
            $Installer = "$Server\forge-installer.jar"
            
            Invoke-WebRequest "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar" -OutFile $Installer
            
            java -jar $Installer --installServer
            
            if (!(Test-Path "$Server\run.bat")) { throw "Forge installation failed!" }
            
          }
          
          Set-Content "$Server\eula.txt" "eula=true"
          


      - name: Enable Remote Desktop
      
        shell: pwsh
        
        run: |
        
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          
          New-NetFirewallRule -DisplayName 'RDP Tailscale' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Action Allow -ErrorAction SilentlyContinue
          


      - name: Create Admin Account
      
        shell: pwsh
        
        env:
        
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          
        run: |
        
          if (!$env:RDP_PASSWORD) { throw 'RDP_PASSWORD missing!' }
          
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          
          if (!(Get-LocalUser -Name NvDAdmin -ErrorAction SilentlyContinue)) {
          
            New-LocalUser -Name NvDAdmin -Password $Password -PasswordNeverExpires
            
          }
          
          Add-LocalGroupMember -Group Administrators -Member NvDAdmin -ErrorAction SilentlyContinue
          


      - name: Install Tailscale
      
        shell: pwsh
        
        env:
        
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          
        run: |
        
          if (!$env:TAILSCALE_AUTHKEY) { throw 'TAILSCALE_AUTHKEY missing!' }
          
          Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile C:\tailscale.msi
          
          Start-Process msiexec -ArgumentList '/i C:\tailscale.msi /quiet /norestart' -Wait
          
          Start-Sleep 5
          
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="$env:TAILSCALE_AUTHKEY" --hostname=github-rdp-server
          
          Start-Sleep 8
          
          $IP = & 'C:\Program Files\Tailscale\tailscale.exe' ip -4
          
          Write-Host "RDP SERVER READY"
          
          Write-Host "Tailscale IP: $IP"
          
          Write-Host 'Username: NvDAdmin'
          


      - name: Start Playit Agent
      
        shell: pwsh
        
        env:
        
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
          
        run: |
        
          if (!$env:PLAYIT_SECRET_KEY) { throw 'PLAYIT_SECRET_KEY missing!' }
          
          $Agent = 'C:\playitd.exe'
          
          Invoke-WebRequest 'https://github.com/playit-c












































































