
name: Windows RDP + Minecraft Forge + Tailscale

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: C:\Users\NvDAdmin\Desktop
      SERVER_DIR: C:\Users\NvDAdmin\Desktop\Minecraft
      SERVER_USER: NvDAdmin
      SERVER_VERSION: 1.20.1
      FORGE_VERSION: 47.4.10
      BACKUP_PREFIX: minecraft-backup-

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Java 17
      # --------------------------------------------------

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        shell: pwsh
        run: |
          java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java installation failed."
          }

      # --------------------------------------------------
      # 3. Configure Windows RDP User
      # --------------------------------------------------

      - name: Configure RDP User and Windows Profile
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $User = Get-LocalUser -Name $env:SERVER_USER -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $env:SERVER_USER `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }
          else {
            Set-LocalUser `
              -Name $env:SERVER_USER `
              -Password $SecurePassword

            Enable-LocalUser -Name $env:SERVER_USER
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:SERVER_USER `
            -ErrorAction SilentlyContinue

          $Credential = New-Object System.Management.Automation.PSCredential(
            ".\$env:SERVER_USER",
            $SecurePassword
          )

          # ایجاد پروفایل واقعی ویندوز
          $ProfileProcess = Start-Process `
            -FilePath "$env:SystemRoot\System32\cmd.exe" `
            -ArgumentList "/c exit" `
            -Credential $Credential `
            -LoadUserProfile `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          if ($ProfileProcess.ExitCode -ne 0) {
            throw "Windows user profile initialization failed."
          }

          $UserSid = (Get-LocalUser -Name $env:SERVER_USER).SID.Value

          $Profile = $null

          for ($i = 0; $i -lt 30; $i++) {
            $Profile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.SID -eq $UserSid }

            if ($Profile -and (Test-Path $Profile.LocalPath)) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $Profile -or -not (Test-Path $Profile.LocalPath)) {
            throw "Windows profile was not created."
          }

          $Desktop = Join-Path $Profile.LocalPath "Desktop"

          New-Item -ItemType Directory -Force -Path $Desktop | Out-Null

          "RDP user configured successfully."
          "Profile: $($Profile.LocalPath)"
          "Desktop: $Desktop"

          # فعال‌سازی Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      # --------------------------------------------------
      # 4. Restore Latest Valid Desktop Backup
      # --------------------------------------------------

      - name: Restore Latest Valid Desktop Backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $TempDir = Join-Path $env:RUNNER_TEMP "MinecraftRestore"

          New-Item -ItemType Directory -Force -Path $TempDir | Out-Null

          if (-not $env:GH_TOKEN) {
            throw "GitHub token is missing."
          }

          $Releases = gh release list `
            --limit 100 `
            --json tagName,isDraft,isPrerelease |
            ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve GitHub releases."
          }

          $Candidates = $Releases |
            Where-Object {
              $_.tagName -like "$env:BACKUP_PREFIX*" `
              -and $_.isDraft -eq $false `
              -and $_.isPrerelease -eq $false
            }

          if (-not $Candidates) {
            throw "No valid Minecraft desktop backup release exists."
          }

          $Restored = $false

          foreach ($Release in $Candidates) {

            $Tag = $Release.tagName

            Write-Host "Checking backup: $Tag"

            Remove-Item $TempDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $TempDir | Out-Null

            gh release download $Tag `
              --pattern "Minecraft-EmergencyBackup.zip" `
              --pattern "Minecraft-EmergencyBackup.sha256" `
              --dir $TempDir

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not download this backup."
              continue
            }

            $Zip = Join-Path $TempDir "Minecraft-EmergencyBackup.zip"
            $HashFile = Join-Path $TempDir "Minecraft-EmergencyBackup.sha256"

            if (-not (Test-Path $Zip) -or -not (Test-Path $HashFile)) {
              Write-Warning "Backup assets are incomplete."
              continue
            }

            if ((Get-Item $Zip).Length -lt 1MB) {
              Write-Warning "Backup is too small."
              continue
            }

            $ExpectedHash = (Get-Content $HashFile -Raw).Trim().Split(" ")[0]
            $ActualHash = (Get-FileHash $Zip -Algorithm SHA256).Hash

            if ($ExpectedHash -ne $ActualHash) {
              Write-Warning "SHA256 verification failed."
              continue
            }

            $Entries = tar -tf $Zip

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Invalid ZIP archive."
              continue
            }

            $ModEntries = @(
              $Entries | Where-Object {
                $_ -match '(^|/|\.)Minecraft/mods/.*\.jar$'
              }
            )

            if ($ModEntries.Count -lt 10) {
              Write-Warning "Backup does not contain enough Minecraft mods."
              continue
            }

            $HasMinecraft = $Entries |
              Where-Object { $_ -match '(^|/|\.)Minecraft/$' }

            if (-not $HasMinecraft) {
              Write-Warning "Minecraft directory is missing."
              continue
            }

            # فقط بعد از اعتبارسنجی کامل، دسکتاپ پاک می‌شود.
            New-Item -ItemType Directory -Force -Path $DesktopDir | Out-Null

            Get-ChildItem -LiteralPath $DesktopDir -Force |
              Remove-Item -Recurse -Force

            tar -xf $Zip -C $DesktopDir

            if ($LASTEXITCODE -ne 0) {
              throw "Desktop restore extraction failed."
            }

            $RestoredServer = Join-Path $DesktopDir "Minecraft"

            if (-not (Test-Path (Join-Path $RestoredServer "run.bat"))) {
              throw "Minecraft run.bat is missing after restore."
            }

            $RestoredMods = @(
              Get-ChildItem (Join-Path $RestoredServer "mods") `
                -Filter "*.jar" `
                -File `
                -ErrorAction SilentlyContinue
            )

            if ($RestoredMods.Count -lt 10) {
              throw "Restored Minecraft mods are incomplete."
            }

            Write-Host "Desktop restored successfully."
            Write-Host "Release: $Tag"
            Write-Host "Mods: $($RestoredMods.Count)"

            $Restored = $true
            break
          }

          if (-not $Restored) {
            throw "No valid desktop backup could be restored."
          }

      # --------------------------------------------------
      # 5. Prepare Minecraft Server
      # --------------------------------------------------

      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR

          if (-not (Test-Path $ServerDir)) {
            throw "Minecraft server directory does not exist."
          }

          if (-not (Test-Path (Join-Path $ServerDir "run.bat"))) {
            throw "Forge run.bat is missing."
          }

          $ModsDir = Join-Path $ServerDir "mods"

          $Mods = @(
            Get-ChildItem $ModsDir -Filter "*.jar" -File
          )

          if ($Mods.Count -lt 10) {
            throw "Minecraft mod files are incomplete."
          }

          Write-Host "Found $($Mods.Count) mods."

          # دسترسی پوشه برای Runner و کاربر RDP
          $UserSid = (Get-LocalUser -Name $env:SERVER_USER).SID.Value

          icacls $ServerDir /grant "*${UserSid}:(OI)(CI)F" /T /C
          icacls $ServerDir /grant "Administrators:(OI)(CI)F" /T /C

          # حذف Read-only از فایل‌ها
          Get-ChildItem $ServerDir -Recurse -Force -File |
            ForEach-Object {
              $_.IsReadOnly = $false
            }

          # تنظیم حافظه Java
          $JvmArgs = Join-Path $ServerDir "user_jvm_args.txt"

          if (-not (Test-Path $JvmArgs)) {
            Set-Content -Path $JvmArgs -Value "-Xms2G`n-Xmx12G"
          }
          else {
            $Lines = Get-Content $JvmArgs |
              Where-Object {
                $_ -notmatch '^\s*-Xms' -and
                $_ -notmatch '^\s*-Xmx'
              }

            $Lines += "-Xms2G"
            $Lines += "-Xmx12G"

            Set-Content -Path $JvmArgs -Value $Lines
          }

          # تنظیم RCON
          $Properties = Join-Path $ServerDir "server.properties"

          if (-not (Test-Path $Properties)) {
            throw "server.properties is missing."
          }

          $RconPassword = -join (
            1..32 | ForEach-Object {
              '{0:x2}' -f (Get-Random -Minimum 0 -Maximum 256)
            }
          )

          Set-Content `
            -Path "$env:RUNNER_TEMP\rcon-password.txt" `
            -Value $RconPassword

          $Settings = @{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $RconPassword
            "broadcast-rcon-to-ops" = "false"
          }

          $Lines = Get-Content $Properties

          foreach ($Key in $Settings.Keys) {
            $Pattern = "^$([regex]::Escape($Key))="

            $Lines = @(
              $Lines | Where-Object { $_ -notmatch $Pattern }
            )

            $Lines += "$Key=$($Settings[$Key])"
          }

          Set-Content -Path $Properties -Value $Lines

          # فایل شروع سرور
          $StartBat = Join-Path $ServerDir "START MINECRAFT SERVER.bat"

          @'
          @echo off
          cd /d "%~dp0"
          call run.bat nogui
          pause
          '@ | Set-Content -Path $StartBat -Encoding ASCII

          # فایل توقف سرور
          $StopBat = Join-Path $ServerDir "STOP SERVER + BACKUP.bat"

          @'
          @echo off
          title Minecraft Server Shutdown
          echo Requesting safe server shutdown...
          echo STOP > "%USERPROFILE%\Desktop\STOP_SERVER.txt"
          echo Shutdown request sent.
          echo The workflow will stop Minecraft and create a GitHub Release backup.
          pause
          '@ | Set-Content -Path $StopBat -Encoding ASCII

          Write-Host "Minecraft server prepared."

      # --------------------------------------------------
      # 6. Install and Connect Tailscale
      # --------------------------------------------------

      - name: Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Msi = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          $Install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$Msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($Install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
            throw "Tailscale executable not found."
          }

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $Tailscale up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname=minecraft-runner `
            --accept-routes

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 10

          & $Tailscale status
          & $Tailscale ip -4

      # --------------------------------------------------
      # 7. Show RDP Details
      # --------------------------------------------------

      - name: Show RDP Details
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $IP = & $Tailscale ip -4

          if ($LASTEXITCODE -ne 0 -or -not $IP) {
            throw "Could not obtain Tailscale IP."
          }

          Write-Host ""
          Write-Host "===================================="
          Write-Host "RDP CONNECTION INFORMATION"
          Write-Host "===================================="
          Write-Host "IP: $IP"
          Write-Host "Username: $env:SERVER_USER"
          Write-Host "Password: Stored in GitHub Secret RDP_PASSWORD"
          Write-Host "Port: 3389"
          Write-Host "===================================="

      # --------------------------------------------------
      # 8. Start Minecraft Forge Server
      # --------------------------------------------------

      - name: Start Minecraft Forge Server
        id: minecraft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $RunBat = Join-Path $ServerDir "run.bat"

          $Marker = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"

          Remove-Item $Marker -Force -ErrorAction SilentlyContinue

          $Command = "cd /d `"$ServerDir`" && call run.bat nogui"

          $Process = Start-Process `
            -FilePath "$env:SystemRoot\System32\cmd.exe" `
            -ArgumentList "/c", $Command `
            -WorkingDirectory $ServerDir `
            -PassThru `
            -WindowStyle Hidden

          $Process.Id | Set-Content "$env:RUNNER_TEMP\minecraft-wrapper.pid"

          Write-Host "Minecraft wrapper PID: $($Process.Id)"

          $StartupDeadline = (Get-Date).AddMinutes(8)
          $ServerStarted = $false
          $LastAlive = Get-Date

          while ($true) {

            Start-Sleep -Seconds 10

            $JavaProcesses = @(
              Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -match '^javaw?\.exe$' -and
                  $_.CommandLine -match '(?i)(forge|forgeserver|user_jvm_args|minecraft)'
                }
            )

            if ($JavaProcesses.Count -gt 0) {
              $ServerStarted = $true
              $LastAlive = Get-Date
            }

            if ($ServerStarted -and $JavaProcesses.Count -eq 0) {
              if ((Get-Date) - $LastAlive -gt [TimeSpan]::FromSeconds(60)) {
                Write-Warning "Minecraft process exited."
                break
              }
            }

            if (-not $ServerStarted -and (Get-Date) -gt $StartupDeadline) {
              throw "Minecraft did not start within 8 minutes."
            }

            if (Test-Path $Marker) {
              Write-Host "Shutdown marker detected."
              break
            }

            if ($Process.HasExited) {
              if (-not $ServerStarted) {
                throw "Minecraft launcher exited before server startup."
              }

              break
            }
          }

          "Minecraft monitoring finished."

      # --------------------------------------------------
      # 9. Keep Server Running
      # --------------------------------------------------

      - name: Keep Server Running
        if: steps.minecraft.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Marker = Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt"
          $Deadline = (Get-Date).AddMinutes(330)

          while ((Get-Date) -lt $Deadline) {

            if (Test-Path $Marker) {
              Write-Host "Stop request received."
              break
            }

            $JavaProcesses = @(
              Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -match '^javaw?\.exe$' -and
                  $_.CommandLine -match '(?i)(forge|forgeserver|user_jvm_args|minecraft)'
                }
            )

            if ($JavaProcesses.Count -eq 0) {
              Write-Warning "Minecraft Java process is no longer running."
              break
            }

            Start-Sleep -Seconds 15
          }

      # --------------------------------------------------
      # 10. Stop Minecraft Safely
      # --------------------------------------------------

      - name: Stop Minecraft Safely
        id: stop
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $SafeToBackup = $false
          $ServerDir = $env:SERVER_DIR

          $JavaProcesses = @(
            Get-CimInstance Win32_Process |
              Where-Object {
                $_.Name -match '^javaw?\.exe$' -and
                $_.CommandLine -match '(?i)(forge|forgeserver|user_jvm_args|minecraft)'
              }
          )

          if ($JavaProcesses.Count -eq 0) {
            Write-Host "No Minecraft Java process detected."
            $SafeToBackup = $true
          }
          else {
            try {
              $PasswordFile = "$env:RUNNER_TEMP\rcon-password.txt"

              if (-not (Test-Path $PasswordFile)) {
                throw "RCON password file is missing."
              }

              $RconPassword = (Get-Content $PasswordFile -Raw).Trim()

              function Read-Exact {
                param(
                  [System.IO.Stream]$Stream,
                  [int]$Count
                )

                $Buffer = New-Object byte[] $Count
                $Offset = 0

                while ($Offset -lt $Count) {
                  $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

                  if ($Read -le 0) {
                    throw "RCON connection closed."
                  }

                  $Offset += $Read
                }

                return ,$Buffer
              }

              function Read-RconPacket {
                param([System.IO.Stream]$Stream)

                $LengthBytes = Read-Exact $Stream 4
                $Length = [BitConverter]::ToInt32($LengthBytes, 0)

                if ($Length -lt 10 -or $Length -gt 4096) {
                  throw "Invalid RCON packet."
                }

                $Body = Read-Exact $Stream $Length

                return @{
                  Id = [BitConverter]::ToInt32($Body, 0)
                  Type = [BitConverter]::ToInt32($Body, 4)
                }
              }

              function Send-RconPacket {
                param(
                  [System.IO.Stream]$Stream,
                  [int]$Id,
                  [int]$Type,
                  [string]$Payload
                )

                $PayloadBytes = [System.Text.Encoding]::UTF8.GetBytes($Payload)

                $Body = New-Object System.Collections.Generic.List[byte]

                $Body.AddRange([BitConverter]::GetBytes($Id))
                $Body.AddRange([BitConverter]::GetBytes($Type))
                $Body.AddRange($PayloadBytes)
                $Body.Add(0)
                $Body.Add(0)

                $Length = [BitConverter]::GetBytes([int]$Body.Count)

                $Stream.Write($Length, 0, 4)

                $Bytes = $Body.ToArray()
                $Stream.Write($Bytes, 0, $Bytes.Length)
                $Stream.Flush()
              }

              $Client = New-Object System.Net.Sockets.TcpClient(
                [System.Net.Sockets.AddressFamily]::InterNetwork
              )

              $Client.ReceiveTimeout = 5000
              $Client.SendTimeout = 5000

              $Client.Connect("127.0.0.1", 25575)

              $Stream = $Client.GetStream()

              Send-RconPacket $Stream 100 3 $RconPassword

              $AuthResponse = Read-RconPacket $Stream

              if ($AuthResponse.Id -ne 100) {
                throw "RCON authentication failed."
              }

              Send-RconPacket $Stream 101 2 "stop"

              $Client.Close()

              Write-Host "RCON stop command sent."

            }
            catch {
              Write-Warning "RCON shutdown attempt failed: $_"
            }

            $Deadline = (Get-Date).AddSeconds(180)

            while ((Get-Date) -lt $Deadline) {

              Start-Sleep -Seconds 5

              $JavaProcesses = @(
                Get-CimInstance Win32_Process |
                  Where-Object {
                    $_.Name -match '^javaw?\.exe$' -and
                    $_.CommandLine -match '(?i)(forge|forgeserver|user_jvm_args|minecraft)'
                  }
              )

              if ($JavaProcesses.Count -eq 0) {
                $SafeToBackup = $true
                break
              }
            }

            if (-not $SafeToBackup) {
              Write-Warning "Minecraft is still running. Backup will be skipped."
            }
          }

          Remove-Item `
            (Join-Path $env:DESKTOP_DIR "STOP_SERVER.txt") `
            -Force `
            -ErrorAction SilentlyContinue

          "safe_to_backup=$($SafeToBackup.ToString().ToLower())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # --------------------------------------------------
      # 11. Create Full Desktop Backup
      # --------------------------------------------------

      - name: Create Full Desktop Backup
        id: backup
        if: always() && steps.stop.outputs.safe_to_backup == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $BackupDir = Join-Path $env:RUNNER_TEMP "MinecraftDesktopBackup"
          $Zip = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashFile = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (-not (Test-Path $DesktopDir)) {
            throw "Desktop directory does not exist."
          }

          Remove-Item $BackupDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $Zip -Force -ErrorAction SilentlyContinue
          Remove-Item $HashFile -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          # کپی کل دسکتاپ با حفظ ساختار
          robocopy $DesktopDir $BackupDir `
            /E `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:2 `
            /XJ `
            /SL

          $CopyCode = $LASTEXITCODE

          if ($CopyCode -ge 8) {
            throw "Robocopy failed with exit code $CopyCode."
          }

          $global:LASTEXITCODE = 0

          $Files = @(
            Get-ChildItem $BackupDir -Recurse -Force -File
          )

          $TotalSize = ($Files | Measure-Object Length -Sum).Sum

          if ($Files.Count -lt 10) {
            throw "Desktop backup contains too few files."
          }

          if ($TotalSize -lt 1MB) {
            throw "Desktop backup is too small."
          }

          $Mods = @(
            Get-ChildItem (Join-Path $BackupDir "Minecraft\mods") `
              -Filter "*.jar" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($Mods.Count -lt 10) {
            throw "Minecraft mods are missing from backup."
          }

          # ساخت ZIP از تمام دسکتاپ
          tar -a -c -f $Zip -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP archive creation failed."
          }

          if (-not (Test-Path $Zip)) {
            throw "ZIP archive was not created."
          }

          $ArchiveEntries = tar -tf $Zip

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP archive verification failed."
          }

          $ArchiveMods = @(
            $ArchiveEntries | Where-Object {
              $_ -match '(^|/|\.)Minecraft/mods/.*\.jar$'
            }
          )

          if ($ArchiveMods.Count -lt 10) {
            throw "ZIP archive does not contain the expected mods."
          }

          $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash

          Set-Content -Path $HashFile -Value $Hash

          "backup_ready=true" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Backup completed."
          Write-Host "Files: $($Files.Count)"
          Write-Host "Size: $([math]::Round($TotalSize / 1MB, 2)) MB"
          Write-Host "Mods: $($Mods.Count)"
          Write-Host "ZIP: $Zip"
          Write-Host "SHA256: $Hash"

      # --------------------------------------------------
      # 12. Upload Backup to GitHub Release
      # --------------------------------------------------

      - name: Upload Backup to GitHub Release
        if: always() && steps.backup.outputs.backup_ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $Zip = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"
          $HashFile = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.sha256"

          if (-not (Test-Path $Zip) -or -not (Test-Path $HashFile)) {
            throw "Backup files are missing."
          }

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          gh release create $Tag `
            $Zip `
            $HashFile `
            --title "Minecraft Desktop Backup $env:GITHUB_RUN_ID" `
            --notes "Full NvDAdmin Desktop backup. Minecraft Forge 1.20.1."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup uploaded successfully."
          Write-Host "Release tag: $Tag"

      # --------------------------------------------------
      # 13. Final Status
      # --------------------------------------------------

      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "===================================="
          Write-Host "MINECRAFT WORKFLOW FINISHED"
          Write-Host "===================================="

          Write-Host "Minecraft: ${{ steps.minecraft.outcome }}"
          Write-Host "Safe Stop: ${{ steps.stop.outcome }}"
          Write-Host "Backup: ${{ steps.backup.outcome }}"
          Write-Host "Upload: ${{ steps.stop.outputs.safe_to_backup }}"
          Write-Host "===================================="
