
name: Windows RDP + Minecraft Forge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: C:\Users\NvDAdmin\Desktop
      SERVER_DIR: C:\Users\NvDAdmin\Desktop\Minecraft
      BACKUP_PREFIX: minecraft-backup-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # 1. دریافت مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. نصب Java 17
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ساخت کاربر RDP
      - name: Configure Windows RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue

          if ($User) {
            Set-LocalUser -Name "NvDAdmin" -Password $SecurePassword
          }
          else {
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # ایجاد پروفایل واقعی کاربر
          $Credential = New-Object System.Management.Automation.PSCredential(
            "NvDAdmin",
            $SecurePassword
          )

          Start-Process `
            -FilePath "$env:SystemRoot\System32\cmd.exe" `
            -ArgumentList "/c exit" `
            -Credential $Credential `
            -LoadUserProfile `
            -Wait `
            -WindowStyle Hidden

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          Write-Host "Windows user and profile configured."

      # 4. نصب Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Msi = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          $Install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$Msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($Install.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $Tailscale)) {
            throw "Tailscale executable not found."
          }

          "TAILSCALE_EXE=$Tailscale" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      # 5. اتصال Tailscale
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $env:TAILSCALE_EXE up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=danialgeek-minecraft" `
            "--accept-routes"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $IP = & $env:TAILSCALE_EXE ip -4

          if (-not $IP) {
            throw "Tailscale IP was not obtained."
          }

          "TAILSCALE_IP=$IP" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          # محدود کردن RDP به شبکه Tailscale
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule -RemoteAddress "100.64.0.0/10"

          Write-Host "Tailscale IP: $IP"

      # 6. بازیابی آخرین بکاپ
      - name: Restore Minecraft Backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $TempDir = Join-Path $env:RUNNER_TEMP "MinecraftRestore"
          $ExtractDir = Join-Path $TempDir "Extracted"

          Remove-Item $TempDir -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null
          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          $ReleaseJson = gh release list `
            --limit 100 `
            --json tagName,isDraft,isPrerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve GitHub releases."
          }

          $Releases = $ReleaseJson | ConvertFrom-Json

          $Candidates = @(
            $Releases |
              Where-Object {
                $_.tagName -like "$env:BACKUP_PREFIX*" `
                -and $_.isDraft -eq $false `
                -and $_.isPrerelease -eq $false
              }
          )

          if ($Candidates.Count -eq 0) {
            throw "No Minecraft backup release found."
          }

          $Restored = $false

          foreach ($Release in $Candidates) {

            $Tag = $Release.tagName

            Write-Host "Trying backup: $Tag"

            Remove-Item $TempDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

            $InfoJson = gh release view $Tag --json assets

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not inspect release."
              continue
            }

            $Info = $InfoJson | ConvertFrom-Json

            $ZipAsset = $Info.assets |
              Where-Object {
                $_.name -eq "Minecraft-EmergencyBackup.zip"
              } |
              Select-Object -First 1

            if (-not $ZipAsset) {
              Write-Warning "Backup ZIP not found."
              continue
            }

            gh release download $Tag `
              --pattern "Minecraft-EmergencyBackup.zip" `
              --dir $TempDir

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Download failed."
              continue
            }

            $Zip = Join-Path $TempDir "Minecraft-EmergencyBackup.zip"

            if (-not (Test-Path $Zip)) {
              Write-Warning "ZIP file does not exist."
              continue
            }

            $ZipSize = (Get-Item $Zip).Length

            Write-Host "ZIP size: $([math]::Round($ZipSize / 1MB, 2)) MB"

            if ($ZipSize -lt 1MB) {
              Write-Warning "ZIP is too small."
              continue
            }

            tar -xf $Zip -C $ExtractDir

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "ZIP extraction failed."
              continue
            }

            $Items = @(Get-ChildItem -LiteralPath $ExtractDir -Force)

            if ($Items.Count -eq 0) {
              Write-Warning "Archive is empty."
              continue
            }

            # بکاپ جدید: کل دسکتاپ در ZIP قرار دارد.
            # بکاپ قدیمی: محتویات پوشه Minecraft مستقیماً در ریشه ZIP است.

            $MinecraftFolder = Join-Path $ExtractDir "Minecraft"

            if (Test-Path $MinecraftFolder -PathType Container) {

              Write-Host "Full desktop backup detected."

              robocopy $ExtractDir $env:DESKTOP_DIR `
                /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ

              $CopyCode = $LASTEXITCODE

              if ($CopyCode -ge 8) {
                Write-Warning "Desktop restore failed."
                continue
              }

            }
            else {

              Write-Host "Legacy Minecraft-only backup detected."

              if (Test-Path $env:SERVER_DIR) {
                Remove-Item $env:SERVER_DIR -Recurse -Force
              }

              New-Item -ItemType Directory -Force -Path $env:SERVER_DIR | Out-Null

              Get-ChildItem -LiteralPath $ExtractDir -Force |
                Move-Item -Destination $env:SERVER_DIR
            }

            Write-Host "Backup restored successfully."
            Write-Host "Release: $Tag"

            $Restored = $true
            break
          }

          if (-not $Restored) {
            throw "Could not restore any backup."
          }

      # 7. آماده‌سازی فایل‌های Minecraft
      - name: Prepare Minecraft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:SERVER_DIR)) {
            throw "Minecraft folder does not exist: $env:SERVER_DIR"
          }

          Set-Location $env:SERVER_DIR

          # حذف علامت توقف باقی‌مانده از بکاپ قبلی
          Remove-Item "$env:DESKTOP_DIR\STOP_SERVER.txt" `
            -Force -ErrorAction SilentlyContinue

          # فایل اجرای سرور
          $StartBat = @'
          @echo off
          cd /d "%~dp0"
          if not exist run.bat (
              echo ERROR: run.bat not found.
              pause
              exit /b 1
          )
          call run.bat nogui
          '@

          Set-Content `
            -Path "$env:SERVER_DIR\START MINECRAFT SERVER.bat" `
            -Value $StartBat `
            -Encoding ASCII

          # فایل توقف سرور و درخواست بکاپ
          $StopBat = @'
          @echo off
          echo STOP > "%USERPROFILE%\Desktop\STOP_SERVER.txt"
          echo Stop request sent. The workflow will stop the server and create a backup.
          pause
          '@

          Set-Content `
            -Path "$env:SERVER_DIR\STOP SERVER + BACKUP.bat" `
            -Value $StopBat `
            -Encoding ASCII

          # دسترسی کامل کاربر
          icacls $env:SERVER_DIR /grant "NvDAdmin:(OI)(CI)F" /T /C

          Write-Host "Minecraft directory prepared."
          Write-Host "Server directory: $env:SERVER_DIR"

      # 8. نمایش اطلاعات RDP
      - name: Show RDP Information
        shell: pwsh
        run: |
          Write-Host "===================================="
          Write-Host "RDP SERVER READY"
          Write-Host "===================================="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "Username: NvDAdmin"
          Write-Host "Password: GitHub secret RDP_PASSWORD"
          Write-Host "===================================="

      # 9. اجرای Minecraft و نگه داشتن رانر
      - name: Start Minecraft and Keep Runner Alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:SERVER_DIR

          $RunBat = Join-Path $env:SERVER_DIR "run.bat"

          if (-not (Test-Path $RunBat)) {
            throw "run.bat is missing. The workflow will not reinstall Forge automatically."
          }

          $SafeStopFile = Join-Path $env:RUNNER_TEMP "minecraft-safe-stop.txt"
          Remove-Item $SafeStopFile -Force -ErrorAction SilentlyContinue

          $ProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
          $ProcessInfo.FileName = $env:ComSpec
          $ProcessInfo.Arguments = '/c ""run.bat" nogui'
          $ProcessInfo.WorkingDirectory = $env:SERVER_DIR
          $ProcessInfo.UseShellExecute = $false
          $ProcessInfo.RedirectStandardInput = $true
          $ProcessInfo.RedirectStandardOutput = $true
          $ProcessInfo.RedirectStandardError = $true
          $ProcessInfo.CreateNoWindow = $true

          $ServerProcess = New-Object System.Diagnostics.Process
          $ServerProcess.StartInfo = $ProcessInfo

          if (-not $ServerProcess.Start()) {
            throw "Minecraft process could not start."
          }

          # خواندن خروجی به شکل غیرهمزمان برای جلوگیری از پر شدن بافر
          $StdoutTask = $ServerProcess.StandardOutput.ReadToEndAsync()
          $StderrTask = $ServerProcess.StandardError.ReadToEndAsync()

          Write-Host "Minecraft started. PID: $($ServerProcess.Id)"

          $StopRequested = $false
          $StartTime = Get-Date

          # حداکثر حدود ۵ ساعت و ۴۵ دقیقه برای سرور
          while (-not $ServerProcess.HasExited) {

            if (Test-Path "$env:DESKTOP_DIR\STOP_SERVER.txt") {
              Write-Host "Stop marker detected."
              $StopRequested = $true
              break
            }

            if (((Get-Date) - $StartTime).TotalMinutes -ge 345) {
              Write-Host "Maximum runtime reached. Stopping server."
              $StopRequested = $true
              break
            }

            Start-Sleep -Seconds 5
            $ServerProcess.Refresh()
          }

          if ($StopRequested -and -not $ServerProcess.HasExited) {

            Write-Host "Sending graceful stop command..."

            try {
              $ServerProcess.StandardInput.WriteLine("stop")
              $ServerProcess.StandardInput.Flush()
            }
            catch {
              Write-Warning "Could not send stop command."
            }

            if (-not $ServerProcess.WaitForExit(90000)) {
              Write-Warning "Server did not stop within 90 seconds."
              throw "Server is still running. Backup will be skipped to protect world data."
            }
          }

          if ($ServerProcess.HasExited) {
            Write-Host "Minecraft process exited."
            "SAFE" | Out-File -FilePath $SafeStopFile -Encoding ASCII
          }

          if (-not $ServerProcess.HasExited) {
            throw "Minecraft is still running."
          }

          Write-Host "Minecraft stopped safely."

      # 10. بکاپ‌گیری از کل دسکتاپ
      - name: Create Full Desktop Backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $SafeStopFile = Join-Path $env:RUNNER_TEMP "minecraft-safe-stop.txt"

          if (-not (Test-Path $SafeStopFile)) {
            Write-Warning "Safe server shutdown was not confirmed."
            Write-Warning "Backup skipped to avoid saving an inconsistent world."
            exit 0
          }

          $BackupDir = Join-Path $env:RUNNER_TEMP "DesktopBackup"
          $Zip = Join-Path $env:RUNNER_TEMP "Minecraft-EmergencyBackup.zip"

          Remove-Item $BackupDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $Zip -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "Backing up entire desktop..."

          robocopy $env:DESKTOP_DIR $BackupDir `
            /E /COPY:DAT /DCOPY:DAT /R:2 /W:2 /XJ /SL

          $CopyCode = $LASTEXITCODE

          if ($CopyCode -ge 8) {
            throw "Robocopy failed with exit code $CopyCode."
          }

          Write-Host "Creating ZIP archive..."

          tar -a -c -f $Zip -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP creation failed."
          }

          if (-not (Test-Path $Zip)) {
            throw "Backup ZIP was not created."
          }

          $Size = (Get-Item $Zip).Length

          Write-Host "Backup size: $([math]::Round($Size / 1MB, 2)) MB"

          if ($Size -lt 1MB) {
            throw "Backup ZIP is too small."
          }

          "BACKUP_ZIP=$Zip" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Desktop backup created successfully."

      # 11. انتشار بکاپ در GitHub Releases
      - name: Upload Backup to GitHub Release
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:BACKUP_ZIP -or -not (Test-Path $env:BACKUP_ZIP)) {
            Write-Warning "No backup ZIP available. Upload skipped."
            exit 0
          }

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host "Creating release: $Tag"

          gh release create $Tag `
            $env:BACKUP_ZIP `
            --title "Minecraft Emergency Backup $env:GITHUB_RUN_ID" `
            --notes "Automatic full desktop backup. No SHA256 file is used."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup uploaded successfully."
          Write-Host "Release tag: $Tag"

      # 12. گزارش نهایی
      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "===================================="
          Write-Host "WORKFLOW FINISHED"
          Write-Host "===================================="
          Write-Host "RDP IP: $env:TAILSCALE_IP"
          Write-Host "RDP Port: 3389"
          Write-Host "Username: NvDAdmin"
          Write-Host "Minecraft: $env:SERVER_DIR"
          Write-Host "===================================="
