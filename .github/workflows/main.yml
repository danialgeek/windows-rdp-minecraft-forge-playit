
name: Windows RDP + Minecraft Forge + Playit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      SERVER_DIR: C:\Users\Public\Desktop\Minecraft
      DESKTOP_DIR: C:\Users\Public\Desktop
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Restore latest full Desktop backup
      - name: Restore Latest Desktop Backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $RestoreDir = "$env:RUNNER_TEMP\DesktopRestore"

          New-Item -ItemType Directory -Force -Path $DesktopDir | Out-Null
          New-Item -ItemType Directory -Force -Path $RestoreDir | Out-Null

          $Releases = gh release list --limit 20 --json tagName,isDraft,isPrerelease |
            ConvertFrom-Json

          $Latest = $Releases |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
            Select-Object -First 1

          if (-not $Latest) {
            Write-Host "No previous backup found. First run."
            exit 0
          }

          Write-Host "Restoring release: $($Latest.tagName)"

          gh release download $Latest.tagName `
            --pattern "Minecraft-EmergencyBackup.zip" `
            --dir $RestoreDir

          $Zip = Join-Path $RestoreDir "Minecraft-EmergencyBackup.zip"

          if (-not (Test-Path $Zip)) {
            throw "Backup ZIP was not downloaded."
          }

          tar.exe -xf $Zip -C $DesktopDir

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract Desktop backup."
          }

          Write-Host "Desktop backup restored."

      # 4. Prepare server and find run.bat
      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $DesktopDir = $env:DESKTOP_DIR

          New-Item -ItemType Directory -Force -Path $ServerDir | Out-Null

          Write-Host "Searching for run.bat..."

          $RunFiles = @(
            Get-ChildItem -Path $DesktopDir `
              -Filter "run.bat" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )

          if ($RunFiles.Count -eq 0) {
            Write-Host "Desktop file structure:"
            Get-ChildItem $DesktopDir -Force -Recurse |
              Select-Object -First 150 FullName |
              Format-Table -AutoSize

            throw "run.bat was not found in the restored Desktop."
          }

          $RunFile = $RunFiles |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          $FoundDir = $RunFile.Directory.FullName

          Write-Host "Found: $($RunFile.FullName)"

          if ($FoundDir.TrimEnd('\') -ne $ServerDir.TrimEnd('\')) {
            Write-Host "Copying server files to the required directory..."

            robocopy $FoundDir $ServerDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2

            if ($LASTEXITCODE -ge 8) {
              throw "Robocopy failed: $LASTEXITCODE"
            }
          }

          if (-not (Test-Path "$ServerDir\run.bat")) {
            throw "run.bat is still missing from $ServerDir"
          }

          # Generate RCON password
          $rconPassword = [Convert]::ToBase64String(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(24)
          ).Replace("=","").Replace("+","A").Replace("/","B")

          "RCON_PASSWORD=$rconPassword" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # Configure RCON
          $properties = Join-Path $ServerDir "server.properties"

          if (Test-Path $properties) {
            $content = Get-Content $properties -Raw
          } else {
            $content = ""
          }

          $settings = @{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $rconPassword
          }

          foreach ($key in $settings.Keys) {
            $line = "$key=$($settings[$key])"

            if ($content -match "(?m)^$([regex]::Escape($key))=.*$") {
              $content = [regex]::Replace(
                $content,
                "(?m)^$([regex]::Escape($key))=.*$",
                [System.Text.RegularExpressions.MatchEvaluator]{
                  param($m) $line
                }
              )
            } else {
              $content += "`r`n$line"
            }
          }

          Set-Content -Path $properties -Value $content -Encoding ascii

          # Start server BAT
          @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0Minecraft"
          call run.bat nogui
          pause
          '@ | Set-Content "$DesktopDir\START MINECRAFT SERVER.bat" -Encoding ascii

          # Stop and backup BAT
          @'
          @echo off
          title Stop Minecraft and Backup
          if not exist "%~dp0Minecraft" (
            echo Minecraft folder not found.
            pause
            exit /b
          )
          echo STOP>"%~dp0Minecraft\STOP_SERVER.txt"
          echo Stop request sent.
          echo Wait for GitHub Actions to finish the backup.
          pause
          '@ | Set-Content "$DesktopDir\STOP SERVER + BACKUP.bat" -Encoding ascii

          Remove-Item "$ServerDir\STOP_SERVER.txt" -Force -ErrorAction SilentlyContinue

          Write-Host "Server prepared successfully."
          Write-Host "Server: $ServerDir"
          Write-Host "Desktop: $DesktopDir"

      # 5. Configure RDP
      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $Password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "NvDAdmin" -Password $Password
          } else {
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $Password `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP configured."
          Write-Host "Username: NvDAdmin"

      # 6. Connect Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 7. Show Tailscale address
      - name: Show RDP Address
        shell: pwsh
        run: |
          $IP = tailscale ip -4
          Write-Host "=================================="
          Write-Host "RDP IP: $IP"
          Write-Host "Username: NvDAdmin"
          Write-Host "RDP Port: 3389"
          Write-Host "=================================="

      # 8. Start Playit
      - name: Start Playit
        if: ${{ secrets.PLAYIT_SECRET_KEY != '' }}
        shell: pwsh
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $PlayitPath = "$env:RUNNER_TEMP\playit.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-amd64.exe" `
            -OutFile $PlayitPath

          Start-Process `
            -FilePath $PlayitPath `
            -ArgumentList "--secret", $env:PLAYIT_SECRET_KEY `
            -WorkingDirectory $env:RUNNER_TEMP `
            -WindowStyle Hidden

          Write-Host "Playit agent started."

      # 9. Start Minecraft
      - name: Start Minecraft Forge Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR

          $Log = "$env:RUNNER_TEMP\minecraft-server.log"
          $ErrorLog = "$env:RUNNER_TEMP\minecraft-server-error.log"

          $Process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "run.bat nogui" `
            -WorkingDirectory $ServerDir `
            -RedirectStandardOutput $Log `
            -RedirectStandardError $ErrorLog `
            -PassThru `
            -WindowStyle Hidden

          $Process.Id |
            Out-File "$env:RUNNER_TEMP\minecraft.pid"

          Write-Host "Minecraft process started. PID: $($Process.Id)"

          # Wait for stop marker or server process exit
          $Deadline = (Get-Date).AddMinutes(320)

          while ((Get-Date) -lt $Deadline) {
            if (Test-Path "$ServerDir\STOP_SERVER.txt") {
              Write-Host "Stop request detected."
              break
            }

            if ($Process.HasExited) {
              Write-Host "Minecraft process exited."
              break
            }

            Start-Sleep -Seconds 5
          }

          Write-Host "Minecraft waiting step finished."

      # 10. Stop server safely
      - name: Stop Minecraft Safely
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $ServerDir = $env:SERVER_DIR
          $Password = $env:RCON_PASSWORD

          function Read-RconPacket($Stream) {
            $LengthBytes = New-Object byte[] 4

            if ($Stream.Read($LengthBytes, 0, 4) -ne 4) {
              throw "Could not read RCON packet length."
            }

            $Length = [BitConverter]::ToInt32($LengthBytes, 0)
            $Data = New-Object byte[] $Length
            $Offset = 0

            while ($Offset -lt $Length) {
              $Read = $Stream.Read($Data, $Offset, $Length - $Offset)
              if ($Read -le 0) {
                throw "RCON connection closed."
              }
              $Offset += $Read
            }

            return $Data
          }

          function Send-RconPacket($Stream, [int]$Id, [int]$Type, [string]$Text) {
            $Payload = [Text.Encoding]::ASCII.GetBytes($Text)
            $Body = [System.Collections.Generic.List[byte]]::new()

            $Body.AddRange([BitConverter]::GetBytes($Id))
            $Body.AddRange([BitConverter]::GetBytes($Type))
            $Body.AddRange($Payload)
            $Body.Add(0)
            $Body.Add(0)

            $Length = [BitConverter]::GetBytes($Body.Count)
            $Stream.Write($Length, 0, 4)
            $Stream.Write($Body.ToArray(), 0, $Body.Count)
          }

          try {
            if (-not $Password) {
              throw "RCON password is unavailable."
            }

            $Client = [Net.Sockets.TcpClient]::new()
            $Client.ReceiveTimeout = 5000
            $Client.SendTimeout = 5000
            $Client.Connect("127.0.0.1", 25575)

            $Stream = $Client.GetStream()

            Send-RconPacket $Stream 100 3 $Password
            $AuthResponse = Read-RconPacket $Stream
            $AuthId = [BitConverter]::ToInt32($AuthResponse, 0)

            if ($AuthId -ne 100) {
              throw "RCON authentication failed."
            }

            Send-RconPacket $Stream 101 2 "stop"
            Write-Host "Stop command sent through RCON."

            $Stream.Close()
            $Client.Close()
          }
          catch {
            Write-Host "RCON stop unavailable: $_"
          }

          # Allow Minecraft to save its world
          $Deadline = (Get-Date).AddSeconds(120)

          while ((Get-Date) -lt $Deadline) {
            $Java = Get-CimInstance Win32_Process |
              Where-Object {
                $_.Name -eq "java.exe" -and
                $_.CommandLine -match "forge|forgeserver|user_jvm_args"
              }

            if (-not $Java) {
              Write-Host "Minecraft Java process has exited."
              break
            }

            Start-Sleep -Seconds 5
          }

          # Force stop only if still running after the save window
          $Java = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq "java.exe" -and
              $_.CommandLine -match "forge|forgeserver|user_jvm_args"
            }

          if ($Java) {
            Write-Host "WARNING: Minecraft is still running. Stopping remaining server process."

            foreach ($Process in $Java) {
              Stop-Process -Id $Process.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Server stop stage finished."

      # 11. Backup entire Public Desktop
      - name: Create Full Desktop Backup
        if: always()
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $DesktopDir = $env:DESKTOP_DIR
          $BackupDir = "$env:RUNNER_TEMP\DesktopBackup"
          $ZipPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.zip"
          $HashPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"

          if (-not (Test-Path $DesktopDir)) {
            throw "Desktop directory does not exist."
          }

          Remove-Item $BackupDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "Copying entire Public Desktop..."

          robocopy $DesktopDir $BackupDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2

          if ($LASTEXITCODE -ge 8) {
            throw "Desktop copy failed. Robocopy code: $LASTEXITCODE"
          }

          Write-Host "Creating ZIP archive..."

          Remove-Item $ZipPath -Force -ErrorAction SilentlyContinue

          tar.exe -a -c -f $ZipPath -C $BackupDir .

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP creation failed."
          }

          if (-not (Test-Path $ZipPath)) {
            throw "Backup ZIP was not created."
          }

          $Hash = (Get-FileHash $ZipPath -Algorithm SHA256).Hash
          "$Hash  Minecraft-EmergencyBackup.zip" |
            Set-Content $HashPath -Encoding ascii

          Write-Host "Full Desktop backup created."
          Write-Host "ZIP size: $((Get-Item $ZipPath).Length / 1MB) MB"
          Write-Host "SHA256: $Hash"

      # 12. Upload backup to GitHub Releases
      - name: Upload Backup to GitHub Release
        if: always()
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $ZipPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.zip"
          $HashPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"

          if (-not (Test-Path $ZipPath)) {
            throw "Backup ZIP does not exist. Upload skipped."
          }

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          gh release create $Tag `
            $ZipPath `
            $HashPath `
            --title "Minecraft Desktop Backup $env:GITHUB_RUN_ID" `
            --notes "Automatic full Public Desktop backup."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup uploaded successfully."
          Write-Host "Release tag: $Tag"

      # 13. Final information
      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "=================================="
          Write-Host "Workflow finished."
          Write-Host "Desktop: $env:DESKTOP_DIR"
          Write-Host "Minecraft: $env:SERVER_DIR"
          Write-Host "=================================="
