
name: Windows RDP + Minecraft Forge + Tailscale + ngrok + Full Backup

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: 'C:\Users\NvDAdmin\Desktop'
      PROFILE_DIR: 'C:\Users\NvDAdmin'
      SERVER_DIR: 'C:\Users\NvDAdmin\Desktop\Minecraft'
      BACKUP_PREFIX: minecraft-backup-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # ================================================
      # 1. JAVA 17
      # ================================================

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ================================================
      # 2. CONFIGURE RDP USER
      # ================================================

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          else {
            Set-LocalUser -Name "NvDAdmin" -Password $Password
          }

          Enable-LocalUser -Name "NvDAdmin"

          foreach ($Group in @("Administrators", "Remote Desktop Users")) {
            Add-LocalGroupMember -Group $Group -Member "NvDAdmin" -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $Credential = [PSCredential]::new(".\NvDAdmin", $Password)

          $ProfileProcess = Start-Process `
            -FilePath "$PSHOME\pwsh.exe" `
            -Credential $Credential `
            -LoadUserProfile `
            -ArgumentList '-NoProfile -Command "exit"' `
            -Wait -PassThru -WindowStyle Hidden

          if ($ProfileProcess.ExitCode -ne 0) {
            throw "Could not initialize NvDAdmin profile."
          }

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          Write-Host "RDP user configured."

      # ================================================
      # 3. TAILSCALE
      # ================================================

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          $Install = Start-Process msiexec.exe `
            -ArgumentList "/i `"$Msi`" /qn /norestart" `
            -Wait -PassThru

          if ($Install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Start-Service -Name "Tailscale"

          & $Tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=minecraft-$env:GITHUB_RUN_ID" `
            "--accept-routes"

          $Code = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($Code -ne 0) {
            throw "Tailscale connection failed."
          }

          $IP = & $Tailscale ip -4
          $Code = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($Code -ne 0) {
            throw "Could not retrieve Tailscale IP."
          }

          Write-Host "TAILSCALE RDP IP: $IP"

      # ================================================
      # 4. NGROK TCP RDP
      # ================================================

      - name: Install and start ngrok TCP tunnel
        shell: pwsh
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
            throw "NGROK_AUTHTOKEN secret is missing."
          }

          $NgrokDir = "$env:RUNNER_TEMP\ngrok"
          New-Item -ItemType Directory -Force -Path $NgrokDir | Out-Null

          $Zip = "$env:RUNNER_TEMP\ngrok.zip"

          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile $Zip

          Expand-Archive -Path $Zip -DestinationPath $NgrokDir -Force

          $Ngrok = Join-Path $NgrokDir "ngrok.exe"

          if (!(Test-Path $Ngrok)) {
            throw "ngrok executable was not found."
          }

          $env:NGROK_AUTHTOKEN | & $Ngrok config add-authtoken stdin

          # Verify RDP service is listening before starting the tunnel.
          $Deadline = (Get-Date).AddSeconds(45)
          $RdpReady = $false

          while ((Get-Date) -lt $Deadline) {
            $Test = Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
            if ($Test.TcpTestSucceeded) {
              $RdpReady = $true
              break
            }
            Start-Sleep -Seconds 3
          }

          if (!$RdpReady) {
            throw "RDP port 3389 is not listening."
          }

          $NgrokLog = "$env:RUNNER_TEMP\ngrok.log"
          $NgrokError = "$env:RUNNER_TEMP\ngrok-error.log"

          $Process = Start-Process `
            -FilePath $Ngrok `
            -ArgumentList @("tcp", "3389", "--log=stdout", "--log-level=info") `
            -PassThru `
            -WindowStyle Hidden `
            -RedirectStandardOutput $NgrokLog `
            -RedirectStandardError $NgrokError

          Write-Host "Waiting for ngrok endpoint..."

          $Endpoint = $null
          $Deadline = (Get-Date).AddSeconds(60)

          while ((Get-Date) -lt $Deadline) {
            if ($Process.HasExited) {
              Get-Content $NgrokLog -ErrorAction SilentlyContinue
              Get-Content $NgrokError -ErrorAction SilentlyContinue
              throw "ngrok exited unexpectedly."
            }

            try {
              $Api = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -TimeoutSec 3

              $Tunnel = $Api.tunnels |
                Where-Object { $_.proto -eq "tcp" } |
                Select-Object -First 1

              if ($Tunnel) {
                $Endpoint = $Tunnel.public_url
                break
              }
            }
            catch {}

            Start-Sleep -Seconds 2
          }

          if (!$Endpoint) {
            Get-Content $NgrokLog -ErrorAction SilentlyContinue
            throw "Could not obtain ngrok TCP address."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "NGROK RDP ADDRESS:"
          Write-Host $Endpoint
          Write-Host "USERNAME: NvDAdmin"
          Write-Host "======================================"

          Add-Content $env:GITHUB_ENV "NGROK_RDP_ADDRESS=$Endpoint"

      # ================================================
      # 5. RESTORE LATEST BACKUP
      # ================================================

      - name: Restore latest full backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $Repository = $env:GITHUB_REPOSITORY
          $DownloadDir = "$env:RUNNER_TEMP\BackupDownload"
          $ExtractDir = "$env:RUNNER_TEMP\BackupExtract"

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:PROFILE_DIR | Out-Null

          $Releases = gh release list `
            --repo $Repository `
            --limit 100 `
            --json tagName,isDraft,isPrerelease,createdAt

          $Code = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($Code -ne 0) {
            throw "Could not retrieve releases."
          }

          $Candidates = @(
            $Releases |
              ConvertFrom-Json |
              Where-Object {
                $_.tagName.StartsWith($env:BACKUP_PREFIX) -and
                !$_.isDraft -and !$_.isPrerelease
              } |
              Sort-Object createdAt -Descending
          )

          if ($Candidates.Count -eq 0) {
            Write-Warning "No previous backup found."
          }
          else {
            $Restored = $false

            foreach ($Release in $Candidates) {
              $Tag = $Release.tagName

              Write-Host "Checking backup: $Tag"

              Remove-Item $DownloadDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue

              New-Item -ItemType Directory -Force -Path $DownloadDir | Out-Null
              New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

              gh release download $Tag --repo $Repository --dir $DownloadDir

              $Code = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($Code -ne 0) {
                continue
              }

              $ZipFiles = @(Get-ChildItem $DownloadDir -Filter "*.zip" -File)

              if ($ZipFiles.Count -eq 0) {
                continue
              }

              $ShaFile = Join-Path $DownloadDir "Minecraft-EmergencyBackup.sha256"

              if (!(Test-Path $ShaFile)) {
                Write-Warning "SHA256 manifest missing."
                continue
              }

              $HashMap = @{}

              foreach ($Line in Get-Content $ShaFile) {
                if ($Line -match '^([A-Fa-f0-9]{64})\s+\*?(.+)$') {
                  $HashMap[$Matches[2].Trim()] = $Matches[1].ToUpper()
                }
              }

              $Valid = $true

              foreach ($Zip in $ZipFiles) {
                if (!$HashMap.ContainsKey($Zip.Name)) {
                  $Valid = $false
                  break
                }

                $Actual = (Get-FileHash $Zip.FullName -Algorithm SHA256).Hash

                if ($Actual -ne $HashMap[$Zip.Name]) {
                  $Valid = $false
                  break
                }
              }

              if (!$Valid) {
                Write-Warning "Backup hash validation failed."
                continue
              }

              foreach ($Zip in $ZipFiles) {
                tar.exe -xf $Zip.FullName -C $ExtractDir

                $Code = $LASTEXITCODE
                $global:LASTEXITCODE = 0

                if ($Code -ne 0) {
                  $Valid = $false
                  break
                }
              }

              if (!$Valid) {
                continue
              }

              $Files = @(Get-ChildItem $ExtractDir -Recurse -File)

              if ($Files.Count -eq 0) {
                continue
              }

              $Mappings = @(
                @{ Source = "$ExtractDir\Desktop"; Destination = $env:DESKTOP_DIR },
                @{ Source = "$ExtractDir\AppData\Roaming"; Destination = "$env:PROFILE_DIR\AppData\Roaming" },
                @{ Source = "$ExtractDir\AppData\Local"; Destination = "$env:PROFILE_DIR\AppData\Local" },
                @{ Source = "$ExtractDir\AppData\LocalLow"; Destination = "$env:PROFILE_DIR\AppData\LocalLow" },
                @{ Source = "$ExtractDir\ProgramData"; Destination = "C:\ProgramData" },
                @{ Source = "$ExtractDir\Documents"; Destination = "$env:PROFILE_DIR\Documents" },
                @{ Source = "$ExtractDir\Saved Games"; Destination = "$env:PROFILE_DIR\Saved Games" }
              )

              $HasStructuredBackup = (
                (Test-Path "$ExtractDir\Desktop") -or
                (Test-Path "$ExtractDir\AppData") -or
                (Test-Path "$ExtractDir\ProgramData")
              )

              if ($HasStructuredBackup) {
                foreach ($Mapping in $Mappings) {
                  if (Test-Path $Mapping.Source) {
                    New-Item -ItemType Directory -Force -Path $Mapping.Destination | Out-Null

                    robocopy $Mapping.Source $Mapping.Destination `
                      /E /COPY:DAT /DCOPY:DAT /R:3 /W:2 /XJ

                    $CopyCode = $LASTEXITCODE
                    $global:LASTEXITCODE = 0

                    if ($CopyCode -ge 8) {
                      throw "Restore failed: $($Mapping.Source), code $CopyCode"
                    }
                  }
                }

                if (Test-Path "$ExtractDir\Registry") {
                  $RegistryDestination = Join-Path $env:DESKTOP_DIR "Registry-Backup-For-Manual-Restore"

                  New-Item -ItemType Directory -Force -Path $RegistryDestination | Out-Null

                  robocopy "$ExtractDir\Registry" $RegistryDestination /E /R:3 /W:2

                  $CopyCode = $LASTEXITCODE
                  $global:LASTEXITCODE = 0

                  if ($CopyCode -ge 8) {
                    throw "Registry restore failed."
                  }
                }
              }
              else {
                robocopy $ExtractDir $env:DESKTOP_DIR /E /R:3 /W:2 /XJ

                $CopyCode = $LASTEXITCODE
                $global:LASTEXITCODE = 0

                if ($CopyCode -ge 8) {
                  throw "Legacy restore failed."
                }
              }

              Write-Host "Backup restored: $Tag"
              $Restored = $true
              break
            }

            if (!$Restored) {
              throw "No valid backup could be restored."
            }
          }

      # ================================================
      # 6. CONFIGURE MINECRAFT RCON
      # ================================================

      - name: Configure Minecraft RCON
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $RandomBytes = New-Object byte[] 32
          $Rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          try {
            $Rng.GetBytes($RandomBytes)
          }
          finally {
            $Rng.Dispose()
          }

          $RconPassword = [Convert]::ToHexString($RandomBytes)

          Add-Content -Path $env:GITHUB_ENV -Value "RCON_PASSWORD=$RconPassword"

          New-Item -ItemType Directory -Force -Path $env:SERVER_DIR | Out-Null

          $Properties = Join-Path $env:SERVER_DIR "server.properties"

          if (Test-Path $Properties) {
            $Lines = @(Get-Content $Properties)
          }
          else {
            $Lines = @()
          }

          $Settings = [ordered]@{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $RconPassword
            "broadcast-rcon-to-ops" = "false"
          }

          foreach ($Key in $Settings.Keys) {
            $Found = $false

            for ($i = 0; $i -lt $Lines.Count; $i++) {
              if ($Lines[$i] -match "^$([regex]::Escape($Key))=") {
                $Lines[$i] = "$Key=$($Settings[$Key])"
                $Found = $true
              }
            }

            if (!$Found) {
              $Lines += "$Key=$($Settings[$Key])"
            }
          }

          $Encoding = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllLines(
            $Properties,
            [string[]]$Lines,
            $Encoding
          )

          $Launcher = @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0Minecraft"
          if exist run.bat (
              call run.bat
          ) else if exist run-server.bat (
              call run-server.bat
          ) else (
              echo Minecraft Forge run.bat was not found.
              pause
          )
          pause
          '@

          $LauncherPath = Join-Path $env:DESKTOP_DIR "START MINECRAFT SERVER.bat"

          Set-Content -Path $LauncherPath -Value $Launcher -Encoding ASCII

          Write-Host "Minecraft RCON configured."

      # ================================================
      # 7. KEEP RDP ALIVE
      # ================================================

      - name: Keep RDP runner alive
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "RDP IS READY"
          Write-Host "Tailscale and ngrok are connected."
          Write-Host "Start Minecraft manually from desktop."
          Write-Host "Press Cancel workflow to request backup."
          Write-Host "======================================"

          while ($true) {
            Start-Sleep -Seconds 15
          }

      # ================================================
      # 8. STOP SERVER + FULL BACKUP
      # ================================================

      - name: Stop Minecraft and create full emergency backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $BackupRoot = "$env:RUNNER_TEMP\FullEmergencyBackup"
          $ZipDir = "$env:RUNNER_TEMP\BackupArchives"
          $LogDir = "$env:RUNNER_TEMP\BackupLogs"
          $ShaPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"
          $ReportPath = "$env:RUNNER_TEMP\BackupReport.txt"

          Remove-Item $BackupRoot,$ZipDir,$LogDir,$ShaPath,$ReportPath -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupRoot,$ZipDir,$LogDir | Out-Null

          $script:BackupErrors = [System.Collections.Generic.List[string]]::new()

          function Add-BackupError {
            param([string]$Message)

            $script:BackupErrors.Add($Message)
            Write-Warning $Message
          }

          # ============================================
          # RCON
          # ============================================

          function Read-ExactBytes {
            param(
              [System.IO.Stream]$Stream,
              [int]$Count
            )

            $Buffer = New-Object byte[] $Count
            $Offset = 0

            while ($Offset -lt $Count) {
              $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

              if ($Read -le 0) {
                throw "RCON connection closed."
              }

              $Offset += $Read
            }

            return ,$Buffer
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $BodyBytes = [Text.Encoding]::UTF8.GetBytes($Body)
            $Length = 4 + 4 + $BodyBytes.Length + 2
            $Packet = New-Object byte[] ($Length + 4)

            [BitConverter]::GetBytes([int]$Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes([int]$Id).CopyTo($Packet, 4)
            [BitConverter]::GetBytes([int]$Type).CopyTo($Packet, 8)

            $BodyBytes.CopyTo($Packet, 12)

            $Packet[$Packet.Length - 2] = 0
            $Packet[$Packet.Length - 1] = 0

            $Stream.Write($Packet, 0, $Packet.Length)
          }

          function Read-RconPacket {
            param([System.IO.Stream]$Stream)

            $LengthBytes = Read-ExactBytes $Stream 4
            $Length = [BitConverter]::ToInt32($LengthBytes, 0)

            if ($Length -lt 10 -or $Length -gt 65536) {
              throw "Invalid RCON packet."
            }

            $Data = Read-ExactBytes $Stream $Length

            return [PSCustomObject]@{
              Id = [BitConverter]::ToInt32($Data, 0)
              Type = [BitConverter]::ToInt32($Data, 4)
              Body = [Text.Encoding]::UTF8.GetString($Data, 8, $Length - 10)
            }
          }

          function Test-RconPort {
            $Client = [System.Net.Sockets.TcpClient]::new()

            try {
              $Async = $Client.BeginConnect("127.0.0.1", 25575, $null, $null)

              if (!$Async.AsyncWaitHandle.WaitOne(1000)) {
                return $false
              }

              $Client.EndConnect($Async)
              return $true
            }
            catch {
              return $false
            }
            finally {
              $Client.Close()
            }
          }

          Write-Host "Checking Minecraft server..."

          $PortOpen = Test-RconPort

          if (!$PortOpen) {
            $JavaProcesses = @(Get-Process java,javaw -ErrorAction SilentlyContinue)

            if ($JavaProcesses.Count -gt 0) {
              $Deadline = (Get-Date).AddSeconds(60)

              while (!(Test-RconPort) -and (Get-Date) -lt $Deadline) {
                Start-Sleep -Seconds 2
              }

              $PortOpen = Test-RconPort
            }
          }

          if ($PortOpen) {
            Write-Host "RCON detected."

            $Client = [System.Net.Sockets.TcpClient]::new()
            $Client.ReceiveTimeout = 10000
            $Client.SendTimeout = 10000
            $Stream = $null

            try {
              $Client.Connect("127.0.0.1", 25575)
              $Stream = $Client.GetStream()
              $Stream.ReadTimeout = 10000
              $Stream.WriteTimeout = 10000

              Send-RconPacket $Stream 1 3 $env:RCON_PASSWORD

              $Auth = Read-RconPacket $Stream

              if ($Auth.Id -eq -1 -or $Auth.Id -ne 1) {
                throw "RCON authentication failed."
              }

              Send-RconPacket $Stream 2 2 "stop"

              Write-Host "Stop command sent."
            }
            finally {
              if ($Stream) {
                $Stream.Dispose()
              }

              $Client.Close()
            }

            $Deadline = (Get-Date).AddSeconds(120)

            while ((Test-RconPort) -and (Get-Date) -lt $Deadline) {
              Start-Sleep -Seconds 2
            }

            if (Test-RconPort) {
              Add-BackupError "Minecraft did not stop within 120 seconds."
            }
            else {
              Write-Host "Minecraft stopped."
            }
          }
          else {
            $JavaProcesses = @(Get-Process java,javaw -ErrorAction SilentlyContinue)

            if ($JavaProcesses.Count -gt 0) {
              Add-BackupError "Java is running but RCON is unavailable. World backup may be unsafe."
            }
            else {
              Write-Host "No Minecraft Java process detected."
            }
          }

          # ============================================
          # ROBOCOPY FUNCTION
          # ============================================

          function Copy-BackupFolder {
            param(
              [string]$Source,
              [string]$Destination,
              [string]$Label
            )

            Write-Host ""
            Write-Host "Backing up: $Label"

            if (!(Test-Path $Source)) {
              Write-Warning "Folder does not exist: $Source"
              New-Item -ItemType Directory -Force -Path $Destination | Out-Null
              return
            }

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null

            $SafeLabel = $Label -replace '[^a-zA-Z0-9_-]', '_'
            $LogFile = Join-Path $LogDir "$SafeLabel.log"

            & robocopy.exe $Source $Destination `
              /E /COPY:DAT /DCOPY:DAT `
              /ZB /R:3 /W:2 /XJ `
              /NFL /NDL /NP `
              "/LOG:$LogFile"

            $CopyCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            Write-Host "$Label Robocopy code: $CopyCode"

            if ($CopyCode -ge 8) {
              Add-BackupError "$Label Robocopy failed with code $CopyCode."

              Write-Host "Relevant errors from $Label :"

              Get-Content $LogFile -ErrorAction SilentlyContinue |
                Select-String -Pattern 'ERROR|Access is denied|cannot access|FAILED' |
                Select-Object -First 100 |
                ForEach-Object {
                  Write-Host $_.Line
                }
            }
          }

          # ============================================
          # BACKUP FOLDERS
          # ============================================

          $Mappings = @(
            @{ Source = $env:DESKTOP_DIR; Destination = "$BackupRoot\Desktop"; Label = "Desktop" },
            @{ Source = "$env:PROFILE_DIR\AppData\Roaming"; Destination = "$BackupRoot\AppData\Roaming"; Label = "AppData_Roaming" },
            @{ Source = "$env:PROFILE_DIR\AppData\Local"; Destination = "$BackupRoot\AppData\Local"; Label = "AppData_Local" },
            @{ Source = "$env:PROFILE_DIR\AppData\LocalLow"; Destination = "$BackupRoot\AppData\LocalLow"; Label = "AppData_LocalLow" },
            @{ Source = "C:\ProgramData"; Destination = "$BackupRoot\ProgramData"; Label = "ProgramData" },
            @{ Source = "$env:PROFILE_DIR\Documents"; Destination = "$BackupRoot\Documents"; Label = "Documents" },
            @{ Source = "$env:PROFILE_DIR\Saved Games"; Destination = "$BackupRoot\Saved Games"; Label = "Saved_Games" }
          )

          foreach ($Mapping in $Mappings) {
            try {
              Copy-BackupFolder `
                $Mapping.Source `
                $Mapping.Destination `
                $Mapping.Label
            }
            catch {
              Add-BackupError "$($Mapping.Label): $($_.Exception.Message)"
            }
          }

          # ============================================
          # REGISTRY BACKUP
          # ============================================

          try {
            Write-Host "Exporting registry..."

            $RegistryDir = "$BackupRoot\Registry"
            New-Item -ItemType Directory -Force -Path $RegistryDir | Out-Null

            $Profile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.LocalPath -eq $env:PROFILE_DIR } |
              Select-Object -First 1

            if ($null -eq $Profile) {
              throw "Could not find NvDAdmin profile SID."
            }

            $HiveName = "HKU\$($Profile.SID)"
            $TemporaryHive = $false

            & reg.exe query $HiveName 2>$null

            $Code = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($Code -ne 0) {
              $NtUser = Join-Path $env:PROFILE_DIR "NTUSER.DAT"

              if (!(Test-Path $NtUser)) {
                throw "NTUSER.DAT not found."
              }

              & reg.exe load "HKU\NvDAdminBackupTemp" $NtUser

              $Code = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($Code -ne 0) {
                throw "Could not load user registry hive."
              }

              $HiveName = "HKU\NvDAdminBackupTemp"
              $TemporaryHive = $true
            }

            try {
              & reg.exe export $HiveName "$RegistryDir\NvDAdmin-User-Registry.reg" /y

              $Code = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($Code -ne 0) {
                throw "User registry export failed."
              }
            }
            finally {
              if ($TemporaryHive) {
                & reg.exe unload "HKU\NvDAdminBackupTemp"

                $global:LASTEXITCODE = 0
              }
            }

            & reg.exe export "HKLM\SOFTWARE" "$RegistryDir\HKLM-Software.reg" /y

            $Code = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($Code -ne 0) {
              throw "HKLM registry export failed."
            }

            & reg.exe export "HKLM\SOFTWARE\WOW6432Node" "$RegistryDir\HKLM-WOW6432Node.reg" /y

            $global:LASTEXITCODE = 0

            Write-Host "Registry export completed."
          }
          catch {
            Add-BackupError "Registry: $($_.Exception.Message)"
          }

          # ============================================
          # REPORT
          # ============================================

          $Report = @(
            "Minecraft Emergency Backup Report"
            "Run ID: $env:GITHUB_RUN_ID"
            "Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            "Repository: $env:GITHUB_REPOSITORY"
            ""
            "Errors: $($script:BackupErrors.Count)"
            ""
            $script:BackupErrors
          )

          $Report | Set-Content -Path $ReportPath -Encoding UTF8

          # ============================================
          # COPY LOGS
          # ============================================

          if (Test-Path $LogDir) {
            New-Item -ItemType Directory -Force -Path "$BackupRoot\Logs" | Out-Null

            Get-ChildItem $LogDir -File | ForEach-Object {
              Copy-Item $_.FullName "$BackupRoot\Logs" -Force
            }
          }

          # ============================================
          # FAIL IF ANY BACKUP ERROR
          # ============================================

          if ($script:BackupErrors.Count -gt 0) {
            Write-Host ""
            Write-Host "BACKUP INCOMPLETE"
            Write-Host "Errors: $($script:BackupErrors.Count)"
            throw "Backup incomplete. Release will not be created."
          }

          # ============================================
          # CREATE ZIP FILES
          # ============================================

          $Folders = @(
            "Desktop",
            "AppData\Roaming",
            "AppData\Local",
            "AppData\LocalLow",
            "ProgramData",
            "Documents",
            "Saved Games",
            "Registry",
            "Logs"
          )

          $ArchiveNames = @()

          foreach ($Folder in $Folders) {
            $SafeName = $Folder.Replace("\", "-")
            $ZipName = "$SafeName.zip"
            $ZipPath = Join-Path $ZipDir $ZipName

            Write-Host "Creating $ZipName"

            tar.exe -a -c -f $ZipPath -C $BackupRoot $Folder

            $Code = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($Code -ne 0 -or !(Test-Path $ZipPath)) {
              throw "Archive creation failed: $ZipName"
            }

            $ArchiveNames += $ZipName
          }

          # ============================================
          # SHA256
          # ============================================

          $Manifest = @()

          foreach ($Name in $ArchiveNames) {
            $Path = Join-Path $ZipDir $Name
            $Hash = (Get-FileHash $Path -Algorithm SHA256).Hash

            $Manifest += "$Hash  $Name"
          }

          $Manifest | Set-Content -Path $ShaPath -Encoding ASCII

          # ============================================
          # RELEASE UPLOAD
          # ============================================

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          $Assets = @()

          foreach ($Name in $ArchiveNames) {
            $Assets += Join-Path $ZipDir $Name
          }

          $Assets += $ShaPath

          gh release create $Tag `
            $Assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Minecraft Full Emergency Backup" `
            --notes "Verified full emergency backup."

          $Code = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($Code -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FULL BACKUP UPLOADED SUCCESSFULLY"
          Write-Host "Release: $Tag"
          Write-Host "Archives: $($ArchiveNames.Count)"
          Write-Host "======================================"

      # ================================================
      # 9. UPLOAD DIAGNOSTIC LOGS
      # ================================================

      - name: Upload backup diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-backup-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\BackupLogs\
            ${{ runner.temp }}\BackupReport.txt
            ${{ runner.temp }}\ngrok.log
            ${{ runner.temp }}\ngrok-error.log
          if-no-files-found: warn
          retention-days: 7
