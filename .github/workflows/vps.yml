
name: Windows RDP + Minecraft Forge + Tailscale + Full Emergency Backup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: 'C:\Users\NvDAdmin\Desktop'
      PROFILE_DIR: 'C:\Users\NvDAdmin'
      SERVER_DIR: 'C:\Users\NvDAdmin\Desktop\Minecraft'
      BACKUP_PREFIX: minecraft-backup-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # ================================================
      # 1. JAVA 17
      # ================================================

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ================================================
      # 2. RDP USER
      # ================================================

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $User = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          }
          else {
            Set-LocalUser -Name "NvDAdmin" -Password $Password
          }

          Enable-LocalUser -Name "NvDAdmin"

          foreach ($Group in @("Administrators", "Remote Desktop Users")) {
            Add-LocalGroupMember -Group $Group -Member "NvDAdmin" -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $Credential = [PSCredential]::new(".\NvDAdmin", $Password)

          $ProfileProcess = Start-Process `
            -FilePath "$PSHOME\pwsh.exe" `
            -Credential $Credential `
            -LoadUserProfile `
            -ArgumentList '-NoProfile -Command "exit"' `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          if ($ProfileProcess.ExitCode -ne 0) {
            throw "Could not initialize NvDAdmin profile."
          }

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          Write-Host "RDP user configured."
          Write-Host "Desktop: $env:DESKTOP_DIR"

      # ================================================
      # 3. TAILSCALE
      # ================================================

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          $Install = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$Msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($Install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Start-Service -Name "Tailscale"

          & $Tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=minecraft-$env:GITHUB_RUN_ID" `
            "--accept-routes"

          $TailscaleCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($TailscaleCode -ne 0) {
            throw "Tailscale connection failed."
          }

          $IP = & $Tailscale ip -4
          $IPCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($IPCode -ne 0) {
            throw "Could not retrieve Tailscale IP."
          }

          Write-Host ""
          Write-Host "===================================="
          Write-Host "RDP IP: $IP"
          Write-Host "USERNAME: NvDAdmin"
          Write-Host "===================================="

      # ================================================
      # 4. RESTORE BACKUP
      # ================================================

      - name: Restore latest full backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $Repository = $env:GITHUB_REPOSITORY
          $DownloadDir = "$env:RUNNER_TEMP\BackupDownload"
          $ExtractDir = "$env:RUNNER_TEMP\BackupExtract"

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:PROFILE_DIR | Out-Null

          $Releases = gh release list `
            --repo $Repository `
            --limit 100 `
            --json tagName,isDraft,isPrerelease,createdAt

          $ReleaseCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($ReleaseCode -ne 0) {
            throw "Could not retrieve releases."
          }

          $Candidates = @(
            $Releases |
              ConvertFrom-Json |
              Where-Object {
                $_.tagName.StartsWith($env:BACKUP_PREFIX) `
                -and -not $_.isDraft `
                -and -not $_.isPrerelease
              } |
              Sort-Object createdAt -Descending
          )

          if ($Candidates.Count -eq 0) {
            Write-Warning "No previous backup found."
          }
          else {
            $Restored = $false

            foreach ($Release in $Candidates) {
              $Tag = $Release.tagName

              Write-Host "Checking: $Tag"

              Remove-Item $DownloadDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue

              New-Item -ItemType Directory -Force -Path $DownloadDir | Out-Null
              New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

              gh release download $Tag --repo $Repository --dir $DownloadDir

              $DownloadCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($DownloadCode -ne 0) {
                Write-Warning "Release download failed."
                continue
              }

              $ZipFiles = @(Get-ChildItem $DownloadDir -Filter "*.zip" -File)

              if ($ZipFiles.Count -eq 0) {
                Write-Warning "No ZIP files found."
                continue
              }

              $ShaFile = Join-Path $DownloadDir "Minecraft-EmergencyBackup.sha256"

              if (Test-Path $ShaFile) {
                $HashLines = Get-Content $ShaFile
                $HashMap = @{}

                foreach ($Line in $HashLines) {
                  if ($Line -match '^([A-Fa-f0-9]{64})\s+\*?(.+)$') {
                    $HashMap[$Matches[2].Trim()] = $Matches[1].ToUpper()
                  }
                }

                $HashValid = $true

                foreach ($Zip in $ZipFiles) {
                  if (!$HashMap.ContainsKey($Zip.Name)) {
                    Write-Warning "Missing hash for $($Zip.Name)"
                    $HashValid = $false
                    break
                  }

                  $Actual = (Get-FileHash $Zip.FullName -Algorithm SHA256).Hash

                  if ($Actual -ne $HashMap[$Zip.Name]) {
                    Write-Warning "Hash mismatch: $($Zip.Name)"
                    $HashValid = $false
                    break
                  }
                }

                if (!$HashValid) {
                  continue
                }

                Write-Host "All SHA256 checks passed."
              }
              else {
                Write-Warning "SHA256 manifest missing. Checking legacy backup."

                if ($ZipFiles.Count -ne 1 -or $ZipFiles[0].Name -ne "Minecraft-EmergencyBackup.zip") {
                  continue
                }
              }

              $ExtractOK = $true

              foreach ($Zip in $ZipFiles) {
                Write-Host "Extracting $($Zip.Name)"

                tar.exe -xf $Zip.FullName -C $ExtractDir

                $TarCode = $LASTEXITCODE
                $global:LASTEXITCODE = 0

                if ($TarCode -ne 0) {
                  $ExtractOK = $false
                  break
                }
              }

              if (!$ExtractOK) {
                Write-Warning "Extraction failed."
                continue
              }

              $Files = @(Get-ChildItem $ExtractDir -Recurse -File)

              if ($Files.Count -eq 0) {
                Write-Warning "Backup is empty."
                continue
              }

              if ((Test-Path (Join-Path $ExtractDir "Desktop")) -or
                  (Test-Path (Join-Path $ExtractDir "AppData")) -or
                  (Test-Path (Join-Path $ExtractDir "ProgramData"))) {

                $Mappings = @(
                  @{ Source = "$ExtractDir\Desktop"; Destination = $env:DESKTOP_DIR },
                  @{ Source = "$ExtractDir\AppData\Roaming"; Destination = "$env:PROFILE_DIR\AppData\Roaming" },
                  @{ Source = "$ExtractDir\AppData\Local"; Destination = "$env:PROFILE_DIR\AppData\Local" },
                  @{ Source = "$ExtractDir\AppData\LocalLow"; Destination = "$env:PROFILE_DIR\AppData\LocalLow" },
                  @{ Source = "$ExtractDir\ProgramData"; Destination = "C:\ProgramData" },
                  @{ Source = "$ExtractDir\Documents"; Destination = "$env:PROFILE_DIR\Documents" },
                  @{ Source = "$ExtractDir\Saved Games"; Destination = "$env:PROFILE_DIR\Saved Games" }
                )

                foreach ($Mapping in $Mappings) {
                  if (Test-Path $Mapping.Source) {
                    New-Item -ItemType Directory -Force -Path $Mapping.Destination | Out-Null

                    robocopy $Mapping.Source $Mapping.Destination `
                      /E /COPY:DAT /DCOPY:DAT /R:5 /W:3 /XJ /SL

                    $CopyCode = $LASTEXITCODE
                    $global:LASTEXITCODE = 0

                    if ($CopyCode -ge 8) {
                      throw "Restore failed: $($Mapping.Source). Code: $CopyCode"
                    }
                  }
                }

                $RegistrySource = Join-Path $ExtractDir "Registry"

                if (Test-Path $RegistrySource) {
                  $RegistryDestination = Join-Path $env:DESKTOP_DIR "Registry-Backup-For-Manual-Restore"

                  New-Item -ItemType Directory -Force -Path $RegistryDestination | Out-Null

                  robocopy $RegistrySource $RegistryDestination `
                    /E /COPY:DAT /DCOPY:DAT /R:5 /W:3

                  $CopyCode = $LASTEXITCODE
                  $global:LASTEXITCODE = 0

                  if ($CopyCode -ge 8) {
                    throw "Registry backup restore failed."
                  }
                }
              }
              else {
                robocopy $ExtractDir $env:DESKTOP_DIR `
                  /E /COPY:DAT /DCOPY:DAT /R:5 /W:3 /XJ /SL

                $CopyCode = $LASTEXITCODE
                $global:LASTEXITCODE = 0

                if ($CopyCode -ge 8) {
                  throw "Legacy desktop restore failed."
                }
              }

              Write-Host "Backup restored: $Tag"
              $Restored = $true
              break
            }

            if (!$Restored) {
              throw "No valid backup could be restored."
            }
          }

          $global:LASTEXITCODE = 0

      # ================================================
      # 5. CONFIGURE RCON
      # ================================================

      - name: Configure Minecraft RCON
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $RandomBytes = New-Object byte[] 32
          $Rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          try {
            $Rng.GetBytes($RandomBytes)
          }
          finally {
            $Rng.Dispose()
          }

          $RconPassword = [Convert]::ToHexString($RandomBytes)

          Add-Content -Path $env:GITHUB_ENV -Value "RCON_PASSWORD=$RconPassword"

          New-Item -ItemType Directory -Force -Path $env:SERVER_DIR | Out-Null

          $Properties = Join-Path $env:SERVER_DIR "server.properties"

          if (Test-Path $Properties) {
            $Lines = @(Get-Content $Properties)
          }
          else {
            $Lines = @()
          }

          $Settings = [ordered]@{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $RconPassword
            "broadcast-rcon-to-ops" = "false"
          }

          foreach ($Key in $Settings.Keys) {
            $Found = $false

            for ($i = 0; $i -lt $Lines.Count; $i++) {
              if ($Lines[$i] -match "^$([regex]::Escape($Key))=") {
                $Lines[$i] = "$Key=$($Settings[$Key])"
                $Found = $true
              }
            }

            if (!$Found) {
              $Lines += "$Key=$($Settings[$Key])"
            }
          }

          $Encoding = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllLines(
            $Properties,
            [string[]]$Lines,
            $Encoding
          )

          $Launcher = @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0Minecraft"

          if exist run.bat (
              call run.bat
          ) else if exist run-server.bat (
              call run-server.bat
          ) else (
              echo Minecraft Forge run.bat was not found.
              pause
          )

          pause
          '@

          $LauncherPath = Join-Path $env:DESKTOP_DIR "START MINECRAFT SERVER.bat"

          Set-Content -Path $LauncherPath -Value $Launcher -Encoding ASCII

          Write-Host "RCON configured."
          Write-Host "Manual launcher created."

      # ================================================
      # 6. KEEP RUNNER ALIVE
      # ================================================

      - name: Keep RDP runner alive
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "RDP is ready."
          Write-Host "Start Minecraft manually from desktop."
          Write-Host "Press Cancel workflow to stop and backup."
          Write-Host "======================================"

          while ($true) {
            Start-Sleep -Seconds 15
          }

      # ================================================
      # 7. STOP + FULL BACKUP + RELEASE + SHUTDOWN
      # ================================================

      - name: Stop Minecraft and create full emergency backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          # ============================================
          # RCON FUNCTIONS
          # ============================================

          function Read-ExactBytes {
            param(
              [System.IO.Stream]$Stream,
              [int]$Count
            )

            $Buffer = New-Object byte[] $Count
            $Offset = 0

            while ($Offset -lt $Count) {
              $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

              if ($Read -le 0) {
                throw "RCON connection closed unexpectedly."
              }

              $Offset += $Read
            }

            return ,$Buffer
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $BodyBytes = [Text.Encoding]::UTF8.GetBytes($Body)
            $Length = 4 + 4 + $BodyBytes.Length + 2
            $Packet = New-Object byte[] ($Length + 4)

            [BitConverter]::GetBytes([int]$Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes([int]$Id).CopyTo($Packet, 4)
            [BitConverter]::GetBytes([int]$Type).CopyTo($Packet, 8)

            $BodyBytes.CopyTo($Packet, 12)

            $Packet[$Packet.Length - 2] = 0
            $Packet[$Packet.Length - 1] = 0

            $Stream.Write($Packet, 0, $Packet.Length)
          }

          function Read-RconPacket {
            param([System.IO.Stream]$Stream)

            $LengthBytes = Read-ExactBytes $Stream 4
            $Length = [BitConverter]::ToInt32($LengthBytes, 0)

            if ($Length -lt 10 -or $Length -gt 65536) {
              throw "Invalid RCON packet length."
            }

            $Data = Read-ExactBytes $Stream $Length

            $Id = [BitConverter]::ToInt32($Data, 0)
            $Type = [BitConverter]::ToInt32($Data, 4)

            $Body = [Text.Encoding]::UTF8.GetString(
              $Data,
              8,
              $Length - 10
            )

            return [PSCustomObject]@{
              Id = $Id
              Type = $Type
              Body = $Body
            }
          }

          function Test-RconPort {
            $Client = [System.Net.Sockets.TcpClient]::new()

            try {
              $Async = $Client.BeginConnect("127.0.0.1", 25575, $null, $null)

              if (!$Async.AsyncWaitHandle.WaitOne(1000)) {
                return $false
              }

              $Client.EndConnect($Async)
              return $true
            }
            catch {
              return $false
            }
            finally {
              $Client.Close()
            }
          }

          # ============================================
          # STOP SERVER
          # ============================================

          Write-Host "Checking Minecraft server..."

          $PortOpen = Test-RconPort

          if (!$PortOpen) {
            $JavaProcesses = @(
              Get-Process -Name java,javaw -ErrorAction SilentlyContinue
            )

            if ($JavaProcesses.Count -gt 0) {
              $Deadline = (Get-Date).AddSeconds(60)

              while (!(Test-RconPort) -and (Get-Date) -lt $Deadline) {
                Start-Sleep -Seconds 2
              }

              $PortOpen = Test-RconPort
            }
          }

          if ($PortOpen) {
            Write-Host "RCON detected. Sending stop command..."

            $Client = [System.Net.Sockets.TcpClient]::new()
            $Client.ReceiveTimeout = 10000
            $Client.SendTimeout = 10000
            $Stream = $null

            try {
              $Client.Connect("127.0.0.1", 25575)

              $Stream = $Client.GetStream()
              $Stream.ReadTimeout = 10000
              $Stream.WriteTimeout = 10000

              Send-RconPacket $Stream 1 3 $env:RCON_PASSWORD

              $Auth = Read-RconPacket $Stream

              if ($Auth.Id -eq -1) {
                throw "RCON authentication failed."
              }

              if ($Auth.Id -ne 1) {
                throw "Unexpected RCON authentication response."
              }

              Send-RconPacket $Stream 2 2 "stop"

              $Response = Read-RconPacket $Stream

              Write-Host "RCON stop command sent."
              Write-Host "Response: $($Response.Body)"
            }
            finally {
              if ($Stream) {
                $Stream.Dispose()
              }

              $Client.Close()
            }

            Write-Host "Waiting for Minecraft shutdown..."

            $Deadline = (Get-Date).AddSeconds(120)

            while ((Test-RconPort) -and (Get-Date) -lt $Deadline) {
              Start-Sleep -Seconds 2
            }

            if (Test-RconPort) {
              throw "Minecraft did not stop. Backup aborted."
            }

            Write-Host "Minecraft stopped."
          }
          else {
            $JavaProcesses = @(
              Get-Process -Name java,javaw -ErrorAction SilentlyContinue
            )

            if ($JavaProcesses.Count -gt 0) {
              throw "Java is running but RCON is unavailable. Backup aborted."
            }

            Write-Host "No Java process detected."
          }

          # ============================================
          # PREPARE BACKUP
          # ============================================

          $BackupRoot = "$env:RUNNER_TEMP\FullEmergencyBackup"
          $ZipDir = "$env:RUNNER_TEMP\BackupArchives"
          $LogDir = "$env:RUNNER_TEMP\BackupLogs"
          $ShaPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"

          Remove-Item $BackupRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $ZipDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $LogDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $ShaPath -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $ZipDir | Out-Null
          New-Item -ItemType Directory -Force -Path $LogDir | Out-Null

          # ============================================
          # ROBUST ROBOCOPY HELPER
          # ============================================

          function Copy-BackupFolder {
            param(
              [string]$Source,
              [string]$Destination,
              [string]$Label
            )

            Write-Host ""
            Write-Host "======================================"
            Write-Host "Backing up: $Label"
            Write-Host "Source: $Source"
            Write-Host "======================================"

            if (!(Test-Path $Source)) {
              Write-Warning "Source does not exist: $Source"
              New-Item -ItemType Directory -Force -Path $Destination | Out-Null
              return
            }

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null

            $SafeLabel = $Label -replace '[^a-zA-Z0-9_-]', '_'
            $LogFile = Join-Path $LogDir "$SafeLabel.log"

            robocopy $Source $Destination `
              /E /COPY:DAT /DCOPY:DAT `
              /ZB /R:5 /W:3 /XJ /SL `
              /V /FP /TS `
              /TEE "/LOG:$LogFile"

            $CopyCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            Write-Host ""
            Write-Host "$Label Robocopy code: $CopyCode"
            Write-Host "Log: $LogFile"

            if ($CopyCode -ge 8) {
              Write-Warning "Robocopy reported errors for $Label."

              Write-Host "Failed file details:"

              Get-Content $LogFile |
                Select-String -Pattern 'ERROR|Access is denied|The process cannot access|FAILED|ERROR [0-9]+' |
                ForEach-Object {
                  Write-Host $_.Line
                }

              throw "$Label backup failed. Robocopy code: $CopyCode. Check log: $LogFile"
            }

            Write-Host "$Label backup completed."
          }

          # ============================================
          # DESKTOP
          # ============================================

          Copy-BackupFolder `
            "$env:DESKTOP_DIR" `
            "$BackupRoot\Desktop" `
            "Desktop"

          # ============================================
          # APPLICATION DATA
          # ============================================

          Copy-BackupFolder `
            "$env:PROFILE_DIR\AppData\Roaming" `
            "$BackupRoot\AppData\Roaming" `
            "AppData_Roaming"

          Copy-BackupFolder `
            "$env:PROFILE_DIR\AppData\Local" `
            "$BackupRoot\AppData\Local" `
            "AppData_Local"

          Copy-BackupFolder `
            "$env:PROFILE_DIR\AppData\LocalLow" `
            "$BackupRoot\AppData\LocalLow" `
            "AppData_LocalLow"

          # ============================================
          # PROGRAM DATA
          # ============================================

          Copy-BackupFolder `
            "C:\ProgramData" `
            "$BackupRoot\ProgramData" `
            "ProgramData"

          # ============================================
          # DOCUMENTS
          # ============================================

          Copy-BackupFolder `
            "$env:PROFILE_DIR\Documents" `
            "$BackupRoot\Documents" `
            "Documents"

          # ============================================
          # SAVED GAMES
          # ============================================

          Copy-BackupFolder `
            "$env:PROFILE_DIR\Saved Games" `
            "$BackupRoot\Saved Games" `
            "Saved_Games"

          # ============================================
          # REGISTRY BACKUP
          # ============================================

          Write-Host ""
          Write-Host "Exporting registry..."

          $RegistryDir = "$BackupRoot\Registry"

          New-Item -ItemType Directory -Force -Path $RegistryDir | Out-Null

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object { $_.LocalPath -eq $env:PROFILE_DIR } |
            Select-Object -First 1

          if ($null -eq $Profile) {
            throw "Could not find NvDAdmin Windows profile SID."
          }

          $UserSID = $Profile.SID
          $HiveName = "HKU\$UserSID"
          $TemporaryHive = $false

          & reg.exe query $HiveName 2>$null

          $LoadedCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($LoadedCode -ne 0) {
            $NtUser = Join-Path $env:PROFILE_DIR "NTUSER.DAT"

            if (!(Test-Path $NtUser)) {
              throw "NTUSER.DAT not found."
            }

            & reg.exe load "HKU\NvDAdminBackupTemp" $NtUser

            $LoadCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($LoadCode -ne 0) {
              throw "Could not load user registry hive."
            }

            $HiveName = "HKU\NvDAdminBackupTemp"
            $TemporaryHive = $true
          }

          try {
            & reg.exe export $HiveName "$RegistryDir\NvDAdmin-User-Registry.reg" /y

            $RegCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($RegCode -ne 0) {
              throw "User registry export failed."
            }
          }
          finally {
            if ($TemporaryHive) {
              & reg.exe unload "HKU\NvDAdminBackupTemp"

              $UnloadCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($UnloadCode -ne 0) {
                Write-Warning "Temporary registry hive could not be unloaded."
              }
            }
          }

          & reg.exe export "HKLM\SOFTWARE" "$RegistryDir\HKLM-Software.reg" /y

          $RegCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($RegCode -ne 0) {
            throw "HKLM Software export failed."
          }

          & reg.exe export "HKLM\SOFTWARE\WOW6432Node" "$RegistryDir\HKLM-WOW6432Node.reg" /y

          $RegCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($RegCode -ne 0) {
            Write-Warning "WOW6432Node registry export was unavailable."
          }

          Write-Host "Registry export completed."

          # ============================================
          # ADD LOGS TO BACKUP
          # ============================================

          Copy-BackupFolder `
            "$LogDir" `
            "$BackupRoot\Logs" `
            "Backup_Logs"

          # ============================================
          # CREATE ZIP ARCHIVES
          # ============================================

          Write-Host ""
          Write-Host "Creating ZIP archives..."

          $Folders = @(
            "Desktop",
            "AppData\Roaming",
            "AppData\Local",
            "AppData\LocalLow",
            "ProgramData",
            "Documents",
            "Saved Games",
            "Registry",
            "Logs"
          )

          $ArchiveNames = @()

          foreach ($Folder in $Folders) {
            $SafeName = $Folder.Replace("\", "-")
            $ZipName = "$SafeName.zip"
            $ZipPath = Join-Path $ZipDir $ZipName

            Write-Host "Creating $ZipName"

            tar.exe -a -c -f $ZipPath -C $BackupRoot $Folder

            $TarCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($TarCode -ne 0 -or !(Test-Path $ZipPath)) {
              throw "Archive creation failed: $ZipName"
            }

            $ArchiveNames += $ZipName
          }

          # ============================================
          # SHA256 MANIFEST
          # ============================================

          Write-Host ""
          Write-Host "Calculating SHA256..."

          $Manifest = @()

          foreach ($Name in $ArchiveNames) {
            $Path = Join-Path $ZipDir $Name
            $Hash = (Get-FileHash $Path -Algorithm SHA256).Hash

            $Manifest += "$Hash  $Name"

            Write-Host "$Name : $Hash"
          }

          $Manifest | Set-Content -Path $ShaPath -Encoding ASCII

          # ============================================
          # UPLOAD RELEASE
          # ============================================

          $Repository = $env:GITHUB_REPOSITORY
          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          Write-Host ""
          Write-Host "Uploading backup to GitHub Release..."

          $Assets = @()

          foreach ($Name in $ArchiveNames) {
            $Assets += Join-Path $ZipDir $Name
          }

          $Assets += $ShaPath

          gh release create $Tag `
            $Assets `
            --repo $Repository `
            --title "Minecraft Full Emergency Backup" `
            --notes "Full backup of Desktop, Minecraft, AppData, ProgramData, Documents, Saved Games, Registry and backup logs."

          $ReleaseCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($ReleaseCode -ne 0) {
            throw "GitHub Release upload failed. Runner will not shut down."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FULL BACKUP UPLOADED SUCCESSFULLY"
          Write-Host "Release: $Tag"
          Write-Host "Archives: $($ArchiveNames.Count)"
          Write-Host "======================================"

          # ============================================
          # SHUTDOWN
          # ============================================

          Write-Host "Windows runner will shut down in 30 seconds."

          shutdown.exe /s /t 30 /f

          $ShutdownCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($ShutdownCode -ne 0) {
            throw "Windows shutdown command failed."
          }
