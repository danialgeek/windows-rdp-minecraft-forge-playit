
name: Windows RDP + Minecraft Forge + 3X-UI VLESS REALITY + Bore + Desktop and Browser Backup

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      DESKTOP_DIR: 'C:\Users\NvDAdmin\Desktop'
      PROFILE_DIR: 'C:\Users\NvDAdmin'
      SERVER_DIR: 'C:\Users\NvDAdmin\Desktop\Minecraft'
      BACKUP_PREFIX: minecraft-backup-
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # ================================================
      # 1. JAVA 17
      # ================================================

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for secure 3X-UI database configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ================================================
      # 2. CONFIGURE RDP USER
      # ================================================

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $User = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          else {
            Set-LocalUser -Name "NvDAdmin" -Password $Password
          }

          Enable-LocalUser -Name "NvDAdmin"

          foreach ($Group in @("Administrators", "Remote Desktop Users")) {
            Add-LocalGroupMember -Group $Group -Member "NvDAdmin" -ErrorAction SilentlyContinue
          }

          $TsPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $RdpPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $TsPath -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path $RdpPath -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path $RdpPath -Name "PortNumber" -Value 3389

          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService"

          # Keep the Windows RDP listener enabled. The GitHub-hosted VM still has no
          # dedicated public inbound address; the public connection uses the Bore tunnel.
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Enable-NetFirewallRule

          Get-NetFirewallRule -Name "Tailscale-RDP-IPv4","Tailscale-RDP-IPv6" -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          $Credential = [PSCredential]::new(".\NvDAdmin", $Password)
          $ProfileProcess = Start-Process `
            -FilePath "$PSHOME\pwsh.exe" `
            -Credential $Credential `
            -LoadUserProfile `
            -ArgumentList '-NoProfile -Command "exit"' `
            -Wait -PassThru -WindowStyle Hidden

          if ($ProfileProcess.ExitCode -ne 0) {
            throw "Could not initialize NvDAdmin profile."
          }

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null

          Write-Host "RDP user configured."
          Write-Host "RDP listener enabled. Public RDP access will use the outbound Bore tunnel."

      # ================================================
      # 3. INSTALL BORE TUNNEL CLIENT
      # ================================================

      - name: Install Bore tunnel client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $BoreZip = Join-Path $env:RUNNER_TEMP "bore-v0.6.0-windows.zip"
          $BoreDir = Join-Path $env:RUNNER_TEMP "bore"
          $BoreUrl = "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip"

          Invoke-WebRequest -Uri $BoreUrl -OutFile $BoreZip
          Expand-Archive -Path $BoreZip -DestinationPath $BoreDir -Force

          $BoreExe = Get-ChildItem $BoreDir -Recurse -Filter "bore.exe" -File |
            Select-Object -First 1 -ExpandProperty FullName

          if ([string]::IsNullOrWhiteSpace($BoreExe) -or !(Test-Path $BoreExe)) {
            throw "Bore executable was not found after extraction."
          }

          Add-Content $env:GITHUB_ENV "BORE_EXE=$BoreExe"
          Write-Host "Bore installed: $BoreExe"

      - name: Ensure 7-Zip is installed for encrypted browser backups
        shell: pwsh
        run: |
          $SevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (!(Test-Path $SevenZip)) {
            $Choco = Get-Command choco.exe -ErrorAction SilentlyContinue
            if (!$Choco) { throw "7-Zip is missing and Chocolatey is unavailable." }
            & $Choco.Source install 7zip --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install 7-Zip." }
          }
          if (!(Test-Path $SevenZip)) { throw "7-Zip installation completed but 7z.exe was not found." }
          Write-Host "7-Zip ready: $SevenZip"

      # ================================================
      # 4. RESTORE LATEST BACKUP
      # ================================================

      - name: Restore latest Desktop and browser backup
        shell: pwsh
        env:
          BROWSER_BACKUP_PASSWORD: ${{ secrets.BROWSER_BACKUP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $Repository = $env:GITHUB_REPOSITORY
          $DownloadDir = "$env:RUNNER_TEMP\BackupDownload"
          $ExtractDir = "$env:RUNNER_TEMP\BackupExtract"

          New-Item -ItemType Directory -Force -Path $env:DESKTOP_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:PROFILE_DIR | Out-Null

          $Releases = gh release list `
            --repo $Repository `
            --limit 100 `
            --json tagName,isDraft,isPrerelease,createdAt

          $Code = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($Code -ne 0) {
            throw "Could not retrieve releases."
          }

          $Candidates = @(
            $Releases |
              ConvertFrom-Json |
              Where-Object {
                $_.tagName.StartsWith($env:BACKUP_PREFIX) -and
                !$_.isDraft -and !$_.isPrerelease
              } |
              Sort-Object createdAt -Descending
          )

          if ($Candidates.Count -eq 0) {
            Write-Warning "No previous backup found."
          }
          else {
            $Restored = $false

            foreach ($Release in $Candidates) {
              $Tag = $Release.tagName

              Write-Host "Checking backup: $Tag"

              Remove-Item $DownloadDir -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue

              New-Item -ItemType Directory -Force -Path $DownloadDir | Out-Null
              New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

              gh release download $Tag --repo $Repository --dir $DownloadDir `
                --pattern "Desktop.zip" `
                --pattern "Desktop.zip.part*" `
                --pattern "Browsers-Chrome.zip" `
                --pattern "Browsers-Chrome.zip.part*" `
                --pattern "Browsers-Edge.zip" `
                --pattern "Browsers-Edge.zip.part*" `
                --pattern "Browsers-Chrome.7z" `
                --pattern "Browsers-Chrome.7z.part*" `
                --pattern "Browsers-Edge.7z" `
                --pattern "Browsers-Edge.7z.part*" `
                --pattern "AppData-Local.zip" `
                --pattern "Minecraft-EmergencyBackup.sha256"

              $Code = $LASTEXITCODE
              $global:LASTEXITCODE = 0

              if ($Code -ne 0) {
                continue
              }

              # Reassemble every split ZIP archive. This supports the current
              # Desktop/Chrome/Edge backup and older ProgramData split backups.
              $SplitFiles = @(
                Get-ChildItem $DownloadDir -File | Where-Object {
                  $_.Name -match '^(.+\.(?:zip|7z))\.part[0-9]+$'
                }
              )

              $SplitGroups = @($SplitFiles | Group-Object {
                [regex]::Match($_.Name, '^(.+\.(?:zip|7z))\.part[0-9]+$').Groups[1].Value
              })

              foreach ($Group in $SplitGroups) {
                $CombinedPath = Join-Path $DownloadDir $Group.Name
                if (Test-Path $CombinedPath) {
                  Remove-Item $CombinedPath -Force
                }

                $OutputStream = [System.IO.File]::Open($CombinedPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
                try {
                  foreach ($Part in @($Group.Group | Sort-Object Name)) {
                    $InputStream = [System.IO.File]::OpenRead($Part.FullName)
                    try { $InputStream.CopyTo($OutputStream) }
                    finally { $InputStream.Dispose() }
                  }
                }
                finally { $OutputStream.Dispose() }

                Write-Host "Reassembled $($Group.Name) from $($Group.Count) parts."
              }

              $ArchiveFiles = @(
                Get-ChildItem $DownloadDir -File | Where-Object {
                  $_.Name -in @("Desktop.zip", "Browsers-Chrome.zip", "Browsers-Edge.zip", "Browsers-Chrome.7z", "Browsers-Edge.7z", "AppData-Local.zip")
                }
              )

              if ($ArchiveFiles.Count -eq 0) {
                continue
              }

              $ShaFile = Join-Path $DownloadDir "Minecraft-EmergencyBackup.sha256"

              if (!(Test-Path $ShaFile)) {
                Write-Warning "SHA256 manifest missing."
                continue
              }

              $HashMap = @{}

              foreach ($Line in Get-Content $ShaFile) {
                if ($Line -match '^([A-Fa-f0-9]{64})\s+\*?(.+)$') {
                  $HashMap[$Matches[2].Trim()] = $Matches[1].ToUpper()
                }
              }

              $Valid = $true

              # Verify every original ZIP and every uploaded split part.
              # A reassembled ZIP is validated through its individually
              # verified parts, because the combined file has no manifest entry.
              $AssetsToVerify = @(
                Get-ChildItem $DownloadDir -File | Where-Object {
                  $_.Name -match '^.+\.(?:zip|7z)\.part[0-9]+$' -or
                  ($_.Extension -in @(".zip", ".7z") -and !(Test-Path (Join-Path $DownloadDir ($_.Name + ".part001"))))
                }
              )

              foreach ($Asset in $AssetsToVerify) {
                if (!$HashMap.ContainsKey($Asset.Name)) {
                  $Valid = $false
                  break
                }

                $Actual = (Get-FileHash $Asset.FullName -Algorithm SHA256).Hash

                if ($Actual -ne $HashMap[$Asset.Name]) {
                  $Valid = $false
                  break
                }
              }

              if (!$Valid) {
                Write-Warning "Backup hash validation failed."
                continue
              }

              foreach ($Archive in $ArchiveFiles) {
                if ($Archive.Extension -eq ".7z") {
                  if ([string]::IsNullOrWhiteSpace($env:BROWSER_BACKUP_PASSWORD)) {
                    throw "BROWSER_BACKUP_PASSWORD repository secret is required to decrypt Chrome/Edge backups."
                  }

                  $SevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
                  if (!(Test-Path $SevenZip)) {
                    $SevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
                    if ($SevenZipCommand) { $SevenZip = $SevenZipCommand.Source }
                  }
                  if (!(Test-Path $SevenZip)) { throw "7-Zip executable was not found on this runner." }

                  & $SevenZip x $Archive.FullName "-p$env:BROWSER_BACKUP_PASSWORD" "-o$ExtractDir" -y
                  $Code = $LASTEXITCODE
                  $global:LASTEXITCODE = 0
                }
                else {
                  tar.exe -xf $Archive.FullName -C $ExtractDir
                  $Code = $LASTEXITCODE
                  $global:LASTEXITCODE = 0
                }

                if ($Code -ne 0) {
                  $Valid = $false
                  break
                }
              }

              if (!$Valid) {
                continue
              }

              $Files = @(Get-ChildItem $ExtractDir -Recurse -File)

              if ($Files.Count -eq 0) {
                continue
              }

              # Restore only the requested data: Desktop (including Minecraft)
              # and Chrome/Edge browser profiles. For compatibility with older
              # releases, browser profiles are also located inside old AppData zips.
              $Mappings = @(
                @{ Source = "$ExtractDir\Desktop"; Destination = $env:DESKTOP_DIR },
                @{ Source = "$ExtractDir\Browsers\Chrome\User Data"; Destination = "$env:PROFILE_DIR\AppData\Local\Google\Chrome\User Data" },
                @{ Source = "$ExtractDir\Browsers\Edge\User Data"; Destination = "$env:PROFILE_DIR\AppData\Local\Microsoft\Edge\User Data" },
                @{ Source = "$ExtractDir\AppData\Local\Google\Chrome\User Data"; Destination = "$env:PROFILE_DIR\AppData\Local\Google\Chrome\User Data" },
                @{ Source = "$ExtractDir\AppData\Local\Microsoft\Edge\User Data"; Destination = "$env:PROFILE_DIR\AppData\Local\Microsoft\Edge\User Data" }
              )

              $HasStructuredBackup = (
                (Test-Path "$ExtractDir\Desktop") -or
                (Test-Path "$ExtractDir\Browsers") -or
                (Test-Path "$ExtractDir\AppData\Local\Google\Chrome\User Data") -or
                (Test-Path "$ExtractDir\AppData\Local\Microsoft\Edge\User Data")
              )

              if (!$HasStructuredBackup) {
                Write-Warning "This release does not contain Desktop or Chrome/Edge browser data. Trying the next backup release."
                continue
              }

              foreach ($Mapping in $Mappings) {
                if (Test-Path $Mapping.Source) {
                  New-Item -ItemType Directory -Force -Path $Mapping.Destination | Out-Null

                  robocopy $Mapping.Source $Mapping.Destination `
                    /E /COPY:DAT /DCOPY:DAT /R:3 /W:2 /XJ

                  $CopyCode = $LASTEXITCODE
                  $global:LASTEXITCODE = 0

                  if ($CopyCode -ge 8) {
                    throw "Restore failed: $($Mapping.Source), code $CopyCode"
                  }
                }
              }

              Write-Host "Backup restored: $Tag"
              $Restored = $true
              break
            }

            if (!$Restored) {
              throw "No valid backup could be restored."
            }
          }

      # ================================================
      # 5. CONFIGURE MINECRAFT RCON
      # ================================================

      - name: Configure Minecraft RCON
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $RandomBytes = New-Object byte[] 32
          $Rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          try {
            $Rng.GetBytes($RandomBytes)
          }
          finally {
            $Rng.Dispose()
          }

          $RconPassword = [Convert]::ToHexString($RandomBytes)

          Add-Content -Path $env:GITHUB_ENV -Value "RCON_PASSWORD=$RconPassword"

          New-Item -ItemType Directory -Force -Path $env:SERVER_DIR | Out-Null

          $Properties = Join-Path $env:SERVER_DIR "server.properties"

          if (Test-Path $Properties) {
            $Lines = @(Get-Content $Properties)
          }
          else {
            $Lines = @()
          }

          $Settings = [ordered]@{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $RconPassword
            "broadcast-rcon-to-ops" = "false"
          }

          foreach ($Key in $Settings.Keys) {
            $Found = $false

            for ($i = 0; $i -lt $Lines.Count; $i++) {
              if ($Lines[$i] -match "^$([regex]::Escape($Key))=") {
                $Lines[$i] = "$Key=$($Settings[$Key])"
                $Found = $true
              }
            }

            if (!$Found) {
              $Lines += "$Key=$($Settings[$Key])"
            }
          }

          $Encoding = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllLines(
            $Properties,
            [string[]]$Lines,
            $Encoding
          )

          $Launcher = @'
          @echo off
          title Minecraft Forge Server
          cd /d "%~dp0Minecraft"
          if exist run.bat (
              call run.bat
          ) else if exist run-server.bat (
              call run-server.bat
          ) else (
              echo Minecraft Forge run.bat was not found.
              pause
          )
          pause
          '@

          $LauncherPath = Join-Path $env:DESKTOP_DIR "START MINECRAFT SERVER.bat"

          Set-Content -Path $LauncherPath -Value $Launcher -Encoding ASCII

          Write-Host "Minecraft RCON configured."

      # ================================================
      # 6. INSTALL 3X-UI + XRAY AND START BORE TUNNELS
      # ================================================

      - name: Install 3X-UI Windows, enable panel TLS, and start panel
        shell: pwsh
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $Api = "https://api.github.com/repos/MHSanaei/3x-ui/releases/latest"
          $Headers = @{ "User-Agent" = "GitHub-Actions-3XUI-Setup" }
          $Release = Invoke-RestMethod -Uri $Api -Headers $Headers

          $PackageAsset = $Release.assets |
            Where-Object { $_.name -eq "x-ui-windows-amd64.zip" } |
            Select-Object -First 1
          $HashAsset = $Release.assets |
            Where-Object { $_.name -eq "x-ui-windows-amd64.zip.sha256" } |
            Select-Object -First 1

          if (!$PackageAsset -or !$HashAsset) {
            throw "Latest stable 3X-UI release is missing the Windows package or its SHA256 asset."
          }

          $PackageZip = Join-Path $env:RUNNER_TEMP "x-ui-windows-amd64.zip"
          $HashFile = Join-Path $env:RUNNER_TEMP "x-ui-windows-amd64.zip.sha256"
          $ExtractDir = Join-Path $env:RUNNER_TEMP "3x-ui-package"
          $PanelLog = Join-Path $env:RUNNER_TEMP "3x-ui-panel.log"
          $PanelErr = Join-Path $env:RUNNER_TEMP "3x-ui-panel-error.log"

          Invoke-WebRequest -Uri $PackageAsset.browser_download_url -Headers $Headers -OutFile $PackageZip
          Invoke-WebRequest -Uri $HashAsset.browser_download_url -Headers $Headers -OutFile $HashFile

          $HashText = Get-Content $HashFile -Raw
          if ($HashText -notmatch '(?i)([a-f0-9]{64})') {
            throw "Could not read the 3X-UI SHA256 checksum."
          }
          $ExpectedHash = $Matches[1].ToUpperInvariant()
          $ActualHash = (Get-FileHash $PackageZip -Algorithm SHA256).Hash
          if ($ActualHash -ne $ExpectedHash) {
            throw "3X-UI package SHA256 validation failed."
          }
          Write-Host "3X-UI package SHA256 verified."

          Remove-Item $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null
          Expand-Archive -Path $PackageZip -DestinationPath $ExtractDir -Force

          $PanelExe = Get-ChildItem $ExtractDir -Recurse -Filter "3x-ui.exe" -File |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($PanelExe) -or !(Test-Path $PanelExe)) {
            throw "3x-ui.exe was not found in the official Windows package."
          }

          $PanelDir = Split-Path $PanelExe -Parent
          $XrayExe = Get-ChildItem $PanelDir -Recurse -File |
            Where-Object { $_.Name -match '^xray(-windows-amd64)?\.exe$' } |
            Select-Object -First 1
          if (!$XrayExe) {
            throw "The official 3X-UI package does not contain the Windows Xray executable."
          }

          $BinDir = Split-Path $XrayExe.FullName -Parent
          $DbDir = $PanelDir
          $LogDir = Join-Path $PanelDir "logs"
          New-Item -ItemType Directory -Force -Path $LogDir | Out-Null

          # Create a self-signed TLS certificate for the public Bore hostname.
          # The panel will not be published until the default admin password is changed.
          $CertExpiry = (Get-Date).AddDays(180)
          $Cert = New-SelfSignedCertificate `
            -DnsName "bore.pub" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy Exportable `
            -NotAfter $CertExpiry

          $CertObject = Get-Item "Cert:\CurrentUser\My\$($Cert.Thumbprint)"
          $CertPemPath = Join-Path $PanelDir "panel-bore-pub-cert.pem"
          $KeyPemPath = Join-Path $PanelDir "panel-bore-pub-key.pem"
          $CertPem = $CertObject.ExportCertificatePem()
          $RsaKey = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($CertObject)
          try {
            $PrivateKeyPem = $RsaKey.ExportPkcs8PrivateKeyPem()
          }
          finally {
            $RsaKey.Dispose()
          }

          [System.IO.File]::WriteAllText($CertPemPath, $CertPem, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($KeyPemPath, $PrivateKeyPem, [System.Text.UTF8Encoding]::new($false))
          $CertFingerprint = $CertObject.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256)
          $PublicCertArtifact = Join-Path $env:RUNNER_TEMP "3x-ui-panel-public-cert.pem"
          Copy-Item $CertPemPath $PublicCertArtifact -Force

          # Use an unguessable panel base path and keep the database next to the executable.
          $PathBytes = New-Object byte[] 20
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($PathBytes)
          $PanelBasePath = "/" + [Convert]::ToHexString($PathBytes).ToLowerInvariant() + "/"

          $env:XUI_DB_FOLDER = $DbDir
          $env:XUI_LOG_FOLDER = $LogDir
          $env:XUI_BIN_FOLDER = $BinDir
          $env:XUI_INIT_WEB_BASE_PATH = $PanelBasePath

          Add-Content $env:GITHUB_ENV "PANEL_DIR=$PanelDir"
          Add-Content $env:GITHUB_ENV "PANEL_EXE=$PanelExe"
          Add-Content $env:GITHUB_ENV "PANEL_BASE_PATH=$PanelBasePath"
          Add-Content $env:GITHUB_ENV "PANEL_CERT_PATH=$CertPemPath"
          Add-Content $env:GITHUB_ENV "PANEL_CERT_SHA256=$CertFingerprint"

          # First launch creates the SQLite database and initial admin account.
          $PanelProcess = Start-Process -FilePath $PanelExe `
            -WorkingDirectory $PanelDir `
            -PassThru `
            -RedirectStandardOutput $PanelLog `
            -RedirectStandardError $PanelErr

          $DbPath = Join-Path $DbDir "x-ui.db"
          $Deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $Deadline -and !(Test-Path $DbPath)) {
            if ($PanelProcess.HasExited) {
              Get-Content $PanelLog,$PanelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              throw "3X-UI exited before creating its SQLite database."
            }
            Start-Sleep -Seconds 2
          }
          if (!(Test-Path $DbPath)) {
            throw "3X-UI database was not created at $DbPath."
          }

          Stop-Process -Id $PanelProcess.Id -Force
          Start-Sleep -Seconds 2

          # Set TLS and loopback-only panel binding directly in SQLite.
          $DbScript = Join-Path $env:RUNNER_TEMP "configure_3xui_db.py"
          @'
          import sqlite3, sys
          db_path, cert_path, key_path, base_path = sys.argv[1:5]
          con = sqlite3.connect(db_path)
          try:
              tables = {row[0] for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if "settings" not in tables:
                  raise RuntimeError("3X-UI settings table was not found")
              values = {
                  "webCertFile": cert_path,
                  "webKeyFile": key_path,
                  "webBasePath": base_path,
                  "webListen": "127.0.0.1",
              }
              with con:
                  for key, value in values.items():
                      con.execute("INSERT OR REPLACE INTO settings (`key`, `value`) VALUES (?, ?)", (key, value))
          finally:
              con.close()
          print("3X-UI HTTPS, random base path, and loopback binding configured.")
          '@ | Set-Content -Path $DbScript -Encoding UTF8

          python $DbScript $DbPath $CertPemPath $KeyPemPath $PanelBasePath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not configure 3X-UI TLS settings in SQLite."
          }

          Remove-Item $PanelLog,$PanelErr -Force -ErrorAction SilentlyContinue
          $PanelProcess = Start-Process -FilePath $PanelExe `
            -WorkingDirectory $PanelDir `
            -PassThru `
            -RedirectStandardOutput $PanelLog `
            -RedirectStandardError $PanelErr
          Add-Content $env:GITHUB_ENV "PANEL_PID=$($PanelProcess.Id)"

          $Deadline = (Get-Date).AddMinutes(2)
          $PanelReady = $false
          while ((Get-Date) -lt $Deadline) {
            if ($PanelProcess.HasExited) {
              Get-Content $PanelLog,$PanelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              throw "3X-UI exited before opening its HTTPS panel."
            }
            try {
              $Response = Invoke-WebRequest `
                -Uri "https://127.0.0.1:2053$PanelBasePath" `
                -SkipCertificateCheck `
                -TimeoutSec 5
              if ($Response.StatusCode -ge 200 -and $Response.StatusCode -lt 500) {
                $PanelReady = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 3
            }
          }

          if (!$PanelReady) {
            Get-Content $PanelLog,$PanelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            throw "3X-UI did not serve HTTPS on 127.0.0.1:2053 within two minutes."
          }

          $LocalPanelUrl = "https://127.0.0.1:2053$PanelBasePath"
          $Info = @(
            "3X-UI local panel: $LocalPanelUrl"
            "Initial login: admin / admin"
            "Change the default username and password before public exposure."
            "Public panel TLS certificate SHA256: $CertFingerprint"
          )
          $Info | Set-Content -Path (Join-Path $env:DESKTOP_DIR "3X-UI-ACCESS-INFO.txt") -Encoding UTF8

          Write-Host "3X-UI Windows release: $($Release.tag_name)"
          Write-Host "3X-UI HTTPS is active on loopback only."
          Write-Host "LOCAL PANEL URL: $LocalPanelUrl"
          Write-Host "INITIAL LOGIN: admin / admin"
          Write-Host "CHANGE THE DEFAULT LOGIN BEFORE CREATING ENABLE_3XUI_PUBLIC.txt."
          Write-Host "Self-signed certificate SHA256: $CertFingerprint"

      - name: Start Bore RDP and VLESS REALITY tunnels
        shell: pwsh
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          $ErrorActionPreference = "Stop"
          $Bore = $env:BORE_EXE
          if (!(Test-Path $Bore)) {
            throw "Bore executable is missing."
          }

          function Start-BoreTunnel {
            param(
              [string]$Name,
              [int]$LocalPort,
              [string[]]$ExtraArgs = @()
            )

            $OutLog = Join-Path $env:RUNNER_TEMP "$Name-bore-out.log"
            $ErrLog = Join-Path $env:RUNNER_TEMP "$Name-bore-err.log"
            Remove-Item $OutLog,$ErrLog -Force -ErrorAction SilentlyContinue

            $BoreArgs = @("local", [string]$LocalPort, "--local-host", "127.0.0.1", "--to", "bore.pub") + $ExtraArgs
            $Process = Start-Process -FilePath $Bore `
              -ArgumentList $BoreArgs `
              -PassThru `
              -RedirectStandardOutput $OutLog `
              -RedirectStandardError $ErrLog

            $Deadline = (Get-Date).AddSeconds(60)
            $PublicPort = $null

            while ((Get-Date) -lt $Deadline) {
              if ($Process.HasExited) {
                Get-Content $OutLog,$ErrLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
                throw "Bore tunnel $Name exited unexpectedly."
              }

              $Combined = ((Get-Content $OutLog,$ErrLog -ErrorAction SilentlyContinue) -join "`n")
              if ($Combined -match 'listening at bore\.pub:(\d+)') {
                $PublicPort = [int]$Matches[1]
                break
              }
              Start-Sleep -Seconds 2
            }

            if (!$PublicPort) {
              if (!$Process.HasExited) {
                Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
              }
              Get-Content $OutLog,$ErrLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              throw "Bore tunnel $Name did not report a public port."
            }

            Add-Content $env:GITHUB_ENV "$($Name.ToUpperInvariant())_PID=$($Process.Id)"
            Add-Content $env:GITHUB_ENV "$($Name.ToUpperInvariant())_PORT=$PublicPort"
            Write-Host "$Name PUBLIC ADDRESS: bore.pub:$PublicPort"
            return $PublicPort
          }

          $RdpCheck = Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue
          if (!$RdpCheck.TcpTestSucceeded) {
            throw "Local RDP TCP 3389 is not reachable. Bore cannot expose a service that is not listening."
          }

          $RdpPort = Start-BoreTunnel -Name "BORE_RDP" -LocalPort 3389

          # Reserve the same remote and local port for Xray so the VLESS link
          # does not need a port rewrite. Try several high ports if one is busy.
          $VlessPort = $null
          foreach ($Candidate in @(35443,36443,37443,38443,39443,40443,41443,42443)) {
            try {
              Write-Host "Trying Bore/Xray port $Candidate..."
              $VlessPort = Start-BoreTunnel `
                -Name "BORE_VLESS" `
                -LocalPort $Candidate `
                -ExtraArgs @("--port", [string]$Candidate)
              if ($VlessPort -eq $Candidate) {
                break
              }
              $VlessPort = $null
            }
            catch {
              Write-Warning "Bore port $Candidate is unavailable: $($_.Exception.Message)"
              $VlessPort = $null
            }
          }

          if (!$VlessPort) {
            throw "Could not reserve any VLESS port on bore.pub from the configured candidate list."
          }

          Add-Content $env:GITHUB_ENV "VLESS_LOCAL_PORT=$VlessPort"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PUBLIC RDP: bore.pub:$RdpPort"
          Write-Host "VLESS REALITY PUBLIC ENDPOINT: bore.pub:$VlessPort"
          Write-Host "VLESS LOCAL INBOUND PORT MUST BE: $VlessPort"
          Write-Host "PANEL IS HTTPS + LOOPBACK ONLY UNTIL YOU CHANGE admin/admin AND CREATE ENABLE_3XUI_PUBLIC.txt."
          Write-Host "=========================================="

      - name: Upload public 3X-UI TLS certificate
        uses: actions/upload-artifact@v4
        with:
          name: 3xui-panel-public-certificate-${{ github.run_id }}
          path: ${{ runner.temp }}/3x-ui-panel-public-cert.pem
          if-no-files-found: error
          retention-days: 1

      # ================================================
      # 7. KEEP SERVICES ALIVE AND ENABLE PANEL TUNNEL AFTER PASSWORD CHANGE
      # ================================================

      - name: Keep services alive and enable public panel after password change
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Marker = Join-Path $env:DESKTOP_DIR "ENABLE_3XUI_PUBLIC.txt"
          $Bore = $env:BORE_EXE
          $PanelOut = Join-Path $env:RUNNER_TEMP "3x-ui-panel.log"
          $PanelErr = Join-Path $env:RUNNER_TEMP "3x-ui-panel-error.log"

          function Test-LocalTcpPort {
            param([int]$Port, [int]$TimeoutMilliseconds = 5000)
            $Client = [System.Net.Sockets.TcpClient]::new()
            try {
              $ConnectTask = $Client.ConnectAsync([System.Net.IPAddress]::Loopback, $Port)
              if (!$ConnectTask.Wait($TimeoutMilliseconds)) { return $false }
              return $Client.Connected
            }
            catch { return $false }
            finally { $Client.Dispose() }
          }

          function Assert-Service {
            param([string]$Name, [int]$Port, [int]$TimeoutSeconds = 60)
            $Deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            $Ready = $false
            while ((Get-Date) -lt $Deadline) {
              if (Test-LocalTcpPort -Port $Port -TimeoutMilliseconds 5000) {
                $Ready = $true
                break
              }
              Start-Sleep -Seconds 2
            }

            if (!$Ready) {
              Write-Host "--- $Name is not listening on 127.0.0.1:$Port after $TimeoutSeconds seconds ---"
              if ($Name -eq "3X-UI") {
                Write-Host "--- 3X-UI process snapshot ---"
                Get-Process -Name "3x-ui","x-ui" -ErrorAction SilentlyContinue |
                  Select-Object Id,ProcessName,StartTime,CPU,Responding |
                  Format-Table -AutoSize | Out-String | Write-Host
                Write-Host "--- TCP listeners on the expected port ---"
                Get-NetTCPConnection -LocalPort $Port -State Listen -ErrorAction SilentlyContinue |
                  Format-Table -AutoSize | Out-String | Write-Host
                Write-Host "--- 3X-UI stdout/stderr ---"
                Get-Content $PanelOut,$PanelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              }
              throw "$Name is unavailable on local TCP port $Port after waiting $TimeoutSeconds seconds."
            }
            Write-Host "$Name is accepting local TCP connections on 127.0.0.1:$Port."
          }

          function Assert-BoreProcess {
            param([string]$Name, [string]$ProcessId)
            $Id = 0
            if (![int]::TryParse($ProcessId, [ref]$Id) -or $Id -le 0 -or !(Get-Process -Id $Id -ErrorAction SilentlyContinue)) {
              throw "$Name Bore process is not running (PID: $ProcessId)."
            }
          }

          # Do not trust PANEL_PID here. The Windows 3X-UI launcher may exit
          # after spawning its actual service process. The listening socket is
          # the authoritative health check for the panel.
          Assert-Service -Name "3X-UI" -Port 2053
          Assert-Service -Name "RDP" -Port 3389
          Assert-BoreProcess -Name "RDP" -ProcessId $env:BORE_RDP_PID
          Assert-BoreProcess -Name "VLESS" -ProcessId $env:BORE_VLESS_PID

          Write-Host "=============================================="
          Write-Host "RDP: bore.pub:$env:BORE_RDP_PORT"
          Write-Host "3X-UI local URL: https://127.0.0.1:2053$env:PANEL_BASE_PATH"
          Write-Host "3X-UI first login: admin / admin"
          Write-Host "VLESS REALITY endpoint: bore.pub:$env:VLESS_LOCAL_PORT"
          Write-Host "VLESS inbound local port must be $env:VLESS_LOCAL_PORT."
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "SECURITY SETUP REQUIRED BEFORE PUBLIC PANEL ACCESS:"
          Write-Host "1. Connect to RDP using the public address above."
          Write-Host "2. Open https://127.0.0.1:2053$env:PANEL_BASE_PATH inside the RDP desktop."
          Write-Host "3. Log in with admin / admin and immediately change the panel username and password."
          Write-Host "4. After changing credentials, run this in RDP PowerShell:"
          Write-Host "   New-Item -ItemType File -Path '$env:DESKTOP_DIR\ENABLE_3XUI_PUBLIC.txt' -Force"
          Write-Host "5. The workflow will publish the panel through HTTPS on a separate Bore port."
          Write-Host "Start Minecraft manually from the desktop. Cancel workflow to request emergency backup (best effort)."

          while (!(Test-Path $Marker)) {
            Assert-Service -Name "3X-UI" -Port 2053
            Assert-Service -Name "RDP" -Port 3389
            Assert-BoreProcess -Name "RDP" -ProcessId $env:BORE_RDP_PID
            Assert-BoreProcess -Name "VLESS" -ProcessId $env:BORE_VLESS_PID
            Start-Sleep -Seconds 5
          }

          Write-Host "Password-change marker found. Starting public 3X-UI tunnel..."
          $PanelTunnelOut = Join-Path $env:RUNNER_TEMP "panel-bore-out.log"
          $PanelTunnelErr = Join-Path $env:RUNNER_TEMP "panel-bore-err.log"
          Remove-Item $PanelTunnelOut,$PanelTunnelErr -Force -ErrorAction SilentlyContinue

          $PanelTunnel = Start-Process -FilePath $Bore `
            -ArgumentList @("local", "2053", "--local-host", "127.0.0.1", "--to", "bore.pub") `
            -PassThru `
            -RedirectStandardOutput $PanelTunnelOut `
            -RedirectStandardError $PanelTunnelErr

          Add-Content $env:GITHUB_ENV "BORE_PANEL_PID=$($PanelTunnel.Id)"

          $Deadline = (Get-Date).AddSeconds(60)
          $PanelPublicPort = $null
          while ((Get-Date) -lt $Deadline) {
            if ($PanelTunnel.HasExited) {
              Get-Content $PanelTunnelOut,$PanelTunnelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              throw "Public 3X-UI Bore tunnel exited unexpectedly."
            }
            $Combined = ((Get-Content $PanelTunnelOut,$PanelTunnelErr -ErrorAction SilentlyContinue) -join "`n")
            if ($Combined -match 'listening at bore\.pub:(\d+)') {
              $PanelPublicPort = [int]$Matches[1]
              break
            }
            Start-Sleep -Seconds 2
          }

          if (!$PanelPublicPort) {
            Get-Content $PanelTunnelOut,$PanelTunnelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            throw "Public 3X-UI tunnel did not report a port."
          }

          Write-Host "=============================================="
          Write-Host "PUBLIC 3X-UI PANEL: https://bore.pub:$PanelPublicPort$env:PANEL_BASE_PATH"
          Write-Host "VLESS REALITY ENDPOINT: bore.pub:$env:VLESS_LOCAL_PORT"
          Write-Host "=============================================="

          while ($true) {
            Assert-Service -Name "3X-UI" -Port 2053
            Assert-Service -Name "RDP" -Port 3389
            Assert-BoreProcess -Name "RDP" -ProcessId $env:BORE_RDP_PID
            Assert-BoreProcess -Name "VLESS" -ProcessId $env:BORE_VLESS_PID
            if ($PanelTunnel.HasExited) {
              Get-Content $PanelTunnelOut,$PanelTunnelErr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
              throw "Public 3X-UI Bore tunnel process stopped."
            }
            Start-Sleep -Seconds 15
          }

      # ================================================
      # 8. STOP SERVER + FULL BACKUP
      # ================================================

      - name: Stop Minecraft and back up Desktop, Chrome and Edge
        if: always()
        shell: pwsh
        env:
          BROWSER_BACKUP_PASSWORD: ${{ secrets.BROWSER_BACKUP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $BackupRoot = "$env:RUNNER_TEMP\FullEmergencyBackup"
          $ZipDir = "$env:RUNNER_TEMP\BackupArchives"
          $LogDir = "$env:RUNNER_TEMP\BackupLogs"
          $ShaPath = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"
          $ReportPath = "$env:RUNNER_TEMP\BackupReport.txt"

          if ([string]::IsNullOrWhiteSpace($env:BROWSER_BACKUP_PASSWORD)) {
            throw "BROWSER_BACKUP_PASSWORD repository secret is missing. Add it before backing up browser profiles to a public Release."
          }
          Write-Host "::add-mask::$env:BROWSER_BACKUP_PASSWORD"

          Remove-Item $BackupRoot,$ZipDir,$LogDir,$ShaPath,$ReportPath -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupRoot,$ZipDir,$LogDir | Out-Null

          $script:BackupErrors = [System.Collections.Generic.List[string]]::new()

          function Add-BackupError {
            param([string]$Message)

            $script:BackupErrors.Add($Message)
            Write-Warning $Message
          }

          # ============================================
          # RCON FUNCTIONS
          # ============================================

          function Read-ExactBytes {
            param(
              [System.IO.Stream]$Stream,
              [int]$Count
            )

            $Buffer = New-Object byte[] $Count
            $Offset = 0

            while ($Offset -lt $Count) {
              $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

              if ($Read -le 0) {
                throw "RCON connection closed."
              }

              $Offset += $Read
            }

            return ,$Buffer
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$Id,
              [int]$Type,
              [string]$Body
            )

            $BodyBytes = [Text.Encoding]::UTF8.GetBytes($Body)
            $Length = 4 + 4 + $BodyBytes.Length + 2
            $Packet = New-Object byte[] ($Length + 4)

            [BitConverter]::GetBytes([int]$Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes([int]$Id).CopyTo($Packet, 4)
            [BitConverter]::GetBytes([int]$Type).CopyTo($Packet, 8)

            $BodyBytes.CopyTo($Packet, 12)

            $Packet[$Packet.Length - 2] = 0
            $Packet[$Packet.Length - 1] = 0

            $Stream.Write($Packet, 0, $Packet.Length)
          }

          function Read-RconPacket {
            param([System.IO.Stream]$Stream)

            $LengthBytes = Read-ExactBytes $Stream 4
            $Length = [BitConverter]::ToInt32($LengthBytes, 0)

            if ($Length -lt 10 -or $Length -gt 65536) {
              throw "Invalid RCON packet."
            }

            $Data = Read-ExactBytes $Stream $Length

            return [PSCustomObject]@{
              Id = [BitConverter]::ToInt32($Data, 0)
              Type = [BitConverter]::ToInt32($Data, 4)
              Body = [Text.Encoding]::UTF8.GetString($Data, 8, $Length - 10)
            }
          }

          function Test-RconPort {
            $Client = [System.Net.Sockets.TcpClient]::new()

            try {
              $Async = $Client.BeginConnect("127.0.0.1", 25575, $null, $null)

              if (!$Async.AsyncWaitHandle.WaitOne(1000)) {
                return $false
              }

              $Client.EndConnect($Async)
              return $true
            }
            catch {
              return $false
            }
            finally {
              $Client.Close()
            }
          }

          # ============================================
          # STOP MINECRAFT
          # ============================================

          try {
            Write-Host "Checking Minecraft server..."

            $PortOpen = Test-RconPort

            if (!$PortOpen) {
              $JavaProcesses = @(Get-Process java,javaw -ErrorAction SilentlyContinue)

              if ($JavaProcesses.Count -gt 0) {
                $Deadline = (Get-Date).AddSeconds(60)

                while (!(Test-RconPort) -and (Get-Date) -lt $Deadline) {
                  Start-Sleep -Seconds 2
                }

                $PortOpen = Test-RconPort
              }
            }

            if ($PortOpen) {
              Write-Host "RCON detected."

              $Client = [System.Net.Sockets.TcpClient]::new()
              $Client.ReceiveTimeout = 10000
              $Client.SendTimeout = 10000
              $Stream = $null

              try {
                $Client.Connect("127.0.0.1", 25575)
                $Stream = $Client.GetStream()
                $Stream.ReadTimeout = 10000
                $Stream.WriteTimeout = 10000

                Send-RconPacket $Stream 1 3 $env:RCON_PASSWORD

                $Auth = Read-RconPacket $Stream

                if ($Auth.Id -eq -1 -or $Auth.Id -ne 1) {
                  throw "RCON authentication failed."
                }

                Send-RconPacket $Stream 2 2 "stop"

                Write-Host "Stop command sent."
              }
              finally {
                if ($Stream) {
                  $Stream.Dispose()
                }

                $Client.Close()
              }

              $Deadline = (Get-Date).AddSeconds(120)

              while ((Test-RconPort) -and (Get-Date) -lt $Deadline) {
                Start-Sleep -Seconds 2
              }

              if (Test-RconPort) {
                Add-BackupError "Minecraft did not stop within 120 seconds."
              }
              else {
                Write-Host "Minecraft stopped."
              }
            }
            else {
              $JavaProcesses = @(Get-Process java,javaw -ErrorAction SilentlyContinue)

              if ($JavaProcesses.Count -gt 0) {
                Add-BackupError "Java is running but RCON is unavailable. World backup may be unsafe."
              }
              else {
                Write-Host "No Minecraft Java process detected."
              }
            }
          }
          catch {
            Add-BackupError "Minecraft stop error: $($_.Exception.Message)"
          }

          # ============================================
          # ROBOCOPY FUNCTION
          # ============================================

          function Copy-BackupFolder {
            param(
              [string]$Source,
              [string]$Destination,
              [string]$Label,
              [string[]]$ExcludeDirs = @()
            )

            Write-Host ""
            Write-Host "Backing up: $Label"

            if (!(Test-Path $Source)) {
              Write-Warning "Folder does not exist: $Source"
              Add-BackupError "$Label source folder does not exist. No data was available to back up."
              New-Item -ItemType Directory -Force -Path $Destination | Out-Null
              return
            }

            New-Item -ItemType Directory -Force -Path $Destination | Out-Null

            $SafeLabel = $Label -replace '[^a-zA-Z0-9_-]', '_'
            $LogFile = Join-Path $LogDir "$SafeLabel.log"

            $RobocopyArgs = @(
              $Source, $Destination,
              "/E", "/COPY:DAT", "/DCOPY:DAT",
              "/ZB", "/R:3", "/W:2", "/XJ",
              "/LOG:$LogFile"
            )

            if ($ExcludeDirs.Count -gt 0) {
              $RobocopyArgs += "/XD"
              $RobocopyArgs += $ExcludeDirs
            }

            & robocopy.exe @RobocopyArgs

            $CopyCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            Write-Host "$Label Robocopy code: $CopyCode"

            if ($CopyCode -ge 8) {
              Add-BackupError "$Label Robocopy failed with code $CopyCode."

              Write-Host "Relevant errors from $Label :"

              Get-Content $LogFile -ErrorAction SilentlyContinue |
                Select-String -Pattern 'ERROR|Access is denied|cannot access|FAILED' |
                Select-Object -First 100 |
                ForEach-Object {
                  Write-Host $_.Line
                }
            }
          }

          # ============================================
          # CLOSE BROWSERS BEFORE COPYING THEIR PROFILE DATABASES
          # ============================================

          foreach ($ProcessName in @("chrome", "msedge")) {
            $BrowserProcesses = @(Get-Process -Name $ProcessName -ErrorAction SilentlyContinue)
            if ($BrowserProcesses.Count -gt 0) {
              Write-Host "Closing $ProcessName before browser profile backup..."
              foreach ($BrowserProcess in $BrowserProcesses) {
                try { [void]$BrowserProcess.CloseMainWindow() } catch { }
              }
              Start-Sleep -Seconds 8
              Get-Process -Name $ProcessName -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }

          # ============================================
          # BACKUP ONLY DESKTOP + CHROME + EDGE
          # ============================================

          $BrowserExcludedDirs = @(
            "Cache", "Code Cache", "GPUCache", "GrShaderCache",
            "ShaderCache", "DawnCache", "CacheStorage", "Crashpad",
            "BrowserMetrics"
          )

          $Mappings = @(
            @{ Source = $env:DESKTOP_DIR; Destination = "$BackupRoot\Desktop"; Label = "Desktop"; ExcludeDirs = @() },
            @{ Source = "$env:PROFILE_DIR\AppData\Local\Google\Chrome\User Data"; Destination = "$BackupRoot\Browsers\Chrome\User Data"; Label = "Chrome_Browser_Data"; ExcludeDirs = $BrowserExcludedDirs },
            @{ Source = "$env:PROFILE_DIR\AppData\Local\Microsoft\Edge\User Data"; Destination = "$BackupRoot\Browsers\Edge\User Data"; Label = "Edge_Browser_Data"; ExcludeDirs = $BrowserExcludedDirs }
          )

          foreach ($Mapping in $Mappings) {
            try {
              Copy-BackupFolder `
                $Mapping.Source `
                $Mapping.Destination `
                $Mapping.Label `
                $Mapping.ExcludeDirs
            }
            catch {
              Add-BackupError "$($Mapping.Label): $($_.Exception.Message)"
            }
          }

          # No full AppData, ProgramData, Documents, Saved Games or Registry
          # export is performed. Only the requested user data is archived.

          # ============================================
          # REPORT
          # ============================================

          $Report = @(
            "Minecraft Desktop + Chrome + Edge Backup Report"
            "Run ID: $env:GITHUB_RUN_ID"
            "Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            "Repository: $env:GITHUB_REPOSITORY"
            "Included: Desktop (including Minecraft), Chrome User Data, Edge User Data"
            "Security: Chrome/Edge archives are AES-256 encrypted before public upload."
            "Excluded: full AppData, ProgramData, Documents, Saved Games, Registry and browser cache folders"
            "Restore requirement: BROWSER_BACKUP_PASSWORD GitHub Actions secret must match the password used for encryption."
            ""
            "Errors: $($script:BackupErrors.Count)"
            ""
            $script:BackupErrors
          )

          $Report | Set-Content -Path $ReportPath -Encoding UTF8

          # Keep the report inside the backup payload so it is released
          # together with the successfully copied files.
          Copy-Item $ReportPath (Join-Path $BackupRoot "BackupReport.txt") -Force

          # ============================================
          # COPY LOGS
          # ============================================

          if (Test-Path $LogDir) {
            New-Item -ItemType Directory -Force -Path "$BackupRoot\Logs" | Out-Null

            Get-ChildItem $LogDir -File | ForEach-Object {
              Copy-Item $_.FullName "$BackupRoot\Logs" -Force
            }
          }

          # ============================================
          # KEEP SUCCESSFUL DATA EVEN IF SOME FILES FAILED
          # ============================================

          if ($script:BackupErrors.Count -gt 0) {
            Write-Warning "Some files or folders could not be copied. Successfully copied data will still be archived and uploaded."
            Write-Warning "Backup errors recorded: $($script:BackupErrors.Count)"
          }
          else {
            Write-Host "All requested backup operations completed without reported errors."
          }

          # ============================================
          # CREATE ZIP FILES
          # ============================================

          $Folders = @(
            "Desktop",
            "Logs",
            "BackupReport.txt"
          )

          $ArchiveNames = @()

          foreach ($Folder in $Folders) {
            $SafeName = $Folder.Replace("\", "-")
            $ZipName = "$SafeName.zip"
            $ZipPath = Join-Path $ZipDir $ZipName

            Write-Host "Creating $ZipName"

            tar.exe -a -c -f $ZipPath -C $BackupRoot $Folder

            $Code = $LASTEXITCODE
            $global:LASTEXITCODE = 0

            if ($Code -ne 0 -or !(Test-Path $ZipPath)) {
              throw "Archive creation failed: $ZipName"
            }

            # GitHub Releases rejects individual assets >= 2 GiB. Split any
            # oversized archive into 1.5 GiB chunks, preserving exact ZIP bytes.
            $ChunkSize = [int64](1536 * 1024 * 1024)
            $ArchiveLength = (Get-Item $ZipPath).Length

            if ($ArchiveLength -gt $ChunkSize) {
              Write-Host "$ZipName is $ArchiveLength bytes. Splitting into 1.5 GiB parts."
              $TemporaryArchive = Join-Path $ZipDir ($ZipName + ".source.tmp")
              Move-Item $ZipPath $TemporaryArchive -Force
              $InputStream = [System.IO.File]::OpenRead($TemporaryArchive)
              try {
                $PartNumber = 0
                $Buffer = New-Object byte[] (8MB)
                while ($true) {
                  $PartNumber++
                  $PartName = "$ZipName.part{0:D3}" -f $PartNumber
                  $PartPath = Join-Path $ZipDir $PartName
                  $PartStream = [System.IO.File]::Open($PartPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
                  $Remaining = $ChunkSize
                  try {
                    while ($Remaining -gt 0) {
                      $Wanted = [int][Math]::Min($Buffer.Length, $Remaining)
                      $Read = $InputStream.Read($Buffer, 0, $Wanted)
                      if ($Read -le 0) { break }
                      $PartStream.Write($Buffer, 0, $Read)
                      $Remaining -= $Read
                    }
                  }
                  finally { $PartStream.Dispose() }

                  if ((Get-Item $PartPath).Length -eq 0) {
                    Remove-Item $PartPath -Force
                    break
                  }

                  $ArchiveNames += $PartName
                  if ($InputStream.Position -ge $InputStream.Length) { break }
                }
              }
              finally { $InputStream.Dispose() }
              Remove-Item $TemporaryArchive -Force
            }
            else {
              $ArchiveNames += $ZipName
            }
          }

          # ============================================
          # ENCRYPT CHROME + EDGE PROFILES FOR PUBLIC RELEASE
          # ============================================

          $SevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (!(Test-Path $SevenZip)) {
            $SevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue
            if ($SevenZipCommand) { $SevenZip = $SevenZipCommand.Source }
          }
          if (!(Test-Path $SevenZip)) {
            throw "7-Zip executable was not found. Cannot safely encrypt browser profiles."
          }

          foreach ($Browser in @("Chrome", "Edge")) {
            $RelativeFolder = "Browsers\$Browser"
            $SourceFolder = Join-Path $BackupRoot $RelativeFolder
            if (!(Test-Path $SourceFolder)) {
              Write-Warning "$Browser profile folder was not present. Skipping encrypted archive."
              continue
            }

            $ArchivePath = Join-Path $ZipDir "Browsers-$Browser.7z"
            Write-Host "Creating AES-256 encrypted archive: Browsers-$Browser.7z"
            Push-Location $BackupRoot
            try {
              & $SevenZip a -t7z -mx=5 -mhe=on "-p$env:BROWSER_BACKUP_PASSWORD" $ArchivePath $RelativeFolder
              $SevenZipCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0
            }
            finally { Pop-Location }

            if ($SevenZipCode -ne 0 -or !(Test-Path $ArchivePath)) {
              throw "Could not create encrypted $Browser browser archive."
            }

            # Split encrypted archives too, so no GitHub Release asset reaches 2 GiB.
            $ChunkSize = [int64](1536 * 1024 * 1024)
            if ((Get-Item $ArchivePath).Length -gt $ChunkSize) {
              $TemporaryArchive = Join-Path $ZipDir ("Browsers-$Browser.7z.source.tmp")
              Move-Item $ArchivePath $TemporaryArchive -Force
              $InputStream = [System.IO.File]::OpenRead($TemporaryArchive)
              try {
                $PartNumber = 0
                $Buffer = New-Object byte[] (8MB)
                while ($true) {
                  $PartNumber++
                  $PartName = "Browsers-$Browser.7z.part{0:D3}" -f $PartNumber
                  $PartPath = Join-Path $ZipDir $PartName
                  $PartStream = [System.IO.File]::Open($PartPath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
                  $Remaining = $ChunkSize
                  try {
                    while ($Remaining -gt 0) {
                      $Wanted = [int][Math]::Min($Buffer.Length, $Remaining)
                      $Read = $InputStream.Read($Buffer, 0, $Wanted)
                      if ($Read -le 0) { break }
                      $PartStream.Write($Buffer, 0, $Read)
                      $Remaining -= $Read
                    }
                  }
                  finally { $PartStream.Dispose() }
                  if ((Get-Item $PartPath).Length -eq 0) { Remove-Item $PartPath -Force; break }
                  $ArchiveNames += $PartName
                  if ($InputStream.Position -ge $InputStream.Length) { break }
                }
              }
              finally { $InputStream.Dispose() }
              Remove-Item $TemporaryArchive -Force
            }
            else {
              $ArchiveNames += "Browsers-$Browser.7z"
            }
          }

          # ============================================
          # SHA256
          # ============================================

          $Manifest = @()

          foreach ($Name in $ArchiveNames) {
            $Path = Join-Path $ZipDir $Name
            $Hash = (Get-FileHash $Path -Algorithm SHA256).Hash

            $Manifest += "$Hash  $Name"
          }

          $Manifest | Set-Content -Path $ShaPath -Encoding ASCII

          # ============================================
          # RELEASE UPLOAD
          # ============================================

          $Tag = "minecraft-backup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          $Assets = @()

          foreach ($Name in $ArchiveNames) {
            $Assets += Join-Path $ZipDir $Name
          }

          $Assets += $ShaPath

          if ($script:BackupErrors.Count -gt 0) {
            $ReleaseTitle = "Minecraft Emergency Backup (Partial)"
            $ReleaseNotes = @(
              "Emergency backup uploaded with partial copy errors."
              "Successfully copied Desktop data is included in ZIP assets; Chrome/Edge profiles are included in AES-256 encrypted 7z assets."
              "Some source files could not be copied. See BackupReport.txt.zip and Logs.zip for details."
              "Backup error entries: $($script:BackupErrors.Count)"
            ) -join "`n"
          }
          else {
            $ReleaseTitle = "Minecraft Desktop + Chrome + Edge Backup"
            $ReleaseNotes = "Desktop (including Minecraft) and Chrome/Edge browser profiles backed up. Browser profiles are AES-256 encrypted 7z assets. Cache folders are excluded. See BackupReport.txt.zip for the report."
          }

          gh release create $Tag `
            $Assets `
            --repo $env:GITHUB_REPOSITORY `
            --title $ReleaseTitle `
            --notes $ReleaseNotes

          $Code = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($Code -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BACKUP ASSETS UPLOADED SUCCESSFULLY"
          Write-Host "Release: $Tag"
          Write-Host "Archives: $($ArchiveNames.Count)"
          Write-Host "Backup errors: $($script:BackupErrors.Count)"
          Write-Host "======================================"

      # ================================================
      # 9. UPLOAD DIAGNOSTIC LOGS
      # ================================================

      - name: Upload backup diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-backup-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/BackupLogs/**
            ${{ runner.temp }}/BackupReport.txt
          if-no-files-found: warn
          retention-days: 7
