
name: Windows RDP + Minecraft Forge + Playit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      SERVER_DIR: C:\Users\Public\Desktop\Minecraft
      RDP_USER: NvDAdmin

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restore latest backup
      - name: Restore Latest Minecraft Backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $ExtractDir = "$env:RUNNER_TEMP\MinecraftRestore"

          New-Item -ItemType Directory -Force -Path $ServerDir | Out-Null

          $Tag = gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 1 `
            --json tagName `
            --jq '.[0].tagName // empty'

          if ([string]::IsNullOrWhiteSpace($Tag)) {
              Write-Host "No previous backup found."
          }
          else {
              Write-Host "Latest backup: $Tag"

              gh release download $Tag `
                --repo $env:GITHUB_REPOSITORY `
                --pattern "Minecraft-backup.zip" `
                --dir $env:RUNNER_TEMP

              if ($LASTEXITCODE -ne 0) {
                  throw "Backup download failed."
              }

              $Zip = "$env:RUNNER_TEMP\Minecraft-backup.zip"

              if (!(Test-Path $Zip)) {
                  throw "Backup ZIP was not found."
              }

              New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

              Expand-Archive -Path $Zip -DestinationPath $ExtractDir -Force

              $SourceDir = $ExtractDir
              $MinecraftFolder = Join-Path $ExtractDir "Minecraft"

              if (Test-Path $MinecraftFolder) {
                  $SourceDir = $MinecraftFolder
              }

              robocopy $SourceDir $ServerDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2

              if ($LASTEXITCODE -ge 8) {
                  throw "Backup restore failed."
              }

              Write-Host "Backup restored successfully."
          }

      # Prepare server
      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $Desktop = "C:\Users\Public\Desktop"

          New-Item -ItemType Directory -Force -Path $ServerDir | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\RDP-Persistent" | Out-Null

          # Java RAM
          $JvmFile = Join-Path $ServerDir "user_jvm_args.txt"
          $JvmLines = @()

          if (Test-Path $JvmFile) {
              $JvmLines = Get-Content $JvmFile |
                Where-Object {
                  $_ -notmatch '^\s*-Xms' -and
                  $_ -notmatch '^\s*-Xmx'
                }
          }

          $JvmLines += "-Xms2G"
          $JvmLines += "-Xmx12G"

          Set-Content -Path $JvmFile -Value $JvmLines -Encoding ASCII

          # RCON configuration
          $PropertiesFile = Join-Path $ServerDir "server.properties"
          $Properties = @()

          if (Test-Path $PropertiesFile) {
              $Properties = Get-Content $PropertiesFile
          }

          $RconPassword = [guid]::NewGuid().ToString("N")

          $Settings = @{
              "enable-rcon" = "true"
              "rcon.port" = "25575"
              "rcon.password" = $RconPassword
              "broadcast-rcon-to-ops" = "false"
          }

          foreach ($Key in $Settings.Keys) {
              $Pattern = "^" + [regex]::Escape($Key) + "="
              $Properties = @($Properties | Where-Object { $_ -notmatch $Pattern })
              $Properties += "$Key=$($Settings[$Key])"
          }

          Set-Content -Path $PropertiesFile -Value $Properties -Encoding ASCII

          Remove-Item "C:\RDP-Persistent\STOP_REQUESTED" -Force -ErrorAction SilentlyContinue

          # Stop script
          $StopScript = @'
          $ErrorActionPreference = "Stop"

          $PropertiesFile = "C:\Users\Public\Desktop\Minecraft\server.properties"
          $Marker = "C:\RDP-Persistent\STOP_REQUESTED"

          function Read-Exact {
              param([System.IO.Stream]$Stream, [int]$Count)

              $Buffer = New-Object byte[] $Count
              $Offset = 0

              while ($Offset -lt $Count) {
                  $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

                  if ($Read -le 0) {
                      throw "RCON connection closed."
                  }

                  $Offset += $Read
              }

              return ,$Buffer
          }

          function Send-RconPacket {
              param(
                  [System.IO.Stream]$Stream,
                  [int]$Id,
                  [int]$Type,
                  [string]$Body
              )

              $BodyBytes = [Text.Encoding]::UTF8.GetBytes($Body)
              $Payload = New-Object byte[] (10 + $BodyBytes.Length)

              [BitConverter]::GetBytes($Id).CopyTo($Payload, 0)
              [BitConverter]::GetBytes($Type).CopyTo($Payload, 4)

              if ($BodyBytes.Length -gt 0) {
                  $BodyBytes.CopyTo($Payload, 8)
              }

              $Length = [BitConverter]::GetBytes($Payload.Length)

              $Stream.Write($Length, 0, 4)
              $Stream.Write($Payload, 0, $Payload.Length)
              $Stream.Flush()
          }

          function Receive-RconPacket {
              param([System.IO.Stream]$Stream)

              $LengthBytes = Read-Exact $Stream 4
              $Length = [BitConverter]::ToInt32($LengthBytes, 0)

              if ($Length -lt 10 -or $Length -gt 1048576) {
                  throw "Invalid RCON packet."
              }

              $Data = Read-Exact $Stream $Length

              return @{
                  Id = [BitConverter]::ToInt32($Data, 0)
                  Type = [BitConverter]::ToInt32($Data, 4)
                  Body = [Text.Encoding]::UTF8.GetString($Data, 8, $Length - 10)
              }
          }

          if (!(Test-Path $PropertiesFile)) {
              throw "server.properties not found."
          }

          $PasswordLine = Get-Content $PropertiesFile |
              Where-Object { $_ -match '^rcon\.password=' } |
              Select-Object -First 1

          if (!$PasswordLine) {
              throw "RCON password not found."
          }

          $Password = $PasswordLine.Substring("rcon.password=".Length)

          $Client = New-Object System.Net.Sockets.TcpClient
          $Client.ReceiveTimeout = 10000
          $Client.SendTimeout = 10000

          try {
              $Client.Connect("127.0.0.1", 25575)
              $Stream = $Client.GetStream()

              Send-RconPacket $Stream 100 3 $Password
              $Auth = Receive-RconPacket $Stream

              if ($Auth.Id -eq -1) {
                  throw "RCON authentication failed."
              }

              Send-RconPacket $Stream 101 2 "stop"
              $Response = Receive-RconPacket $Stream

              New-Item -ItemType File -Force -Path $Marker | Out-Null

              Write-Host "Minecraft stop command sent."
          }
          finally {
              $Client.Close()
          }
          '@

          Set-Content "$Desktop\Stop-Minecraft.ps1" $StopScript -Encoding UTF8

          # Stop BAT
          $StopBat = @'
          @echo off
          title STOP SERVER + BACKUP
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\Users\Public\Desktop\Stop-Minecraft.ps1"

          if errorlevel 1 (
              echo.
              echo ERROR: Could not stop Minecraft safely.
              pause
              exit /b 1
          )

          echo.
          echo Stop request sent.
          echo Wait for GitHub Actions to upload the backup.
          pause
          '@

          Set-Content "$Desktop\STOP SERVER + BACKUP.bat" $StopBat -Encoding ASCII

          # Start BAT
          $StartBat = @'
          @echo off
          title Minecraft Forge Server
          cd /d "C:\Users\Public\Desktop\Minecraft"

          if not exist run.bat (
              echo ERROR: run.bat was not found.
              pause
              exit /b 1
          )

          call run.bat nogui
          pause
          '@

          Set-Content "$Desktop\START MINECRAFT SERVER.bat" $StartBat -Encoding ASCII

          Write-Host "Server preparation completed."
          Write-Host "Java maximum heap: 12GB"

      # RDP
      - name: Configure Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $SecurePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue

          if ($User) {
              Set-LocalUser -Name $env:RDP_USER -Password $SecurePassword
          }
          else {
              New-LocalUser `
                -Name $env:RDP_USER `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled."
          Write-Host "Username: $env:RDP_USER"

      # Tailscale
      - name: Install and Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY is missing."
          }

          $Msi = "$env:RUNNER_TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$Msi`" /quiet /norestart" `
            -Wait

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
              throw "Tailscale installation failed."
          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          & $Tailscale up `
            "--authkey=$env:TAILSCALE_AUTHKEY" `
            "--hostname=danialgeek-minecraft" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $IP = & $Tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {
              throw "Tailscale IP not found."
          }

          Write-Host "================================"
          Write-Host "RDP IP: $IP"
          Write-Host "RDP USER: $env:RDP_USER"
          Write-Host "================================"

      # Playit is optional
      - name: Start Playit (Optional)
        shell: pwsh
        continue-on-error: true
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Continue"

          $EnvFile = $env:GITHUB_ENV

          try {
              if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET_KEY)) {
                  Write-Warning "Playit secret missing. Skipping."
                  "PLAYIT_STARTED=false" | Out-File $EnvFile -Append
                  exit 0
              }

              $Playit = "$env:RUNNER_TEMP\playit.exe"
              $StdOut = "$env:RUNNER_TEMP\playit.log"
              $StdErr = "$env:RUNNER_TEMP\playit-error.log"

              Invoke-WebRequest `
                -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v2.0.2/playit-windows-x86_64.exe" `
                -OutFile $Playit `
                -ErrorAction Stop

              $Process = Start-Process `
                -FilePath $Playit `
                -ArgumentList @("--secret", $env:PLAYIT_SECRET_KEY) `
                -WorkingDirectory $env:RUNNER_TEMP `
                -PassThru `
                -WindowStyle Hidden `
                -RedirectStandardOutput $StdOut `
                -RedirectStandardError $StdErr

              Start-Sleep -Seconds 15
              $Process.Refresh()

              if ($Process.HasExited) {
                  Write-Warning "Playit exited with code: $($Process.ExitCode)"

                  if (Test-Path $StdOut) {
                      Get-Content $StdOut
                  }

                  if (Test-Path $StdErr) {
                      Get-Content $StdErr
                  }

                  Write-Warning "Playit failed. Continuing without Playit."
                  "PLAYIT_STARTED=false" | Out-File $EnvFile -Append
                  exit 0
              }

              "PLAYIT_PID=$($Process.Id)" | Out-File $EnvFile -Append
              "PLAYIT_STARTED=true" | Out-File $EnvFile -Append

              Write-Host "Playit started. PID: $($Process.Id)"
          }
          catch {
              Write-Warning "Playit error: $($_.Exception.Message)"
              Write-Warning "Skipping Playit. Workflow will continue."
              "PLAYIT_STARTED=false" | Out-File $EnvFile -Append
              exit 0
          }

      # Wait for stop request
      - name: Wait for Stop Request
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Marker = "C:\RDP-Persistent\STOP_REQUESTED"
          $MaxMinutes = 300
          $EndTime = (Get-Date).AddMinutes($MaxMinutes)

          Write-Host "================================"
          Write-Host "RDP USER: NvDAdmin"
          Write-Host "Playit started: $env:PLAYIT_STARTED"
          Write-Host "================================"

          Write-Host "Connect using RDP."
          Write-Host "Run START MINECRAFT SERVER.bat"

          while ((Get-Date) -lt $EndTime) {

              if (Test-Path $Marker) {
                  Write-Host "Stop request detected."
                  break
              }

              if ($env:PLAYIT_STARTED -eq "true") {
                  $PlayitProcess = Get-Process -Id ([int]$env:PLAYIT_PID) -ErrorAction SilentlyContinue

                  if (!$PlayitProcess) {
                      Write-Warning "Playit stopped. Continuing without Playit."
                      $env:PLAYIT_STARTED = "false"
                  }
              }

              Start-Sleep -Seconds 15
          }

          if (!(Test-Path $Marker)) {
              Write-Host "Maximum waiting time reached."
          }

      # Stop Minecraft
      - name: Stop Minecraft Safely
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $StopScript = "C:\Users\Public\Desktop\Stop-Minecraft.ps1"

          if (Test-Path $StopScript) {
              Write-Host "Sending Minecraft stop command..."

              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $StopScript

              Write-Host "Waiting for world saving..."
              Start-Sleep -Seconds 60
          }

      # Backup and upload
      - name: Create and Upload Minecraft Backup
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $BackupStage = "$env:RUNNER_TEMP\MinecraftBackupStage"
          $Zip = "$env:RUNNER_TEMP\Minecraft-backup.zip"
          $HashFile = "$env:RUNNER_TEMP\Minecraft-backup.sha256"

          if (!(Test-Path $ServerDir)) {
              Write-Warning "Minecraft directory does not exist. Backup skipped."
              exit 0
          }

          if (@(Get-ChildItem $ServerDir -Force).Count -eq 0) {
              Write-Warning "Minecraft directory is empty. Backup skipped."
              exit 0
          }

          Remove-Item $BackupStage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $Zip -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupStage | Out-Null

          robocopy $ServerDir $BackupStage `
            /E `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:2 `
            /XD logs crash-reports `
            /XF session.lock

          if ($LASTEXITCODE -ge 8) {
              throw "Backup copy failed. Robocopy code: $LASTEXITCODE"
          }

          Compress-Archive `
            -Path "$BackupStage\*" `
            -DestinationPath $Zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $Zip)) {
              throw "Backup ZIP was not created."
          }

          $Size = (Get-Item $Zip).Length

          Write-Host "Backup size: $([math]::Round($Size / 1GB, 2)) GB"

          if ($Size -ge 2GB) {
              throw "Backup exceeds GitHub Release asset size limit."
          }

          $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash
          Set-Content -Path $HashFile -Value "$Hash  Minecraft-backup.zip"

          $Tag = "backup-$(Get-Date -Format 'yyyyMMdd-HHmmss')"

          gh release create $Tag `
            $Zip `
            $HashFile `
            --repo $env:GITHUB_REPOSITORY `
            --title "Minecraft Backup $Tag" `
            --notes "Automatic Minecraft Forge server backup."

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release upload failed."
          }

          Write-Host "BACKUP UPLOAD SUCCESSFUL"

      - name: Finish
        if: always()
        shell: pwsh
        run: |
          Write-Host "Minecraft workflow finished."
          Write-Host "Check Actions logs and GitHub Releases."
