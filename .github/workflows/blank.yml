
name: Windows RDP + Minecraft Forge + Playit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      SERVER_DIR: C:\Users\Public\Desktop\Minecraft
      BACKUP_DIR: ${{ runner.temp }}\MinecraftBackup
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Restore latest backup
      - name: Restore Latest Minecraft Backup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $ExtractDir = "$env:RUNNER_TEMP\MinecraftRestore"

          New-Item -ItemType Directory -Force -Path $ServerDir | Out-Null
          Remove-Item $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Searching GitHub Releases..."

          $ReleasesJson = gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 50 `
            --json tagName

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve releases."
          }

          $Releases = @($ReleasesJson | ConvertFrom-Json)

          $SelectedTag = $null
          $SelectedAsset = $null

          foreach ($Release in $Releases) {
            $Tag = $Release.tagName

            Write-Host "Checking release: $Tag"

            $AssetsJson = gh release view $Tag `
              --repo $env:GITHUB_REPOSITORY `
              --json assets

            if ($LASTEXITCODE -ne 0) {
              continue
            }

            $Assets = @(($AssetsJson | ConvertFrom-Json).assets)

            $BackupAsset = $Assets |
              Where-Object {
                $_.name -in @(
                  "Minecraft-EmergencyBackup.zip",
                  "Minecraft-backup.zip"
                )
              } |
              Select-Object -First 1

            if ($BackupAsset) {
              $SelectedTag = $Tag
              $SelectedAsset = $BackupAsset.name
              break
            }
          }

          if (!$SelectedTag) {
            Write-Warning "No backup found. Starting without restore."
            exit 0
          }

          Write-Host "Selected release: $SelectedTag"
          Write-Host "Selected asset: $SelectedAsset"

          gh release download $SelectedTag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $SelectedAsset `
            --dir $env:RUNNER_TEMP

          if ($LASTEXITCODE -ne 0) {
            throw "Backup download failed."
          }

          $Zip = Join-Path $env:RUNNER_TEMP $SelectedAsset

          if (!(Test-Path $Zip)) {
            throw "Downloaded ZIP not found."
          }

          New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null

          Expand-Archive -Path $Zip -DestinationPath $ExtractDir -Force

          $SourceDir = $ExtractDir
          $MinecraftFolder = Join-Path $ExtractDir "Minecraft"

          if (Test-Path $MinecraftFolder) {
            $SourceDir = $MinecraftFolder
          }

          robocopy $SourceDir $ServerDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2

          if ($LASTEXITCODE -ge 8) {
            throw "Backup restoration failed."
          }

          Write-Host "Backup restored successfully."

      # 4. Prepare server
      - name: Prepare Minecraft Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR

          if (!(Test-Path $ServerDir)) {
            throw "Minecraft directory does not exist."
          }

          if (!(Test-Path "$ServerDir\run.bat")) {
            throw "Forge run.bat was not found. Check your backup."
          }

          Set-Location $ServerDir

          # Accept EULA
          Set-Content -Path "eula.txt" -Value "eula=true"

          # JVM memory
          Set-Content -Path "user_jvm_args.txt" -Value @(
            "-Xms2G"
            "-Xmx12G"
            "-XX:+UseG1GC"
            "-XX:+ParallelRefProcEnabled"
            "-XX:MaxGCPauseMillis=200"
            "-XX:+UnlockExperimentalVMOptions"
            "-XX:+DisableExplicitGC"
          )

          # Generate RCON password
          $RconPassword = [Guid]::NewGuid().ToString("N")

          if (!(Test-Path "server.properties")) {
            New-Item -ItemType File -Path "server.properties" | Out-Null
          }

          $Properties = Get-Content "server.properties"

          $Settings = @{
            "enable-rcon" = "true"
            "rcon.port" = "25575"
            "rcon.password" = $RconPassword
          }

          foreach ($Key in $Settings.Keys) {
            $Pattern = "^" + [Regex]::Escape($Key) + "="

            $Found = $false

            for ($i = 0; $i -lt $Properties.Count; $i++) {
              if ($Properties[$i] -match $Pattern) {
                $Properties[$i] = "$Key=$($Settings[$Key])"
                $Found = $true
              }
            }

            if (!$Found) {
              $Properties += "$Key=$($Settings[$Key])"
            }
          }

          Set-Content -Path "server.properties" -Value $Properties

          # Remove previous stop request
          Remove-Item "$ServerDir\STOP_SERVER.txt" -Force -ErrorAction SilentlyContinue

          # Start BAT
          @'
          @echo off
          cd /d "%~dp0"
          call run.bat nogui
          pause
          '@ | Set-Content "$ServerDir\START MINECRAFT SERVER.bat"

          # Stop and backup BAT
          @'
          @echo off
          echo.
          echo Minecraft server stop and backup requested.
          echo.
          echo STOP > "%~dp0STOP_SERVER.txt"
          echo Request sent. The GitHub workflow will stop the server and create a backup.
          echo.
          pause
          '@ | Set-Content "$ServerDir\STOP SERVER + BACKUP.bat"

          Copy-Item "$ServerDir\START MINECRAFT SERVER.bat" `
            "C:\Users\Public\Desktop\START MINECRAFT SERVER.bat" -Force

          Copy-Item "$ServerDir\STOP SERVER + BACKUP.bat" `
            "C:\Users\Public\Desktop\STOP SERVER + BACKUP.bat" -Force

          Write-Host "Minecraft server prepared."
          Write-Host "RCON configured."

      # 5. Configure RDP
      - name: Configure Remote Desktop
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $Username = "NvDAdmin"
          $SecurePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($User) {
            Set-LocalUser -Name $Username -Password $SecurePassword
          }
          else {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $Username `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured."
          Write-Host "Username: $Username"

      # 6. Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:RUNNER_TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $Installer

          Start-Process -FilePath $Installer `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 10

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
            throw "Tailscale installation failed."
          }

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

      # 7. Connect Tailscale
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $Tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          & $Tailscale up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname=danialgeek-minecraft `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Start-Sleep -Seconds 5

          $IP = & $Tailscale ip -4

          if (!$IP) {
            throw "Could not obtain Tailscale IP."
          }

          Write-Host "================================="
          Write-Host "RDP ADDRESS: $IP"
          Write-Host "RDP USERNAME: NvDAdmin"
          Write-Host "================================="

      # 8. Start Playit (Optional)
      - name: Start Playit
        continue-on-error: true
        shell: pwsh
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Continue"

          if ([string]::IsNullOrWhiteSpace($env:PLAYIT_SECRET_KEY)) {
            Write-Warning "Playit secret is empty. Skipping Playit."
            exit 0
          }

          try {
            $PlayitPath = "$env:RUNNER_TEMP\playit.exe"

            Invoke-WebRequest `
              -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" `
              -OutFile $PlayitPath

            if (!(Test-Path $PlayitPath)) {
              throw "Playit download failed."
            }

            $Process = Start-Process `
              -FilePath $PlayitPath `
              -ArgumentList @("--secret", $env:PLAYIT_SECRET_KEY) `
              -PassThru `
              -WindowStyle Hidden

            Start-Sleep -Seconds 10

            if ($Process.HasExited) {
              Write-Warning "Playit exited unexpectedly."
              exit 0
            }

            Write-Host "Playit started successfully."
            Write-Host "Playit PID: $($Process.Id)"
          }
          catch {
            Write-Warning "Playit failed: $_"
            exit 0
          }

      # 9. Start Minecraft
      - name: Start Minecraft Forge Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR

          Set-Location $ServerDir

          $Process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "run.bat nogui" `
            -WorkingDirectory $ServerDir `
            -PassThru `
            -WindowStyle Hidden

          $Process.Id | Set-Content "$env:RUNNER_TEMP\minecraft-launcher.pid"

          Write-Host "Minecraft started."
          Write-Host "Launcher PID: $($Process.Id)"

      # 10. Wait for stop request
      - name: Wait for Stop Request
        shell: pwsh
        run: |
          $ServerDir = $env:SERVER_DIR
          $StopFile = "$ServerDir\STOP_SERVER.txt"
          $PidFile = "$env:RUNNER_TEMP\minecraft-launcher.pid"

          $MaximumMinutes = 320
          $Elapsed = 0

          Write-Host "Waiting for stop request."
          Write-Host "Maximum wait: $MaximumMinutes minutes."

          while ($Elapsed -lt $MaximumMinutes) {

            if (Test-Path $StopFile) {
              Write-Host "Stop request detected."
              break
            }

            if (Test-Path $PidFile) {
              $LauncherPid = [int](Get-Content $PidFile)

              $Launcher = Get-Process -Id $LauncherPid -ErrorAction SilentlyContinue

              if (!$Launcher) {
                Write-Warning "Minecraft launcher exited."
                break
              }
            }

            Start-Sleep -Seconds 15
            $Elapsed += 0.25

            if (($Elapsed % 5) -lt 0.25) {
              Write-Host "Elapsed: $Elapsed minutes"
            }
          }

          Write-Host "Wait stage finished."

      # 11. Stop Minecraft safely
      - name: Stop Minecraft Safely
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $ServerDir = $env:SERVER_DIR
          $PropertiesFile = "$ServerDir\server.properties"

          $RconPassword = $null

          if (Test-Path $PropertiesFile) {
            $Line = Get-Content $PropertiesFile |
              Where-Object { $_ -match "^rcon\.password=" } |
              Select-Object -First 1

            if ($Line) {
              $RconPassword = $Line.Substring("rcon.password=".Length)
            }
          }

          function Read-Exact {
            param(
              [System.IO.Stream]$Stream,
              [int]$Count
            )

            $Buffer = New-Object byte[] $Count
            $Offset = 0

            while ($Offset -lt $Count) {
              $Read = $Stream.Read($Buffer, $Offset, $Count - $Offset)

              if ($Read -le 0) {
                throw "RCON connection closed."
              }

              $Offset += $Read
            }

            return ,$Buffer
          }

          function Send-RconPacket {
            param(
              [System.IO.Stream]$Stream,
              [int]$RequestId,
              [int]$Type,
              [string]$Payload
            )

            $PayloadBytes = [Text.Encoding]::UTF8.GetBytes($Payload)
            $Length = 4 + 4 + $PayloadBytes.Length + 2

            $Packet = New-Object byte[] (4 + $Length)

            [BitConverter]::GetBytes($Length).CopyTo($Packet, 0)
            [BitConverter]::GetBytes($RequestId).CopyTo($Packet, 4)
            [BitConverter]::GetBytes($Type).CopyTo($Packet, 8)

            $PayloadBytes.CopyTo($Packet, 12)

            $Packet[12 + $PayloadBytes.Length] = 0
            $Packet[13 + $PayloadBytes.Length] = 0

            $Stream.Write($Packet, 0, $Packet.Length)
            $Stream.Flush()
          }

          $Stopped = $false

          if ($RconPassword) {
            try {
              $Client = New-Object System.Net.Sockets.TcpClient
              $Client.ReceiveTimeout = 5000
              $Client.SendTimeout = 5000

              $Client.Connect("127.0.0.1", 25575)

              $Stream = $Client.GetStream()

              Send-RconPacket $Stream 1 3 $RconPassword

              $LengthBytes = Read-Exact $Stream 4
              $Length = [BitConverter]::ToInt32($LengthBytes, 0)
              $AuthResponse = Read-Exact $Stream $Length

              $AuthId = [BitConverter]::ToInt32($AuthResponse, 0)

              if ($AuthId -ne 1) {
                throw "RCON authentication failed."
              }

              Send-RconPacket $Stream 2 2 "stop"

              Write-Host "RCON stop command sent."

              $Stopped = $true
              $Client.Close()
            }
            catch {
              Write-Warning "RCON stop failed: $_"
            }
          }

          if ($Stopped) {
            Start-Sleep -Seconds 30
          }

          # Fallback if Java is still running
          $JavaProcesses = Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*forgeserver*"
            }

          foreach ($JavaProcess in $JavaProcesses) {
            try {
              $StillRunning = Get-Process -Id $JavaProcess.ProcessId `
                -ErrorAction SilentlyContinue

              if ($StillRunning) {
                Write-Warning "Java is still running. Force stopping PID $($JavaProcess.ProcessId)."
                Stop-Process -Id $JavaProcess.ProcessId -Force
              }
            }
            catch {}
          }

          Write-Host "Minecraft stop stage completed."

      # 12. Create backup
      - name: Create Minecraft Emergency Backup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ServerDir = $env:SERVER_DIR
          $BackupDir = $env:BACKUP_DIR

          if (!(Test-Path $ServerDir)) {
            throw "Minecraft server directory not found."
          }

          Remove-Item $BackupDir -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null

          Write-Host "Copying Minecraft server files..."

          robocopy $ServerDir $BackupDir /E /COPY:DAT /DCOPY:DAT /R:2 /W:2

          if ($LASTEXITCODE -ge 8) {
            throw "Backup copy failed."
          }

          $Zip = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.zip"

          Remove-Item $Zip -Force -ErrorAction SilentlyContinue

          Compress-Archive `
            -Path "$BackupDir\*" `
            -DestinationPath $Zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $Zip)) {
            throw "Backup ZIP was not created."
          }

          $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash

          Set-Content `
            -Path "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256" `
            -Value $Hash

          Write-Host "Backup created."
          Write-Host "Size: $((Get-Item $Zip).Length / 1MB) MB"
          Write-Host "SHA256: $Hash"

      # 13. Upload backup
      - name: Upload Minecraft Backup to GitHub Releases
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Zip = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.zip"
          $Hash = "$env:RUNNER_TEMP\Minecraft-EmergencyBackup.sha256"

          if (!(Test-Path $Zip)) {
            throw "Backup ZIP is missing."
          }

          $Tag = "minecraft-backup-" + (Get-Date -Format "yyyyMMdd-HHmmss")

          gh release create $Tag `
            $Zip `
            $Hash `
            --repo $env:GITHUB_REPOSITORY `
            --title "Minecraft Emergency Backup" `
            --notes "Automatic Minecraft Forge server backup."

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed."
          }

          Write-Host "Backup uploaded successfully."
          Write-Host "Release tag: $Tag"

      # 14. Final information
      - name: Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host "Minecraft workflow finished."
          Write-Host "================================="
